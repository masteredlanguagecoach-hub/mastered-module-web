<body class="bg-[#F8FAFC] text-[#0F172A] antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const LIVE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbqPvlxmAFOgtXn-VJ9b9fuvjOL3hsy18wSCu4xYhfVIcnLMVWGVbeD6XsLxv1ZG_2/exec";
    const LIVE_SPREADSHEET_ID = "1N5YkP6U8RaafRD_bsULTzlaDSC0Vbmfj9l_XCt1S_Rg";
    const BASE_DRIVE_FOLDER = "https://drive.google.com/drive/folders/1caUZyxqCEas1q9F8Z_3Xd4lhLjOsjqCx";

    // GENERATE ALL 32 MODULES CURRICULUM
    const MODULE_TOPICS = [
      "Foundation Vocal Clarity & Articulation",
      "Executive Tone & Voice Projection",
      "Professional Accent Neutralization & Rhythm",
      "High-Stakes Business Communication & Pitch",
      "Advanced Vocabulary & Idiomatic Expression",
      "Mastering Dynamic Pause & Cadence",
      "Persuasive Public Speaking & Presence",
      "Professional Interview & Q&A Mastery",
      "Executive Negotiation & Debate Speaking",
      "Storytelling for Leadership & Presentations",
      "Cross-Cultural Business Communication",
      "Active Listening & Conversational Agility",
      "Crisis Communication & Pressure Handling",
      "Corporate Meeting & Roundtable Leadership",
      "Strategic Elevator Pitches & Brevity",
      "Voice Intonation & Emotional Resonance",
      "Public Relations & Media Speaking Skills",
      "Mastering Pronunciation & Vowel Precision",
      "Executive Presence in Virtual & Remote Meetings",
      "Influential Workplace Coaching & Feedback",
      "Strategic Sales Communication & Objection Handling",
      "Advanced Phrasal Verbs & Formal Registers",
      "Conference Keynote & Address Preparation",
      "Spontaneous Speaking & Impromptu Mastery",
      "Assertive Communication & Conflict Resolution",
      "Dialect Awareness & Global Accent Alignment",
      "Executive Panel Discussion & Group Dynamics",
      "Technical Concept Communication to Non-Tech Audiences",
      "Body Language & Non-Verbal Vocal Alignment",
      "Professional Networking & Small Talk Mastery",
      "Advanced Public Rhetoric & Persuasion Tools",
      "Final Executive Speaking Capstone & Mastery Review"
    ];

    const THUMBNAILS = [
      "https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=800&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800&auto=format&fit=crop&q=80",
      "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?w=800&auto=format&fit=crop&q=80"
    ];

    const ALL_32_MODULES = Array.from({ length: 32 }, (_, i) => {
      const num = i + 1;
      const modId = `MOD-${num < 10 ? '0' + num : num}`;
      return {
        moduleId: modId,
        moduleNumber: num,
        title: `Module ${num}: ${MODULE_TOPICS[i]}`,
        description: `Executive fluency training module focusing on ${MODULE_TOPICS[i].toLowerCase()}. Includes Video 1, Audio Drill, PDF Notes, and Quiz assessment.`,
        thumbnail: THUMBNAILS[i % THUMBNAILS.length],
        video1: BASE_DRIVE_FOLDER,
        video2: '',
        audio: BASE_DRIVE_FOLDER,
        pdf: BASE_DRIVE_FOLDER,
        quizId: `QUIZ-${num < 10 ? '0' + num : num}`,
        published: true,
        order: num
      };
    });

    const ALL_32_QUIZZES = Array.from({ length: 32 }, (_, i) => {
      const num = i + 1;
      const qId = `QUIZ-${num < 10 ? '0' + num : num}`;
      const modId = `MOD-${num < 10 ? '0' + num : num}`;
      return {
        quizId: qId,
        moduleId: modId,
        title: `Module ${num} Mastery Quiz - ${MODULE_TOPICS[i]}`,
        passPercentage: 80,
        timeLimit: 10
      };
    });

    const ALL_32_QUESTIONS = Array.from({ length: 32 }, (_, i) => {
      const num = i + 1;
      const qId = `QUIZ-${num < 10 ? '0' + num : num}`;
      const topic = MODULE_TOPICS[i];

      return [
        {
          id: `Q-${num}-1`,
          quizId: qId,
          question: `What is the primary executive goal of ${topic}?`,
          optionA: "To speak faster without taking pauses",
          optionB: "To articulate ideas clearly with confidence, proper tone, and cadence",
          optionC: "To memorize scripted speeches word for word",
          optionD: "To eliminate all natural voice inflections",
          correctAnswer: "B",
          explanation: "Executive communication emphasizes clear articulation, posture, and confident vocal cadence."
        },
        {
          id: `Q-${num}-2`,
          quizId: qId,
          question: `When applying ${topic} in business meetings, which technique is most effective?`,
          optionA: "Using intentional strategic pauses for emphasis",
          optionB: "Speaking loudly over other participants",
          optionC: "Reading directly from slides without eye contact",
          optionD: "Avoiding vocal pitch variations",
          correctAnswer: "A",
          explanation: "Strategic pauses allow key messages to resonate with high-level decision makers."
        }
      ];
    }).flat();

    const INITIAL_STUDENTS = [
      {
        studentId: "STD-1001",
        admissionNumber: "MLC-2026-001",
        name: "Alex Morgan",
        email: "student@mastered.com",
        phone: "+1 (555) 234-5678",
        course: "Executive English Fluency",
        profileImage: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80",
        approved: true,
        status: "Active",
        createdDate: "2026-02-01"
      }
    ];

    const INITIAL_REQUESTS = [
      {
        requestId: "REQ-501",
        name: "Marcus Vance",
        phone: "+1 (555) 998-1122",
        email: "marcus.v@example.com",
        admissionNumber: "MLC-2026-044",
        course: "Executive English Fluency",
        status: "Pending",
        createdDate: "2026-08-04"
      }
    ];

    const INITIAL_ADMINS = [
      { adminId: "ADM-001", name: "Head Coach Sarah Jenkins", email: "admin@mastered.com", password: "admin123", role: "Super Admin" },
      { adminId: "ADM-002", name: "Mastered Language Coach", email: "masteredlanguagecoach@gmail.com", password: "4languagecoach", role: "Super Admin" }
    ];

    function getDriveEmbedUrl(url) {
      if (!url) return '';
      const fileIdMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        return `https://drive.google.com/file/d/${fileIdMatch[1]}/preview`;
      }
      return url;
    }

    async function callAppsScript(action, payload = {}) {
      try {
        const response = await fetch(LIVE_APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action, ...payload })
        });
        const json = await response.json();
        if (json && json.success !== undefined) return json;
      } catch(err) {
        console.warn("POST fallback:", err);
      }

      try {
        const getUrl = `${LIVE_APPS_SCRIPT_URL}?action=${encodeURIComponent(action)}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
        const response = await fetch(getUrl);
        const json = await response.json();
        return json;
      } catch(err2) {
        return { success: false, message: err2.message };
      }
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [role, setRole] = useState(null);
      const [authScreen, setAuthScreen] = useState('login');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedModuleId, setSelectedModuleId] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // LocalStorage-backed state stores pre-loaded with all 32 Modules & Quizzes
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('mastered_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [requests, setRequests] = useState(() => {
        const saved = localStorage.getItem('mastered_requests');
        return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
      });

      const [modules, setModules] = useState(() => {
        const saved = localStorage.getItem('mastered_modules');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length >= 32) return parsed;
        }
        return ALL_32_MODULES;
      });

      const [quizzes, setQuizzes] = useState(() => {
        const saved = localStorage.getItem('mastered_quizzes');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length >= 32) return parsed;
        }
        return ALL_32_QUIZZES;
      });

      const [questions, setQuestions] = useState(() => {
        const saved = localStorage.getItem('mastered_questions');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
        return ALL_32_QUESTIONS;
      });

      const [userProgress, setUserProgress] = useState(() => {
        const saved = localStorage.getItem('mastered_progress');
        return saved ? JSON.parse(saved) : {};
      });

      // Save state to LocalStorage
      useEffect(() => {
        localStorage.setItem('mastered_modules', JSON.stringify(modules));
      }, [modules]);

      useEffect(() => {
        localStorage.setItem('mastered_quizzes', JSON.stringify(quizzes));
      }, [quizzes]);

      useEffect(() => {
        localStorage.setItem('mastered_questions', JSON.stringify(questions));
      }, [questions]);

      useEffect(() => {
        localStorage.setItem('mastered_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('mastered_requests', JSON.stringify(requests));
      }, [requests]);

      useEffect(() => {
        localStorage.setItem('mastered_progress', JSON.stringify(userProgress));
      }, [userProgress]);

      // Lesson Sub-Tab inside Student Module View
      const [lessonTab, setLessonTab] = useState('video1');

      // Student Quiz Runner Modal State
      const [showQuizModal, setShowQuizModal] = useState(false);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [quizScore, setQuizScore] = useState(0);

      // Admin Module Modal Form State
      const [showModuleModal, setShowModuleModal] = useState(false);
      const [moduleForm, setModuleForm] = useState({
        moduleId: '',
        moduleNumber: 1,
        title: '',
        description: '',
        thumbnail: 'https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800&auto=format&fit=crop&q=80',
        video1: '',
        video2: '',
        audio: '',
        pdf: '',
        quizId: '',
        published: true,
        order: 1
      });

      // Admin Quiz Creator Modal State
      const [showQuizModalAdmin, setShowQuizModalAdmin] = useState(false);
      const [quizForm, setQuizForm] = useState({
        quizId: '',
        moduleId: '',
        title: '',
        passPercentage: 80,
        timeLimit: 10
      });

      // Admin Question Form State
      const [showQuestionModalAdmin, setShowQuestionModalAdmin] = useState(false);
      const [questionForm, setQuestionForm] = useState({
        id: '',
        quizId: '',
        question: '',
        optionA: '',
        optionB: '',
        optionC: '',
        optionD: '',
        correctAnswer: 'A',
        explanation: ''
      });

      // Toast Notification
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Student Login
      const handleStudentLogin = async (email, adm) => {
        const live = await callAppsScript('loginStudent', { email, admissionNumber: adm });
        if (live.success && live.student) {
          setCurrentUser(live.student);
          setRole('student');
          setActiveTab('dashboard');
          return { success: true };
        }

        const found = students.find(s => s.email.toLowerCase() === email.trim().toLowerCase() && s.admissionNumber.toUpperCase() === adm.trim().toUpperCase());
        if (found) {
          setCurrentUser(found);
          setRole('student');
          setActiveTab('dashboard');
          return { success: true };
        }
        return { success: false, message: "Invalid student credentials." };
      };

      // Admin Login
      const handleAdminLogin = async (email, pass) => {
        const live = await callAppsScript('loginAdmin', { email, password: pass });
        if (live.success && live.admin) {
          setCurrentUser(live.admin);
          setRole('admin');
          setActiveTab('admin-dashboard');
          return { success: true };
        }

        const cleanEmail = email.trim().toLowerCase();
        const found = INITIAL_ADMINS.find(a => a.email.toLowerCase() === cleanEmail && a.password === pass.trim());
        if (found) {
          setCurrentUser(found);
          setRole('admin');
          setActiveTab('admin-dashboard');
          return { success: true };
        }
        return { success: false, message: "Invalid admin email or password." };
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setRole(null);
        setAuthScreen('login');
        setSelectedModuleId(null);
        setMobileMenuOpen(false);
      };

      // Approve Request
      const handleApproveRequest = (reqId) => {
        const req = requests.find(r => r.requestId === reqId);
        if (!req) return;

        setRequests(prev => prev.map(r => r.requestId === reqId ? { ...r, status: 'Approved' } : r));

        const newStudent = {
          studentId: `STD-${Math.floor(1000 + Math.random() * 9000)}`,
          admissionNumber: req.admissionNumber,
          name: req.name,
          email: req.email,
          phone: req.phone,
          course: req.course,
          profileImage: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80",
          approved: true,
          status: "Active",
          createdDate: new Date().toISOString().split('T')[0]
        };

        setStudents(prev => [newStudent, ...prev]);
        callAppsScript('approveRequest', { requestId: reqId });
        showToast(`✅ Approved request for ${req.name}! Added to Student Directory.`);
      };

      // Reject Request
      const handleRejectRequest = (reqId) => {
        setRequests(prev => prev.map(r => r.requestId === reqId ? { ...r, status: 'Rejected' } : r));
        showToast(`Request rejected.`);
      };

      // Save Module (Create / Edit) - REALTIME EDIT SUPPORT
      const handleSaveModule = async (e) => {
        e.preventDefault();
        const modId = moduleForm.moduleId || `MOD-${moduleForm.moduleNumber < 10 ? '0' + moduleForm.moduleNumber : moduleForm.moduleNumber}`;
        const finalMod = {
          ...moduleForm,
          moduleId: modId,
          moduleNumber: Number(moduleForm.moduleNumber) || (modules.length + 1),
          order: Number(moduleForm.order) || (modules.length + 1)
        };

        setModules(prev => {
          const idx = prev.findIndex(m => m.moduleId === modId);
          if (idx >= 0) {
            const updated = [...prev];
            updated[idx] = finalMod;
            return updated;
          }
          return [...prev, finalMod];
        });

        setShowModuleModal(false);
        showToast(`✅ Module "${finalMod.title}" saved & updated!`);
        callAppsScript('adminSaveModule', { module: finalMod });
      };

      // Delete Module
      const handleDeleteModule = (modId) => {
        if (confirm("Are you sure you want to delete this module?")) {
          setModules(prev => prev.filter(m => m.moduleId !== modId));
          showToast("Module deleted.");
        }
      };

      // Save Quiz (Create / Edit)
      const handleSaveQuiz = async (e) => {
        e.preventDefault();
        const qId = quizForm.quizId || `QUIZ-${Math.floor(100 + Math.random() * 900)}`;
        const finalQuiz = {
          ...quizForm,
          quizId: qId,
          passPercentage: Number(quizForm.passPercentage) || 80,
          timeLimit: Number(quizForm.timeLimit) || 10
        };

        setQuizzes(prev => {
          const idx = prev.findIndex(q => q.quizId === qId);
          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = finalQuiz;
            return copy;
          }
          return [...prev, finalQuiz];
        });

        if (finalQuiz.moduleId) {
          setModules(prev => prev.map(m => m.moduleId === finalQuiz.moduleId ? { ...m, quizId: qId } : m));
        }

        setShowQuizModalAdmin(false);
        callAppsScript('adminSaveQuiz', { quiz: finalQuiz });
        showToast(`✅ Quiz "${finalQuiz.title}" updated successfully!`);
      };

      // Save Question (Create / Edit)
      const handleSaveQuestion = async (e) => {
        e.preventDefault();
        const qstId = questionForm.id || `Q-${Math.floor(1000 + Math.random() * 9000)}`;
        const finalQst = { ...questionForm, id: qstId };

        setQuestions(prev => {
          const idx = prev.findIndex(q => q.id === qstId);
          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = finalQst;
            return copy;
          }
          return [...prev, finalQst];
        });

        setShowQuestionModalAdmin(false);
        callAppsScript('adminSaveQuestion', { question: finalQst });
        showToast(`✅ Question saved & updated!`);
      };

      // Delete Question
      const handleDeleteQuestion = (qId) => {
        if (confirm("Delete this question?")) {
          setQuestions(prev => prev.filter(q => q.id !== qId));
          showToast("Question deleted.");
        }
      };

      // Update Student Progress
      const handleMarkItemComplete = (modId, itemKey) => {
        setUserProgress(prev => {
          const existing = prev[modId] || { video1: false, video2: false, audio: false, pdf: false, quiz: false, percentage: 0 };
          const updated = { ...existing, [itemKey]: true };
          
          let count = 0;
          if (updated.video1) count++;
          if (updated.video2) count++;
          if (updated.audio) count++;
          if (updated.pdf) count++;
          if (updated.quiz) count++;
          updated.percentage = Math.round((count / 5) * 100);

          return { ...prev, [modId]: updated };
        });
        showToast("✨ Progress updated!");
      };

      // Student Quiz Submit Handler
      const handleQuizSubmit = (quizObj) => {
        const quizQuestions = questions.filter(q => q.quizId === quizObj.quizId);
        if (quizQuestions.length === 0) {
          alert("This quiz has no registered questions yet.");
          return;
        }

        let correct = 0;
        quizQuestions.forEach(q => {
          if (quizAnswers[q.id] === q.correctAnswer) correct++;
        });
        const scorePct = Math.round((correct / quizQuestions.length) * 100);
        setQuizScore(scorePct);
        setQuizSubmitted(true);

        if (scorePct >= quizObj.passPercentage) {
          handleMarkItemComplete(quizObj.moduleId, 'quiz');
        }
      };

      const pendingRequestsList = requests.filter(r => r.status === 'Pending');

      const Header = () => (
        <header className="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 sticky top-0 z-30 shadow-sm flex items-center justify-between">
          <div className="flex items-center space-x-3">
            {currentUser && (
              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="lg:hidden p-2 rounded-xl text-slate-700 bg-slate-100 hover:bg-slate-200 focus:outline-none"
                aria-label="Toggle Navigation Menu"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  {mobileMenuOpen ? (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" />
                  ) : (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 6h16M4 12h16M4 18h16" />
                  )}
                </svg>
              </button>
            )}

            <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-base sm:text-lg shadow-md shrink-0">
              M
            </div>
            <div>
              <h1 className="font-extrabold text-slate-900 text-sm sm:text-base leading-tight">
                MASTERED <span className="text-blue-600 text-[10px] sm:text-xs font-semibold uppercase tracking-wider block sm:inline">Language Coach</span>
              </h1>
            </div>
          </div>

          {currentUser && (
            <div className="flex items-center space-x-2 sm:space-x-4">
              <div className="text-right text-xs hidden sm:block">
                <p className="font-bold text-slate-900">{currentUser.name}</p>
                <p className="text-[10px] text-slate-500 font-mono">{role === 'student' ? currentUser.admissionNumber : currentUser.role}</p>
              </div>
              <button
                onClick={handleLogout}
                className="px-2.5 sm:px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-700 font-bold text-xs transition"
              >
                Sign Out
              </button>
            </div>
          )}
        </header>
      );

      // AUTH SCREENS
      if (!currentUser) {
        if (authScreen === 'request') {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex flex-col justify-center items-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-5 sm:p-8 rounded-3xl max-w-md w-full shadow-2xl">
                <button onClick={() => setAuthScreen('login')} className="text-xs text-slate-400 hover:text-white mb-4 block">← Back to Login</button>
                <h2 className="text-xl font-extrabold mb-1">Request Access</h2>
                <p className="text-xs text-slate-400 mb-5">Submit details for admin enrollment approval.</p>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const newReq = {
                    requestId: `REQ-${Math.floor(100 + Math.random() * 900)}`,

            </main>
          </div>

          {/* Sticky Touch-Friendly Bottom Bar for Mobile */}
          {currentUser && (
            <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 px-4 py-2 flex items-center justify-around text-slate-400 z-30">
              {role === 'student' ? (
                <>
                  <button onClick={() => { setSelectedModuleId(null); setActiveTab('dashboard'); }} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'dashboard' ? 'text-blue-400' : 'text-slate-400'}`}>
                    <span>Dashboard</span>
                  </button>
                  <button onClick={() => { setSelectedModuleId(null); setActiveTab('modules'); }} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'modules' ? 'text-blue-400' : 'text-slate-400'}`}>
                    <span>Modules ({modules.length})</span>
                  </button>
                </>
              ) : (
                <>
                  <button onClick={() => setActiveTab('admin-dashboard')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-dashboard' ? 'text-blue-400' : 'text-slate-400'}`}>
                    <span>Metrics</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-students')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-students' ? 'text-blue-400' : 'text-slate-400'}`}>
                    <span>Students ({students.length})</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-requests')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-requests' ? 'text-blue-400' : 'text-slate-400'}`}>
                    <span>Requests ({pendingRequestsList.length})</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-modules')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-modules' ? 'text-blue-400' : 'text-slate-400'}`}>
                    <span>Modules ({modules.length})</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-quizzes')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-quizzes' ? 'text-blue-400' : 'text-slate-400'}`}>
                    <span>Quizzes</span>
                  </button>
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
