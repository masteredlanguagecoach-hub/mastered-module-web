<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MASTERED Language Coach | Premium Student Portal & Admin System</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0F172A',
              primary: '#2563EB',
              accent: '#06B6D4',
              bg: '#F8FAFC',
              card: '#FFFFFF',
              success: '#10B981',
              warning: '#F59E0B',
              danger: '#EF4444',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Plus Jakarta Sans', sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F1F5F9;
    }
    ::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-[#0F172A] antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const LIVE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbqPvlxmAFOgtXn-VJ9b9fuvjOL3hsy18wSCu4xYhfVIcnLMVWGVbeD6XsLxv1ZG_2/exec";
    const LIVE_SPREADSHEET_ID = "1N5YkP6U8RaafRD_bsULTzlaDSC0Vbmfj9l_XCt1S_Rg";

    const INITIAL_STUDENTS = [
      {
        studentId: "STD-1001",
        admissionNumber: "MLC-2026-001",
        name: "Alex Morgan",
        email: "student@mastered.com",
        phone: "+1 (555) 234-5678",
        course: "Executive English Fluency",
        profileImage: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80",
        approved: true,
        status: "Active",
        createdDate: "2026-02-01"
      }
    ];

    const INITIAL_REQUESTS = [
      {
        requestId: "REQ-501",
        name: "Marcus Vance",
        phone: "+1 (555) 998-1122",
        email: "marcus.v@example.com",
        admissionNumber: "MLC-2026-044",
        course: "Executive English Fluency",
        status: "Pending",
        createdDate: "2026-08-04"
      }
    ];

    const INITIAL_ADMINS = [
      { adminId: "ADM-001", name: "Head Coach Sarah Jenkins", email: "admin@mastered.com", password: "admin123", role: "Super Admin" },
      { adminId: "ADM-002", name: "Mastered Language Coach", email: "masteredlanguagecoach@gmail.com", password: "4languagecoach", role: "Super Admin" }
    ];

    const MOCK_ANNOUNCEMENTS = [
      {
        announcementId: "ANN-301",
        title: "🎉 Welcome to MASTERED Language Coach Portal",
        description: "Your executive speaking curriculum and custom practice drills will appear here as your coach publishes new modules.",
        visibility: "All Students",
        createdDate: "2026-08-06"
      }
    ];

    function getDriveEmbedUrl(url) {
      if (!url) return '';
      const fileIdMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        return `https://drive.google.com/file/d/${fileIdMatch[1]}/preview`;
      }
      return url;
    }

    async function callAppsScript(action, payload = {}) {
      try {
        const response = await fetch(LIVE_APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action, ...payload })
        });
        const json = await response.json();
        return json;
      } catch(err) {
        console.warn("Live API Call fallback:", err);
        return { success: false, message: err.message };
      }
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [role, setRole] = useState(null);
      const [authScreen, setAuthScreen] = useState('login');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedModuleId, setSelectedModuleId] = useState(null);

      // LocalStorage-backed state stores for permanent persistence across refreshes
      const [students, setStudents] = useState(() => {
        const saved = localStorage.getItem('mastered_students');
        return saved ? JSON.parse(saved) : INITIAL_STUDENTS;
      });

      const [requests, setRequests] = useState(() => {
        const saved = localStorage.getItem('mastered_requests');
        return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
      });

      const [modules, setModules] = useState(() => {
        const saved = localStorage.getItem('mastered_modules');
        return saved ? JSON.parse(saved) : [];
      });

      const [quizzes, setQuizzes] = useState(() => {
        const saved = localStorage.getItem('mastered_quizzes');
        return saved ? JSON.parse(saved) : [];
      });

      const [questions, setQuestions] = useState(() => {
        const saved = localStorage.getItem('mastered_questions');
        return saved ? JSON.parse(saved) : [];
      });

      const [userProgress, setUserProgress] = useState(() => {
        const saved = localStorage.getItem('mastered_progress');
        return saved ? JSON.parse(saved) : {};
      });

      const [announcements, setAnnouncements] = useState(MOCK_ANNOUNCEMENTS);

      // Save state changes to LocalStorage permanently
      useEffect(() => {
        localStorage.setItem('mastered_modules', JSON.stringify(modules));
      }, [modules]);

      useEffect(() => {
        localStorage.setItem('mastered_quizzes', JSON.stringify(quizzes));
      }, [quizzes]);

      useEffect(() => {
        localStorage.setItem('mastered_questions', JSON.stringify(questions));
      }, [questions]);

      useEffect(() => {
        localStorage.setItem('mastered_students', JSON.stringify(students));
      }, [students]);

      useEffect(() => {
        localStorage.setItem('mastered_requests', JSON.stringify(requests));
      }, [requests]);

      useEffect(() => {
        localStorage.setItem('mastered_progress', JSON.stringify(userProgress));
      }, [userProgress]);

      // Lesson Sub-Tab inside Student Module View
      const [lessonTab, setLessonTab] = useState('video1');

      // Student Quiz Runner Modal State
      const [showQuizModal, setShowQuizModal] = useState(false);
      const [quizAnswers, setQuizAnswers] = useState({});
      const [quizSubmitted, setQuizSubmitted] = useState(false);
      const [quizScore, setQuizScore] = useState(0);

      // Admin Module Modal Form State
      const [showModuleModal, setShowModuleModal] = useState(false);
      const [moduleForm, setModuleForm] = useState({
        moduleId: '',
        moduleNumber: 1,
        title: '',
        description: '',
        thumbnail: 'https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800&auto=format&fit=crop&q=80',
        video1: '',
        video2: '',
        audio: '',
        pdf: '',
        quizId: '',
        published: true,
        order: 1
      });

      // Admin Quiz Creator Modal State
      const [showQuizModalAdmin, setShowQuizModalAdmin] = useState(false);
      const [quizForm, setQuizForm] = useState({
        quizId: '',
        moduleId: '',
        title: '',
        passPercentage: 80,
        timeLimit: 10
      });

      // Admin Question Form State
      const [showQuestionModalAdmin, setShowQuestionModalAdmin] = useState(false);
      const [questionForm, setQuestionForm] = useState({
        id: '',
        quizId: '',
        question: '',
        optionA: '',
        optionB: '',
        optionC: '',
        optionD: '',
        correctAnswer: 'A',
        explanation: ''
      });

      // Toast Notification
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Live GAS fetch on mount
      useEffect(() => {
        callAppsScript('getModules').then(mRes => {
          if (mRes.success && Array.isArray(mRes.data) && mRes.data.length > 0) {
            setModules(mRes.data);
          }
        });
      }, []);

      // Student Login
      const handleStudentLogin = async (email, adm) => {
        const live = await callAppsScript('loginStudent', { email, admissionNumber: adm });
        if (live.success && live.student) {
          setCurrentUser(live.student);
          setRole('student');
          setActiveTab('dashboard');
          return { success: true };
        }

        const found = students.find(s => s.email.toLowerCase() === email.trim().toLowerCase() && s.admissionNumber.toUpperCase() === adm.trim().toUpperCase());
        if (found) {
          setCurrentUser(found);
          setRole('student');
          setActiveTab('dashboard');
          return { success: true };
        }
        return { success: false, message: "Invalid student credentials." };
      };

      // Admin Login
      const handleAdminLogin = async (email, pass) => {
        const live = await callAppsScript('loginAdmin', { email, password: pass });
        if (live.success && live.admin) {
          setCurrentUser(live.admin);
          setRole('admin');
          setActiveTab('admin-dashboard');
          return { success: true };
        }

        const cleanEmail = email.trim().toLowerCase();
        const found = INITIAL_ADMINS.find(a => a.email.toLowerCase() === cleanEmail && a.password === pass.trim());
        if (found) {
          setCurrentUser(found);
          setRole('admin');
          setActiveTab('admin-dashboard');
          return { success: true };
        }
        return { success: false, message: "Invalid admin email or password." };
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setRole(null);
        setAuthScreen('login');
        setSelectedModuleId(null);
      };

      // Approve Request
      const handleApproveRequest = (reqId) => {
        const req = requests.find(r => r.requestId === reqId);
        if (!req) return;

        setRequests(prev => prev.map(r => r.requestId === reqId ? { ...r, status: 'Approved' } : r));

        const newStudent = {
          studentId: `STD-${Math.floor(1000 + Math.random() * 9000)}`,
          admissionNumber: req.admissionNumber,
          name: req.name,
          email: req.email,
          phone: req.phone,
          course: req.course,
          profileImage: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80",
          approved: true,
          status: "Active",
          createdDate: new Date().toISOString().split('T')[0]
        };

        setStudents(prev => [newStudent, ...prev]);
        callAppsScript('approveRequest', { requestId: reqId });
        showToast(`✅ Approved request for ${req.name}! Added to Student Directory.`);
      };

      // Reject Request
      const handleRejectRequest = (reqId) => {
        setRequests(prev => prev.map(r => r.requestId === reqId ? { ...r, status: 'Rejected' } : r));
        showToast(`Request rejected.`);
      };

      // Save Module (Create / Edit) - REALTIME & PERMANENT SAVING
      const handleSaveModule = (e) => {
        e.preventDefault();
        const modId = moduleForm.moduleId || `MOD-${Math.floor(100 + Math.random() * 900)}`;
        const finalMod = {
          ...moduleForm,
          moduleId: modId,
          moduleNumber: Number(moduleForm.moduleNumber) || (modules.length + 1),
          order: Number(moduleForm.order) || (modules.length + 1)
        };

        setModules(prev => {
          const idx = prev.findIndex(m => m.moduleId === modId);
          if (idx >= 0) {
            const updated = [...prev];
            updated[idx] = finalMod;
            return updated;
          }
          return [...prev, finalMod];
        });

        callAppsScript('adminSaveModule', { module: finalMod });
        setShowModuleModal(false);
        showToast(`✅ Module "${finalMod.title}" saved permanently! Now visible in Student Portal.`);
      };

      // Delete Module
      const handleDeleteModule = (modId) => {
        if (confirm("Are you sure you want to delete this module?")) {
          setModules(prev => prev.filter(m => m.moduleId !== modId));
          showToast("Module deleted.");
        }
      };

      // Save Quiz (Create / Edit)
      const handleSaveQuiz = (e) => {
        e.preventDefault();
        const qId = quizForm.quizId || `QUIZ-${Math.floor(100 + Math.random() * 900)}`;
        const finalQuiz = {
          ...quizForm,
          quizId: qId,
          passPercentage: Number(quizForm.passPercentage) || 80,
          timeLimit: Number(quizForm.timeLimit) || 10
        };

        setQuizzes(prev => {
          const idx = prev.findIndex(q => q.quizId === qId);
          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = finalQuiz;
            return copy;
          }
          return [...prev, finalQuiz];
        });

        if (finalQuiz.moduleId) {
          setModules(prev => prev.map(m => m.moduleId === finalQuiz.moduleId ? { ...m, quizId: qId } : m));
        }

        callAppsScript('adminSaveQuiz', { quiz: finalQuiz });
        setShowQuizModalAdmin(false);
        showToast(`✅ Quiz "${finalQuiz.title}" saved permanently!`);
      };

      // Save Question
      const handleSaveQuestion = (e) => {
        e.preventDefault();
        const qstId = questionForm.id || `Q-${Math.floor(1000 + Math.random() * 9000)}`;
        const finalQst = { ...questionForm, id: qstId };

        setQuestions(prev => {
          const idx = prev.findIndex(q => q.id === qstId);
          if (idx >= 0) {
            const copy = [...prev];
            copy[idx] = finalQst;
            return copy;
          }
          return [...prev, finalQst];
        });

        callAppsScript('adminSaveQuestion', { question: finalQst });
        setShowQuestionModalAdmin(false);
        showToast(`✅ Question added to Quiz!`);
      };

      // Update Student Progress
      const handleMarkItemComplete = (modId, itemKey) => {
        setUserProgress(prev => {
          const existing = prev[modId] || { video1: false, video2: false, audio: false, pdf: false, quiz: false, percentage: 0 };
          const updated = { ...existing, [itemKey]: true };
          
          let count = 0;
          if (updated.video1) count++;
          if (updated.video2) count++;
          if (updated.audio) count++;
          if (updated.pdf) count++;
          if (updated.quiz) count++;
          updated.percentage = Math.round((count / 5) * 100);

          return { ...prev, [modId]: updated };
        });
        showToast("✨ Progress updated!");
      };

      // Student Quiz Submit Handler
      const handleQuizSubmit = (quizObj) => {
        const quizQuestions = questions.filter(q => q.quizId === quizObj.quizId);
        if (quizQuestions.length === 0) {
          alert("This quiz has no registered questions yet.");
          return;
        }

        let correct = 0;
        quizQuestions.forEach(q => {
          if (quizAnswers[q.id] === q.correctAnswer) correct++;
        });
        const scorePct = Math.round((correct / quizQuestions.length) * 100);
        setQuizScore(scorePct);
        setQuizSubmitted(true);

        if (scorePct >= quizObj.passPercentage) {
          handleMarkItemComplete(quizObj.moduleId, 'quiz');
        }
      };

      const Header = () => (
        <header className="bg-white border-b border-slate-200 px-6 py-3 sticky top-0 z-30 shadow-sm flex items-center justify-between">
          <div className="flex items-center space-x-3">
            <div className="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center font-extrabold text-lg shadow-md">
              M
            </div>
            <div>
              <h1 className="font-extrabold text-slate-900 text-base">
                MASTERED <span className="text-blue-600 text-xs font-semibold uppercase tracking-wider">Language Coach</span>
              </h1>
              <p className="text-[11px] text-slate-400">Speak With Confidence</p>
            </div>
          </div>

          {currentUser && (
            <div className="flex items-center space-x-4">
              <div className="text-right text-xs">
                <p className="font-bold text-slate-900">{currentUser.name}</p>
                <p className="text-[10px] text-slate-500 font-mono">{role === 'student' ? currentUser.admissionNumber : currentUser.role}</p>
              </div>
              <button
                onClick={handleLogout}
                className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-red-50 hover:text-red-600 text-slate-700 font-bold text-xs transition"
              >
                Sign Out
              </button>
            </div>
          )}
        </header>
      );

      // AUTH SCREENS
      if (!currentUser) {
        if (authScreen === 'request') {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex flex-col justify-center items-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl">
                <button onClick={() => setAuthScreen('login')} className="text-xs text-slate-400 hover:text-white mb-4">← Back to Login</button>
                <h2 className="text-xl font-extrabold mb-2">Request Access</h2>
                <p className="text-xs text-slate-400 mb-6">Submit details for admin enrollment approval.</p>
                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const newReq = {
                    requestId: `REQ-${Math.floor(100 + Math.random() * 900)}`,
                    name: e.target.name.value,
                    email: e.target.email.value,
                    phone: e.target.phone.value,
                    admissionNumber: e.target.admissionNumber.value,
                    course: e.target.course.value,
                    status: 'Pending',
                    createdDate: new Date().toISOString().split('T')[0]
                  };
                  setRequests(prev => [newReq, ...prev]);
                  callAppsScript('submitRequest', newReq);
                  alert("Your request has been sent successfully to Google Sheet! Please wait for admin approval.");
                  setAuthScreen('login');
                }} className="space-y-4 text-xs">
                  <input name="name" type="text" required placeholder="Full Name" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white" />
                  <input name="email" type="email" required placeholder="Email Address" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white" />
                  <input name="phone" type="tel" required placeholder="Phone Number" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white" />
                  <input name="admissionNumber" type="text" required placeholder="Admission Number (e.g. MLC-2026-044)" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white font-mono uppercase" />
                  <select name="course" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white">
                    <option>Executive English Fluency</option>
                    <option>Business Communication & Speaking</option>
                  </select>
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-white">Submit Access Request</button>
                </form>
              </div>
            </div>
          );
        }

        if (authScreen === 'admin-login') {
          return (
            <div className="min-h-screen bg-slate-950 text-white flex flex-col justify-center items-center p-4">
              <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl">
                <button onClick={() => setAuthScreen('login')} className="text-xs text-slate-400 hover:text-white mb-4">← Student Login</button>
                <h2 className="text-xl font-extrabold mb-2">Admin Console Login</h2>
                <p className="text-xs text-slate-400 mb-4">Master System Console</p>

                <div className="p-3 mb-4 rounded-xl bg-blue-950/60 border border-blue-800 text-[11px] text-blue-300">
                  <p className="font-bold">Admin Credentials:</p>
                  <p className="mt-1"><code>masteredlanguagecoach@gmail.com</code> / <code>4languagecoach</code></p>
                </div>

                <form onSubmit={async (e) => {
                  e.preventDefault();
                  const res = await handleAdminLogin(e.target.email.value, e.target.password.value);
                  if (!res.success) alert(res.message);
                }} className="space-y-4 text-xs">
                  <input name="email" type="email" defaultValue="masteredlanguagecoach@gmail.com" required placeholder="Admin Email" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white" />
                  <input name="password" type="password" defaultValue="4languagecoach" required placeholder="Admin Password" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white" />
                  <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-white">Enter Admin Console</button>
                </form>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-slate-950 text-white flex flex-col justify-center items-center p-4">
            <div className="bg-slate-900 border border-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl">
              <div className="text-center mb-6">
                <div className="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center font-extrabold text-2xl mx-auto mb-3">M</div>
                <h1 className="text-2xl font-extrabold">MASTERED <span className="text-blue-500 text-xs block font-semibold uppercase tracking-widest mt-1">Language Coach</span></h1>
                <p className="text-xs text-slate-400 mt-1">Speak With Confidence — Student Portal</p>
              </div>

              <form onSubmit={async (e) => {
                e.preventDefault();
                const res = await handleStudentLogin(e.target.email.value, e.target.admissionNumber.value);
                if (!res.success) alert(res.message);
              }} className="space-y-4 text-xs">
                <div>
                  <label className="block text-slate-300 font-bold mb-1">Email Address</label>
                  <input name="email" type="email" defaultValue="student@mastered.com" required placeholder="student@mastered.com" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white" />
                </div>
                <div>
                  <label className="block text-slate-300 font-bold mb-1">Admission Number</label>
                  <input name="admissionNumber" type="text" defaultValue="MLC-2026-001" required placeholder="MLC-2026-001" className="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white font-mono uppercase" />
                </div>
                <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 font-bold rounded-xl text-white shadow-lg shadow-blue-600/30">Sign In to Student Portal</button>
              </form>

              <div className="mt-6 pt-6 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
                <button onClick={() => setAuthScreen('request')} className="hover:text-white text-blue-400 font-semibold underline">Request Access</button>
                <button onClick={() => setAuthScreen('admin-login')} className="hover:text-white text-slate-500">Admin Portal</button>
              </div>
            </div>
          </div>
        );
      }

      const activeModule = selectedModuleId ? modules.find(m => m.moduleId === selectedModuleId) : null;
      const pendingRequestsList = requests.filter(r => r.status === 'Pending');

      return (
        <div className="min-h-screen bg-[#F8FAFC] flex flex-col font-sans relative">
          <Header />

          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-4 right-4 z-50 px-5 py-3 rounded-2xl bg-slate-900 text-white shadow-2xl border border-slate-800 text-xs font-bold flex items-center space-x-2">
              <span>{toast}</span>
            </div>
          )}

          <div className="flex flex-1 max-w-7xl w-full mx-auto">
            {/* Sidebar Navigation */}

                              <div className="grid grid-cols-2 gap-3">
                                <div>
                                  <label className="block font-bold mb-1">Module Number</label>
                                  <input type="number" required value={moduleForm.moduleNumber} onChange={e => setModuleForm({ ...moduleForm, moduleNumber: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Attached Quiz</label>
                                  <select value={moduleForm.quizId} onChange={e => setModuleForm({ ...moduleForm, quizId: e.target.value })} className="w-full p-2.5 border rounded-xl">
                                    <option value="">No Quiz Attached</option>
                                    {quizzes.map(q => <option key={q.quizId} value={q.quizId}>{q.title}</option>)}
                                  </select>
                                </div>
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Module Title</label>
                                <input type="text" required value={moduleForm.title} onChange={e => setModuleForm({ ...moduleForm, title: e.target.value })} placeholder="e.g. Executive Vocal Projection" className="w-full p-2.5 border rounded-xl" />
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Description</label>
                                <textarea rows={3} value={moduleForm.description} onChange={e => setModuleForm({ ...moduleForm, description: e.target.value })} className="w-full p-2.5 border rounded-xl"></textarea>
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Thumbnail Cover Image URL</label>
                                <input type="url" value={moduleForm.thumbnail} onChange={e => setModuleForm({ ...moduleForm, thumbnail: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                              </div>

                              <div className="grid grid-cols-2 gap-3 pt-2 border-t">
                                <div>
                                  <label className="block font-bold mb-1">Video 1 Drive Link</label>
                                  <input type="url" value={moduleForm.video1} onChange={e => setModuleForm({ ...moduleForm, video1: e.target.value })} placeholder="https://drive.google.com/..." className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Video 2 Drive Link</label>
                                  <input type="url" value={moduleForm.video2} onChange={e => setModuleForm({ ...moduleForm, video2: e.target.value })} placeholder="https://drive.google.com/..." className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Audio Drive Link</label>
                                  <input type="url" value={moduleForm.audio} onChange={e => setModuleForm({ ...moduleForm, audio: e.target.value })} placeholder="https://drive.google.com/..." className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">PDF Drive Link</label>
                                  <input type="url" value={moduleForm.pdf} onChange={e => setModuleForm({ ...moduleForm, pdf: e.target.value })} placeholder="https://drive.google.com/..." className="w-full p-2.5 border rounded-xl" />
                                </div>
                              </div>

                              <div className="flex justify-end space-x-2 pt-3">
                                <button type="button" onClick={() => setShowModuleModal(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button>
                                <button type="submit" className="px-6 py-2 bg-blue-600 text-white font-bold rounded-xl shadow-md">Save Module</button>
                              </div>
                            </form>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* Quiz & Question Builder Tab */}
                  {activeTab === 'admin-quizzes' && (
                    <div className="space-y-6">
                      <div className="bg-white p-6 rounded-3xl border border-slate-200 flex justify-between items-center">
                        <div>
                          <h3 className="text-lg font-extrabold text-slate-900">Quiz & Question Bank Builder</h3>
                          <p className="text-xs text-slate-500 mt-1">Build multiple choice assessments and add questions for student mastery tests.</p>
                        </div>

                        <button
                          onClick={() => {
                            setQuizForm({ quizId: '', moduleId: '', title: '', passPercentage: 80, timeLimit: 10 });
                            setShowQuizModalAdmin(true);
                          }}
                          className="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded-xl shadow-md"
                        >
                          + Create New Quiz
                        </button>
                      </div>

                      {quizzes.length === 0 ? (
                        <div className="p-12 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
                          <p className="font-bold text-slate-800 text-base">No Quizzes Created Yet</p>
                          <p className="text-xs text-slate-400 mt-1">Click "+ Create New Quiz" above to add your first assessment!</p>
                        </div>
                      ) : (
                        <div className="space-y-6">
                          {quizzes.map(quiz => {
                            const quizQsts = questions.filter(q => q.quizId === quiz.quizId);
                            const modObj = modules.find(m => m.moduleId === quiz.moduleId);

                            return (
                              <div key={quiz.quizId} className="bg-white rounded-3xl p-6 border border-slate-200 space-y-4 shadow-sm">
                                <div className="flex justify-between items-center border-b pb-3">
                                  <div>
                                    <span className="font-mono text-xs font-bold text-blue-600 uppercase">{quiz.quizId}</span>
                                    <h4 className="text-base font-bold text-slate-900">{quiz.title}</h4>
                                    <p className="text-xs text-slate-500">Target Pass: {quiz.passPercentage}% | Time Limit: {quiz.timeLimit} mins | Linked Module: {modObj ? modObj.title : 'None'}</p>
                                  </div>
                                  <button
                                    onClick={() => {
                                      setQuestionForm({ id: '', quizId: quiz.quizId, question: '', optionA: '', optionB: '', optionC: '', optionD: '', correctAnswer: 'A', explanation: '' });
                                      setShowQuestionModalAdmin(true);
                                    }}
                                    className="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl"
                                  >
                                    + Add Question ({quizQsts.length})
                                  </button>
                                </div>

                                <div className="space-y-2">
                                  {quizQsts.map((q, idx) => (
                                    <div key={q.id} className="p-3 bg-slate-50 rounded-2xl border text-xs space-y-1">
                                      <p className="font-bold text-slate-900">{idx + 1}. {q.question}</p>
                                      <p className="text-slate-600">A: {q.optionA} | B: {q.optionB} | C: {q.optionC} | D: {q.optionD}</p>
                                      <p className="text-emerald-600 font-bold">Correct: Option {q.correctAnswer}</p>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {/* Create Quiz Modal */}
                      {showQuizModalAdmin && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
                          <div className="bg-white rounded-3xl p-6 max-w-md w-full border shadow-2xl space-y-4">
                            <h3 className="text-lg font-extrabold text-slate-900">Create New Quiz</h3>

                            <form onSubmit={handleSaveQuiz} className="space-y-3 text-xs">
                              <div>
                                <label className="block font-bold mb-1">Quiz Title</label>
                                <input type="text" required value={quizForm.title} onChange={e => setQuizForm({ ...quizForm, title: e.target.value })} placeholder="e.g. Module 1 Executive Fluency Mastery" className="w-full p-2.5 border rounded-xl" />
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Link to Course Module</label>
                                <select value={quizForm.moduleId} onChange={e => setQuizForm({ ...quizForm, moduleId: e.target.value })} className="w-full p-2.5 border rounded-xl">
                                  <option value="">Select Module...</option>
                                  {modules.map(m => <option key={m.moduleId} value={m.moduleId}>Module {m.moduleNumber}: {m.title}</option>)}
                                </select>
                              </div>

                              <div className="grid grid-cols-2 gap-3">
                                <div>
                                  <label className="block font-bold mb-1">Passing Percentage %</label>
                                  <input type="number" required value={quizForm.passPercentage} onChange={e => setQuizForm({ ...quizForm, passPercentage: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Time Limit (mins)</label>
                                  <input type="number" required value={quizForm.timeLimit} onChange={e => setQuizForm({ ...quizForm, timeLimit: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                              </div>

                              <div className="flex justify-end space-x-2 pt-3">
                                <button type="button" onClick={() => setShowQuizModalAdmin(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button>
                                <button type="submit" className="px-5 py-2 bg-blue-600 text-white font-bold rounded-xl shadow-md">Create Quiz</button>
                              </div>
                            </form>
                          </div>
                        </div>
                      )}

                      {/* Add Question Modal */}
                      {showQuestionModalAdmin && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto">
                          <div className="bg-white rounded-3xl p-6 max-w-lg w-full border shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                            <h3 className="text-lg font-extrabold text-slate-900">Add Question to Quiz</h3>

                            <form onSubmit={handleSaveQuestion} className="space-y-3 text-xs">
                              <div>
                                <label className="block font-bold mb-1">Question Text</label>
                                <textarea rows={2} required value={questionForm.question} onChange={e => setQuestionForm({ ...questionForm, question: e.target.value })} placeholder="Enter question..." className="w-full p-2.5 border rounded-xl"></textarea>
                              </div>

                              <div className="grid grid-cols-2 gap-3">
                                <div>
                                  <label className="block font-bold mb-1">Option A</label>
                                  <input type="text" required value={questionForm.optionA} onChange={e => setQuestionForm({ ...questionForm, optionA: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Option B</label>
                                  <input type="text" required value={questionForm.optionB} onChange={e => setQuestionForm({ ...questionForm, optionB: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Option C</label>
                                  <input type="text" required value={questionForm.optionC} onChange={e => setQuestionForm({ ...questionForm, optionC: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Option D</label>
                                  <input type="text" required value={questionForm.optionD} onChange={e => setQuestionForm({ ...questionForm, optionD: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Correct Answer</label>
                                <select value={questionForm.correctAnswer} onChange={e => setQuestionForm({ ...questionForm, correctAnswer: e.target.value })} className="w-full p-2.5 border rounded-xl">
                                  <option value="A">Option A</option>
                                  <option value="B">Option B</option>
                                  <option value="C">Option C</option>
                                  <option value="D">Option D</option>
                                </select>
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Explanation Note</label>
                                <input type="text" value={questionForm.explanation} onChange={e => setQuestionForm({ ...questionForm, explanation: e.target.value })} placeholder="Explanation shown to student after test..." className="w-full p-2.5 border rounded-xl" />
                              </div>

                              <div className="flex justify-end space-x-2 pt-3">
                                <button type="button" onClick={() => setShowQuestionModalAdmin(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button>
                                <button type="submit" className="px-5 py-2 bg-blue-600 text-white font-bold rounded-xl shadow-md">Add Question</button>
                              </div>
                            </form>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
