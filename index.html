  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const safeStorage = {
      getItem: (key) => {
        try { return localStorage.getItem(key); } catch(e) { return null; }
      },
      setItem: (key, val) => {
        try { localStorage.setItem(key, val); } catch(e) {}
      },
      removeItem: (key) => {
        try { localStorage.removeItem(key); } catch(e) {}
      },
      clear: () => {
        try { localStorage.clear(); } catch(e) {}
      }
    };

    // Transparent PNG Logo Asset
    const LOGO_SRC = "assets/logo.png";
    var LIVE_APPS_SCRIPT_URL = (typeof window !== 'undefined' && window.LIVE_APPS_SCRIPT_URL) || "https://script.google.com/macros/s/AKfycbyTe-hZJIaev4qvK_aDR7ipOidSpJetZhwGC195ECn5lwVRiP4K-IL4sLXtopjAj8Ox/exec";
    const modules = (typeof window !== 'undefined' && window.EXACT_32_MODULES) || (typeof EXACT_32_MODULES !== 'undefined' ? EXACT_32_MODULES : []);

    // Helper: Clean Embed URLs for YouTube Fast Buffering & Controls Customization
    function getVideoEmbedUrl(url) {
      if (!url) return '';

      const ytShortMatch = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
      const ytStandardMatch = url.match(/v=([a-zA-Z0-9_-]+)/);
      const ytId = ytShortMatch ? ytShortMatch[1] : (ytStandardMatch ? ytStandardMatch[1] : null);

      if (ytId) {
        // Fast buffer URL hiding extraneous overlays, share link, and channel branding
        return `https://www.youtube.com/embed/${ytId}?autoplay=0&rel=0&modestbranding=1&controls=1&showinfo=0&iv_load_policy=3&fs=0&enablejsapi=1`;
      }

      // Google Drive Fallback
      const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }

      return url;
    }

    function getDriveEmbedUrl(url) {
      if (!url) return '';
      const fileIdMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        return `https://drive.google.com/file/d/${fileIdMatch[1]}/preview`;
      }
      return url;
    }

    // Dynamic Direct Fetch & POST/GET Hybrid Call to Google Apps Script REST API
    async function callAppsScript(action, payload = {}) {
      const scriptUrl = (typeof LIVE_APPS_SCRIPT_URL !== 'undefined' && LIVE_APPS_SCRIPT_URL) || "https://script.google.com/macros/s/AKfycbyTe-hZJIaev4qvK_aDR7ipOidSpJetZhwGC195ECn5lwVRiP4K-IL4sLXtopjAj8Ox/exec";
      if (!scriptUrl || scriptUrl.includes('undefined')) return { success: false, message: "AppsScript URL not configured" };

      // Build hybrid payload containing both top-level and nested properties
      const bodyObj = { action, payload, ...payload };
      const postBody = JSON.stringify(bodyObj);

      // Build query string with action + top-level parameters
      let queryParams = `action=${encodeURIComponent(action)}&t=${Date.now()}`;
      if (payload && typeof payload === 'object') {
        Object.keys(payload).forEach(k => {
          if (typeof payload[k] === 'string' || typeof payload[k] === 'number' || typeof payload[k] === 'boolean') {
            queryParams += `&${encodeURIComponent(k)}=${encodeURIComponent(payload[k])}`;
          }
        });
      }

      const isReadAction = ['getStudents', 'getRequests', 'getAllStudentProgress', 'getModules', 'ping', 'getStudentProgress', 'debugSheets'].includes(action);

      // 1. If read action, try direct GET first (fastest, best redirect handling in browsers without CORS preflights)
      if (isReadAction) {
        const getUrl = `${scriptUrl}?${queryParams}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 20000);
          const response = await fetch(getUrl, { method: "GET", redirect: "follow", signal: controller.signal });
          clearTimeout(timeoutId);
          const json = await response.json();
          if (json && json.success !== undefined) return json;
        } catch(err) {
          console.warn(`GET fetch for ${action} warning:`, err);
        }
      }

      // 2. Try POST fetch with generous 25-second timeout controller
      const fullPostUrl = `${scriptUrl}?${queryParams}`;
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000);
        const response = await fetch(fullPostUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: postBody,
          redirect: "follow",
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        const json = await response.json();
        if (json && json.success !== undefined) return json;
      } catch(err) {
        console.warn(`POST fetch for ${action} warning:`, err);
      }

      // 3. Fallback GET request if POST failed
      if (!isReadAction) {
        const getUrl = `${scriptUrl}?${queryParams}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
        try {
          const controller2 = new AbortController();
          const timeoutId2 = setTimeout(() => controller2.abort(), 20000);
          const response = await fetch(getUrl, { method: "GET", redirect: "follow", signal: controller2.signal });
          clearTimeout(timeoutId2);
          const json = await response.json();
          if (json && json.success !== undefined) return json;
        } catch(err) {}
      }

      return { success: false, message: "Network request timed out. Operating in fast local mode." };
    }

    // Interactive Student Quiz Component
    function StudentQuizView({ moduleNumber, moduleTitle, onClose, onSaveScore }) {
      const getActiveBank = () => {
        if (typeof window === 'undefined') return typeof QUIZ_BANK !== 'undefined' ? QUIZ_BANK : {};
        return window.ACTIVE_QUIZ_BANK || window.HINDI_QUIZ_BANK || window.QUIZ_BANK || (typeof QUIZ_BANK !== 'undefined' ? QUIZ_BANK : {});
      };

      const [quizBank, setQuizBank] = useState(() => getActiveBank());

      useEffect(() => {
        const currentBank = getActiveBank();
        if (currentBank && currentBank[moduleNumber] && currentBank[moduleNumber].length > 0) {
          setQuizBank(currentBank);
        } else {
          const checkTimer = setInterval(() => {
            const cb = getActiveBank();
            if (cb && cb[moduleNumber] && cb[moduleNumber].length > 0) {
              setQuizBank(cb);
              clearInterval(checkTimer);
            }
          }, 150);
          return () => clearInterval(checkTimer);
        }
      }, [moduleNumber]);

      const quizQuestions = quizBank[moduleNumber] || [];
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [showReview, setShowReview] = useState(false);

      const totalQs = quizQuestions.length;
      const currentQ = quizQuestions[currentIdx];

      const handleSelectOption = (optIndex) => {
        if (isSubmitted) return;
        setUserAnswers(prev => ({
          ...prev,
          [currentIdx]: optIndex
        }));
      };

      const calculateScore = () => {
        let score = 0;
        quizQuestions.forEach((q, idx) => {
          if (userAnswers[idx] !== undefined && userAnswers[idx] === q.correctIndex) {
            score++;
          }
        });
        const percentage = Math.round((score / totalQs) * 100);
        return { score, total: totalQs, percentage };
      };

      const handleSubmitQuiz = () => {
        if (Object.keys(userAnswers).length < totalQs) {
          if (!confirm(`You have answered ${Object.keys(userAnswers).length} out of ${totalQs} questions. Are you sure you want to submit?`)) {
            return;
          }
        }
        const scoreObj = calculateScore();
        setIsSubmitted(true);
        if (onSaveScore) onSaveScore(moduleNumber, scoreObj);
      };

      if (totalQs === 0) {
        return (
          <div className="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4">
            <h3 className="text-lg font-bold text-slate-800">Quiz Coming Soon!</h3>
            <p className="text-xs text-slate-500">The 30-question quiz for Module {moduleNumber} is being prepared.</p>
            <button onClick={onClose} className="px-5 py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl">← Back</button>
          </div>
        );
      }

      const scoreResult = isSubmitted ? calculateScore() : null;

      return (
        <div className="space-y-4 sm:space-y-6 pb-28 sm:pb-16">
          {/* Header */}
          <div className="bg-slate-900 text-white p-5 sm:p-7 rounded-2xl sm:rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-l-4 border-red-600">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-[10px] sm:text-xs font-bold text-red-400 uppercase tracking-widest">📝 Module {moduleNumber} Quiz</span>
                <span className="text-[10px] bg-red-950 text-red-300 border border-red-800/60 px-2 py-0.5 rounded-full font-bold">{totalQs} Questions</span>
              </div>
              <h2 className="text-lg sm:text-xl font-extrabold mt-1">{moduleTitle || `Module ${moduleNumber} Practice Quiz`}</h2>
            </div>
            <button onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl self-start sm:self-auto transition">
              ← Exit Quiz
            </button>
          </div>

          {/* Main Container */}
          {!isSubmitted ? (
            <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              {/* Progress Bar */}
              <div className="space-y-2">
                <div className="flex justify-between items-center text-xs font-bold text-slate-600">
                  <span>Question {currentIdx + 1} of {totalQs}</span>
                  <span className="text-red-600 font-extrabold">{Math.round(((currentIdx + 1) / totalQs) * 100)}% Complete</span>
                </div>
                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-red-600 h-full transition-all duration-300 rounded-full" style={{ width: `${((currentIdx + 1) / totalQs) * 100}%` }}></div>
                </div>
              </div>

              {/* Question Card */}
              <div className="space-y-4 pt-2">
                <div className="bg-slate-50 border border-slate-200/80 p-4 sm:p-6 rounded-2xl space-y-2">
                  <h3 className="text-base sm:text-lg font-extrabold text-slate-900 leading-snug">
                    {currentQ.id || (currentIdx + 1)}. {currentQ.question}
                  </h3>
                  {currentQ.questionMl && (
                    <p className="text-xs sm:text-sm text-slate-600 italic font-medium bg-amber-50/80 border border-amber-200/60 p-2.5 rounded-xl">
                      💡 {currentQ.questionMl}
                    </p>
                  )}
                </div>

                {/* Options List */}
                <div className="grid grid-cols-1 gap-3">
                  {currentQ.options.map((opt, optIdx) => {
                    const isSelected = userAnswers[currentIdx] === optIdx;
                    return (
                      <button
                        key={optIdx}
                        onClick={() => handleSelectOption(optIdx)}
                        className={`w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start space-x-3 text-xs sm:text-sm font-semibold ${
                          isSelected
                            ? 'border-red-600 bg-red-50/80 text-red-950 shadow-md ring-2 ring-red-600/20'
                            : 'border-slate-200 hover:border-slate-300 bg-white text-slate-800 hover:bg-slate-50'
                        }`}
                      >
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                          isSelected ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>
                        <span className="flex-1 leading-relaxed">{opt}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Question Navigation Controls */}
              <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                <button
                  onClick={() => setCurrentIdx(prev => Math.max(0, prev - 1))}
                  disabled={currentIdx === 0}
                  className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                  ← Previous
                </button>

                <span className="text-xs text-slate-400 font-bold hidden sm:inline">
                  Answered {Object.keys(userAnswers).length} / {totalQs}
                </span>

                {currentIdx < totalQs - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => Math.min(totalQs - 1, prev + 1))}
                    className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-md transition"
                  >
                    Next Question →
                  </button>
                ) : (
                  <button
                    onClick={handleSubmitQuiz}
                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition"
                  >
                    Submit Quiz 🚀
                  </button>
                )}
              </div>
            </div>
          ) : (
            /* Quiz Results View */
            <div className="bg-white rounded-2xl sm:rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              <div className="text-center space-y-3 py-4 border-b border-slate-100">
                <div className="w-20 h-20 mx-auto rounded-full bg-red-50 border-4 border-red-600 flex items-center justify-center text-2xl font-black text-red-600 shadow-inner">
                  {scoreResult.percentage}%
                </div>
                <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                  {scoreResult.percentage >= 80 ? '🏆 Outstanding Performance!' : (scoreResult.percentage >= 50 ? '🎉 Good Job! Module Passed!' : '💪 Keep Practicing!')}
                </h3>
                <p className="text-xs sm:text-sm text-slate-600 font-medium">
                  You scored <strong className="text-red-600 font-extrabold">{scoreResult.score}</strong> out of <strong className="text-slate-800">{scoreResult.total}</strong> questions correct.
                </p>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                <button
                  onClick={() => setShowReview(!showReview)}
                  className="w-full sm:w-auto px-5 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-md transition"
                >
                  {showReview ? 'Hide Answer Review' : '🔍 Review All 30 Answers'}
                </button>
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setUserAnswers({});
                    setCurrentIdx(0);
                    setShowReview(false);
                  }}
                  className="w-full sm:w-auto px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl transition"
                >
                  🔄 Retake Quiz
                </button>
                <button
                  onClick={onClose}
                  className="w-full sm:w-auto px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                >
                  ✓ Complete & Return to Portal
                </button>
              </div>

              {/* Answer Review Section */}
              {showReview && (
                <div className="space-y-4 pt-4 border-t border-slate-100">
                  <h4 className="font-extrabold text-sm text-slate-900">Detailed Answer Review</h4>
                  <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    {quizQuestions.map((q, idx) => {
                      const userAns = userAnswers[idx];
                      const isCorrect = userAns === q.correctIndex;
                      return (
                        <div key={idx} className={`p-4 rounded-2xl border text-xs space-y-2 ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}`}>
                          <div className="flex items-start justify-between gap-2">
                            <span className="font-bold text-slate-900">{idx + 1}. {q.question}</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}`}>
                              {isCorrect ? '✓ Correct' : '✕ Incorrect'}
                            </span>
                          </div>
                          {q.questionMl && <p className="text-slate-600 italic">💡 {q.questionMl}</p>}
                          <div className="space-y-1 pt-1">
                            {q.options.map((opt, oIdx) => {
                              const isUserChoice = userAns === oIdx;
                              const isCorrectChoice = q.correctIndex === oIdx;
                              let style = 'bg-white text-slate-700 border-slate-200';
                              if (isCorrectChoice) style = 'bg-emerald-100 border-emerald-400 text-emerald-950 font-bold';
                              else if (isUserChoice && !isCorrectChoice) style = 'bg-rose-100 border-rose-400 text-rose-950 font-bold';

                              return (
                                <div key={oIdx} className={`p-2 rounded-xl border text-[11px] flex items-center justify-between ${style}`}>
                                  <span>{opt}</span>
                                  {isCorrectChoice && <span className="text-emerald-700 font-bold text-[10px]">Correct Answer</span>}
                                  {isUserChoice && !isCorrectChoice && <span className="text-rose-700 font-bold text-[10px]">Your Answer</span>}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }
    function StudentQuizzesHub({ modules, userProgress, onStartQuiz, onOpenAiPrompt }) {
      const isLevelUnlocked = (modNum) => true;

      return (
        <div className="space-y-4 sm:space-y-6">
          <div className="bg-slate-900 text-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-l-4 border-red-600">
            <div>
              <span className="text-[10px] sm:text-xs font-bold text-red-400 uppercase tracking-wider">Sequential Level System</span>
              <h2 className="text-xl sm:text-2xl font-extrabold mt-0.5">30-Question Module Quizzes</h2>
              <p className="text-xs text-slate-300 mt-1">Unlock each level sequentially by completing module lessons and earning 85%+ on the 30-question Quiz!</p>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {modules.map(m => {
              const modNum = m.moduleNumber;
              const bank = (typeof window !== 'undefined' && (window.ACTIVE_QUIZ_BANK || window.HINDI_QUIZ_BANK || window.QUIZ_BANK)) || (typeof QUIZ_BANK !== 'undefined' ? QUIZ_BANK : {});
              const quizQuestions = bank[modNum] || [];
              const modKey = `MOD-${modNum < 10 ? '0' + modNum : modNum}`;
              const modKeyShort = `MOD-${modNum}`;
              const hindKey = `HIND-MOD-${modNum < 10 ? '0' + modNum : modNum}`;
              const mProg = (userProgress && (userProgress[m.moduleId] || userProgress[modKey] || userProgress[modKeyShort] || userProgress[hindKey])) || {};
              const qScores = mProg.quizScores || {};
              const scoreData = qScores[modNum] || (userProgress && userProgress.quizScores && userProgress.quizScores[modNum]) || null;
              const unlocked = isLevelUnlocked(modNum);

              return (
                <div key={m.moduleId} className={`p-5 rounded-2xl sm:rounded-3xl border shadow-sm flex flex-col justify-between space-y-4 transition ${
                  unlocked ? 'bg-white border-slate-200 hover:border-red-500' : 'bg-slate-100/70 border-slate-200 opacity-80'
                }`}>
                  <div className="space-y-2">

    // Admin Quiz Manager Component
    function AdminQuizManager({ modules, quizBank, onSaveModuleQuiz }) {
      const [selectedModNum, setSelectedModNum] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');
      const [editingQuestion, setEditingQuestion] = useState(null);
      const [editingIdx, setEditingIdx] = useState(-1);

      const currentQuestions = (quizBank && quizBank[selectedModNum]) || [];

      const filteredQuestions = currentQuestions.filter(q => {
        if (!searchQuery.trim()) return true;
        const query = searchQuery.toLowerCase();
        return (
          q.question.toLowerCase().includes(query) ||
          (q.questionMl && q.questionMl.toLowerCase().includes(query)) ||
          q.options.some(opt => opt.toLowerCase().includes(query))
        );
      });

      const handleOpenEdit = (q, idx) => {
        setEditingIdx(idx);
        setEditingQuestion({
          id: q ? q.id : currentQuestions.length + 1,
          question: q ? q.question : '',
          questionMl: q ? q.questionMl : '',
          options: q ? [...q.options] : ['', '', '', ''],
          correctIndex: q ? q.correctIndex : 0
        });
      };

      const handleDeleteQuestion = (idx) => {
        if (confirm("Are you sure you want to delete this question?")) {
          const updated = currentQuestions.filter((_, i) => i !== idx).map((q, i) => ({ ...q, id: i + 1 }));
          onSaveModuleQuiz(selectedModNum, updated);
        }
      };

      const handleSaveQuestion = (e) => {
        e.preventDefault();
        const updated = [...currentQuestions];
        if (editingIdx >= 0) {
          updated[editingIdx] = editingQuestion;
        } else {
          updated.push({
            ...editingQuestion,
            id: updated.length + 1
          });
        }
        onSaveModuleQuiz(selectedModNum, updated);
        setEditingQuestion(null);
        setEditingIdx(-1);
      };

        <div className="space-y-4 sm:space-y-6">
          {/* Header */}
          <div className="bg-slate-900 text-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-l-4 border-red-600">
            <div>
              <span className="text-[10px] sm:text-xs font-bold text-red-400 uppercase tracking-wider">Admin Quiz Management</span>
              <h2 className="text-xl sm:text-2xl font-extrabold mt-0.5">Edit Module Quizzes & Answer Keys</h2>
              <p className="text-xs text-slate-300 mt-1">Add, modify, or correct questions for any of the 32 curriculum modules.</p>
            </div>
            <button
              onClick={() => handleOpenEdit(null, -1)}
              className="px-4 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition self-start sm:self-auto"
            >
              + Add New Question

          </div>

          {/* Module Selector & Filter Bar */}
          <div className="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <div className="flex-1 max-w-sm">
              <label className="block text-xs font-bold text-slate-700 mb-1">Select Module to Edit</label>
              <select
                value={selectedModNum}
                onChange={e => setSelectedModNum(Number(e.target.value))}
                className="w-full p-3 rounded-xl border border-slate-300 font-extrabold text-slate-900 text-xs focus:border-red-500 outline-none bg-slate-50"
              >
                {Array.from({ length: 32 }, (_, i) => i + 1).map(num => {
                  const mObj = modules.find(m => m.moduleNumber === num);
                  const qCount = (quizBank && quizBank[num]) ? quizBank[num].length : 0;
                  return (
                    <option key={num} value={num}>
                      Module {num}: {mObj ? mObj.title.replace(/^Module \d+:\s*/, '') : `Topic ${num}`} ({qCount} Qs)

                  );
                })}
              </select>
            </div>

            <div className="flex-1 max-w-sm">
              <label className="block text-xs font-bold text-slate-700 mb-1">Search Questions</label>
              <input
                type="text"
                placeholder="Search question text or Malayalam..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full p-3 rounded-xl border border-slate-300 text-xs text-slate-900 focus:border-red-500 outline-none"

          {/* Questions List */}
          <div className="space-y-4">
            <div className="flex justify-between items-center px-1">
              <h3 className="text-sm sm:text-base font-extrabold text-slate-900">

            {filteredQuestions.length === 0 ? (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-2">
                <p className="text-sm font-bold text-slate-600">No questions found matching your search.</p>
                <button onClick={() => setSearchQuery('')} className="text-xs text-red-600 font-bold hover:underline">Clear Search Filter</button>
              </div>
            ) : (
              <div className="space-y-4">
                {filteredQuestions.map((q, idx) => {
                  const actualIdx = currentQuestions.findIndex(origQ => origQ === q);
                  return (
                    <div key={idx} className="bg-white p-5 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm space-y-3">
                      <div className="flex items-start justify-between gap-3">
                        <div className="space-y-1">
                          <span className="px-2 py-0.5 bg-slate-100 text-slate-700 text-[10px] font-bold rounded-md font-mono">Q{q.id || (actualIdx + 1)}</span>
                          <h4 className="font-extrabold text-sm sm:text-base text-slate-900 leading-snug">{q.question}</h4>
                          {q.questionMl && (
                            <p className="text-xs text-slate-600 italic bg-amber-50 border border-amber-200/60 p-2 rounded-xl">
                              💡 {q.questionMl}
                            </p>
                          )}
                        </div>

                        <div className="flex space-x-2 shrink-0">
                          <button
                            onClick={() => handleOpenEdit(q, actualIdx)}
                            className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-sm"
                          >
                            ✏️ Edit

                          <button
                            onClick={() => handleDeleteQuestion(actualIdx)}
                            className="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-xs rounded-xl"
                          >
                            Delete
                          </button>
                        </div>
                      </div>

                      {/* Options Grid */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2 border-t border-slate-100 text-xs">
                        {q.options.map((opt, optIdx) => {
                          const isCorrect = q.correctIndex === optIdx;
                          return (
                            <div
                              key={optIdx}
                              className={`p-2.5 rounded-xl border flex items-center justify-between ${
                                isCorrect ? 'bg-emerald-50 border-emerald-300 text-emerald-950 font-bold' : 'bg-slate-50 border-slate-200 text-slate-700'
                              }`}
                            >
                              <span>{opt}</span>
                              {isCorrect && <span className="text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full font-bold">✓ Correct Answer</span>}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Question Edit / Create Modal */}
          {editingQuestion && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto">
              <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-7 max-w-xl w-full border shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <h3 className="text-base sm:text-lg font-extrabold text-slate-900">
                  {editingIdx >= 0 ? `Edit Question #${editingQuestion.id} (Module ${selectedModNum})` : `Add New Question to Module ${selectedModNum}`}
                </h3>

                <form onSubmit={handleSaveQuestion} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-bold text-slate-800 mb-1">Question Title (English)</label>
                    <textarea
                      required
                      rows={2}
                      value={editingQuestion.question}
                      onChange={e => setEditingQuestion({ ...editingQuestion, question: e.target.value })}
                      className="w-full p-3 border rounded-xl font-semibold text-slate-900 outline-none focus:border-red-500"
                      placeholder="e.g. Which sentence is grammatically correct?"
                    ></textarea>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-800 mb-1">Malayalam Translation / Hint (Optional)</label>
                    <input
                      type="text"
                      value={editingQuestion.questionMl}
                      onChange={e => setEditingQuestion({ ...editingQuestion, questionMl: e.target.value })}
                      className="w-full p-3 border rounded-xl text-slate-900 outline-none focus:border-red-500"
                      placeholder="e.g. വാചകം തിരുത്തുക..."
                    />
                  </div>

                  <div className="space-y-2 pt-2 border-t">
                    <label className="block font-bold text-slate-800">Multiple Choice Options (A, B, C, D)</label>
                    {['A', 'B', 'C', 'D'].map((letter, idx) => (
                      <div key={letter} className="flex items-center space-x-2">
                        <span className="w-6 font-bold text-slate-600">{letter})</span>
                        <input
                          type="text"
                          required
                          value={editingQuestion.options[idx] ? editingQuestion.options[idx].replace(/^[A-D][\)\.]\s*/, '') : ''}
                          onChange={e => {
                            const newOpts = [...editingQuestion.options];
                            newOpts[idx] = `${letter}) ${e.target.value}`;
                            setEditingQuestion({ ...editingQuestion, options: newOpts });
                          }}
                          className="flex-1 p-2.5 border rounded-xl text-slate-900 outline-none focus:border-red-500"
                          placeholder={`Option ${letter}`}

                      </div>
                    ))}
                  </div>

                  <div className="pt-2 border-t">
                    <label className="block font-bold text-slate-800 mb-1">Select Correct Answer</label>
                    <select
                      value={editingQuestion.correctIndex}
                      onChange={e => setEditingQuestion({ ...editingQuestion, correctIndex: Number(e.target.value) })}
                      className="w-full p-3 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-950 font-extrabold outline-none"
                    >
                      <option value={0}>Option A is Correct</option>
                      <option value={1}>Option B is Correct</option>
                      <option value={2}>Option C is Correct</option>
                      <option value={3}>Option D is Correct</option>
                    </select>
                  </div>

                  <div className="flex justify-end space-x-2 pt-3">
                    <button
                      type="button"
                      onClick={() => { setEditingQuestion(null); setEditingIdx(-1); }}
                      className="px-4 py-2.5 border rounded-xl font-bold text-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold rounded-xl shadow-md"
                    >
                      ✓ Save & Update Question

                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Final Graduation Video Challenge Component (2-Minute Face Introduction Video)
    function GraduationVideoChallenge({ currentUser, userProgress, onSaveGraduationVideo, onClose }) {
      const [mediaStream, setMediaStream] = useState(null);
      const [mediaRecorder, setMediaRecorder] = useState(null);
      const [recording, setRecording] = useState(false);
      const [recordedBlob, setRecordedBlob] = useState(null);
      const [recordedUrl, setRecordedUrl] = useState('');
      const [timerSec, setTimerSec] = useState(0);
      const [driveUrlInput, setDriveUrlInput] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const videoRef = React.useRef(null);
      const timerRef = React.useRef(null);

      const gradData = (userProgress && userProgress.graduationVideo) || null;

      useEffect(() => {
        return () => {
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
          }
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [mediaStream]);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          setMediaStream(stream);
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          alert("⚠️ Camera Access Note: Could not open webcam automatically. You can also upload a recorded video file or paste a Google Drive video link below!");
        }
      };

      const startRecording = () => {
        if (!mediaStream) return;
        const chunks = [];
        const recorder = new MediaRecorder(mediaStream);
        
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          setRecordedBlob(blob);
          setRecordedUrl(URL.createObjectURL(blob));
        };

        recorder.start();
        setMediaRecorder(recorder);
        setRecording(true);
        setTimerSec(0);

        timerRef.current = setInterval(() => {
          setTimerSec(prev => {
            if (prev >= 120) {
              stopRecording(recorder);
              return 120;
            }
            return prev + 1;
          });
        }, 1000);
      };

      const stopRecording = (recToStop) => {
        const targetRec = recToStop || mediaRecorder;
        if (targetRec && targetRec.state !== 'inactive') {
          targetRec.stop();
        }
        if (timerRef.current) clearInterval(timerRef.current);
        setRecording(false);
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          setMediaStream(null);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setRecordedBlob(file);
          setRecordedUrl(URL.createObjectURL(file));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!recordedBlob && !driveUrlInput.trim()) {
          alert("Please record a video, choose a video file, or enter a Google Drive video link!");
          return;
        }

        setSubmitting(true);

        let base64Video = '';
        if (recordedBlob) {
          base64Video = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(recordedBlob);
          });
        }

        const payload = {
          studentName: currentUser.name,
          admissionNumber: currentUser.admissionNumber,
          videoUrl: driveUrlInput.trim() || recordedUrl,
          videoBase64: base64Video ? base64Video.substring(0, 100000) : '',
          submittedDate: new Date().toLocaleDateString(),
          status: 'Submitted for Coach Approval'
        };

        await onSaveGraduationVideo(payload);
        setSubmitting(false);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto" onClick={onClose}>
          <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-7 max-w-2xl w-full border shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-start pb-3 border-b border-slate-200">
              <div>
                <span className="px-2.5 py-0.5 bg-amber-100 text-amber-900 text-[11px] font-extrabold rounded-full uppercase">
                  🎓 100% Graduation Final Task
                </span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">2-Minute Face Introduction Video</h3>
                <p className="text-xs text-slate-500 mt-0.5">
                  Record a 2-minute video with a clear face introducing yourself in English to complete your Mastered Spoken English Certification!
                </p>
              </div>
              <button onClick={onClose} className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs">✕</button>
            </div>

            {gradData ? (
              <div className="p-6 bg-emerald-50 border border-emerald-300 rounded-2xl space-y-3 text-center">
                <span className="text-4xl">🎓</span>
                <h4 className="text-lg font-extrabold text-emerald-900">Graduation Video Submitted Successfully!</h4>
                <p className="text-xs text-emerald-800 leading-relaxed">
                  Your 2-minute self-introduction video has been recorded and submitted to Mastered Language Coach. Your coach will review your video and issue your official Certificate shortly!
                </p>
                <div className="pt-2">
                  <span className="px-3 py-1.5 bg-emerald-600 text-white font-extrabold text-xs rounded-full shadow-sm">
                    Status: {gradData.status || 'Under Coach Review'}
                  </span>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4">
                {/* Recording Viewport Box */}
                <div className="bg-slate-900 rounded-2xl overflow-hidden aspect-video relative flex items-center justify-center text-white shadow-inner">
                  {recordedUrl ? (
                    <video src={recordedUrl} controls className="w-full h-full object-cover" />
                  ) : mediaStream ? (
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                  ) : (
                    <div className="text-center p-6 space-y-3">
                      <p className="text-xs text-slate-400 font-semibold">Webcam Not Started</p>
                      <button
                        type="button"
                        onClick={startCamera}
                        className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                      >
                        📷 Turn On Camera to Record
                      </button>
                    </div>
                  )}

                  {/* Live Recording Timer */}
                  {recording && (
                    <div className="absolute top-3 left-3 bg-red-600 text-white px-3 py-1 rounded-full text-xs font-mono font-bold animate-pulse shadow-md">
                      ● Recording: {Math.floor(timerSec / 60)}:{(timerSec % 60).toString().padStart(2, '0')} / 02:00
                    </div>
                  )}
                </div>

                {/* Recorder Control Strip */}
                <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                  {mediaStream && !recording && (
                    <button
                      type="button"
                      onClick={startRecording}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                    >
                      ⏺ Start 2-Min Recording
                    </button>
                  )}

                  {recording && (
                    <button
                      type="button"
                      onClick={() => stopRecording()}
                      className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                    >
                      ⏹ Stop Recording
                    </button>
                  )}

                  {recordedUrl && (
                    <button
                      type="button"
                      onClick={() => { setRecordedUrl(''); setRecordedBlob(null); startCamera(); }}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition"
                    >
                      🔄 Re-record Video
                    </button>
                  )}

                  {/* Video File Input Fallback */}
                  <div className="text-xs text-slate-600">
                    <label className="font-bold block mb-0.5 text-[11px]">Or Select Recorded Video File:</label>
                    <input type="file" accept="video/*" onChange={handleFileUpload} className="text-[10px]" />
                  </div>
                </div>

                {/* Drive Link Fallback Input */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Or Provide Google Drive Video Link (Optional):</label>
                  <input
                    type="url"
                    value={driveUrlInput}
                    onChange={e => setDriveUrlInput(e.target.value)}
                    placeholder="https://drive.google.com/file/d/..."
                    className="w-full p-3 border rounded-xl text-xs text-slate-900 outline-none focus:border-red-500"
                  />
                </div>

                <div className="flex justify-end space-x-2 pt-3 border-t">
                  <button type="button" onClick={onClose} className="px-4 py-2.5 border rounded-xl font-bold text-xs text-slate-700">Cancel</button>
                  <button
                    type="submit"
                    disabled={submitting}
                    className="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md disabled:opacity-50 transition"
                  >
                    {submitting ? 'Submitting Video...' : '🎓 Submit Graduation Video'}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // Helper to normalize course names consistently across admin and student views
    function normalizeCourseName(c) {
      if (!c) return 'MAL TO ENG';
      const u = String(c).toUpperCase();
      if (u.includes('HIND') || u.includes('HINDI')) return 'HIND TO ENG';
      if (u.includes('TAMIL') || u.includes('TAM')) return 'TAMIL TO ENG';
      if (u.includes('KANNADA') || u.includes('KAN')) return 'KANNADA TO ENG';
      if (u.includes('BENGALI') || u.includes('BEN')) return 'BENGALI TO ENG';
      return 'MAL TO ENG';
    }

    // Deep Monotonic Progress Merge: Always preserves the highest score, latest mission, and quiz achievements across all devices
    function mergeProgressMaps(target, source) {
      if (!target && !source) return {};
      if (!target) return JSON.parse(JSON.stringify(source || {}));
      if (!source) return JSON.parse(JSON.stringify(target || {}));

      const result = { ...target };
      for (const mKey of Object.keys(source)) {
        const sVal = source[mKey];
        if (sVal === undefined || sVal === null) continue;

        // Non-object properties (like latestMissionLevel, codeProgress, graduationVideo, etc.)
        if (typeof sVal !== 'object') {
          if (mKey === 'percentage' || mKey === 'score' || mKey === 'progress' || mKey === 'latestProgress' || mKey === 'codeProgress') {
            result[mKey] = Math.max(Number(result[mKey]) || 0, Number(sVal) || 0);
          } else if (mKey === 'latestMissionLevel' || mKey === 'missionLevel' || mKey === 'level') {
            result[mKey] = Math.max(Number(result[mKey]) || 0, Number(sVal) || 0);
          } else {
            if (result[mKey] === undefined || result[mKey] === null || result[mKey] === '') {
              result[mKey] = sVal;
            }
          }
          continue;
        }

        const tVal = result[mKey];
        if (!tVal || typeof tVal !== 'object') {
          result[mKey] = JSON.parse(JSON.stringify(sVal));
          continue;
        }

        // Deep merge module object
        const mergedMod = { ...tVal, ...sVal };
        // Monotonic module percentage: preserve highest
        const tPct = Number(tVal.percentage) || 0;
        const sPct = Number(sVal.percentage) || 0;
        mergedMod.percentage = Math.max(tPct, sPct);

        // AI Mission completion & proof
        mergedMod.aiMissionCompleted = Boolean(tVal.aiMissionCompleted || sVal.aiMissionCompleted || tVal.aiMissionProof || sVal.aiMissionProof);
        mergedMod.aiMissionProof = sVal.aiMissionProof || tVal.aiMissionProof || null;

        // Deep merge quizScores
        const tQuiz = (tVal.quizScores && typeof tVal.quizScores === 'object') ? tVal.quizScores : {};
        const sQuiz = (sVal.quizScores && typeof sVal.quizScores === 'object') ? sVal.quizScores : {};
        const mergedQuiz = { ...tQuiz };

        for (const qNum of Object.keys(sQuiz)) {
          const sq = sQuiz[qNum];
          if (!sq || typeof sq !== 'object') continue;
          const tq = mergedQuiz[qNum];
          if (!tq || typeof tq !== 'object') {
            mergedQuiz[qNum] = { ...sq };
          } else {
            const tqPct = Number(tq.percentage) || 0;
            const sqPct = Number(sq.percentage) || 0;
            const maxPct = Math.max(tqPct, sqPct);
            const bestObj = (maxPct === sqPct) ? sq : tq;
            mergedQuiz[qNum] = {
              ...bestObj,
              percentage: maxPct,
              passed: maxPct >= 70
            };
          }
        }
        mergedMod.quizScores = mergedQuiz;
        result[mKey] = mergedMod;
      }
      return result;
    }

        if (cleanStudentAdm && userProgress[cleanStudentAdm] && cleanStudentAdm !== studentAdm) {

    // Mastered Code Language - Version 1 (MCL-1) Codebooks
    const MCL_ADM_MAP = {"A":"XK","B":"QF","C":"NV","D":"HT","E":"RM","F":"ZC","G":"PJ","H":"WD","I":"KY","J":"FV","K":"BG","L":"TR","M":"LX","N":"SQ","O":"CP","P":"JN","Q":"VM","R":"DK","S":"YR","T":"GH","U":"MW","V":"KB","W":"RX","X":"TZ","Y":"PF","Z":"HC","0":"VQ","1":"XT","2":"NR","3":"KD","4":"ZM","5":"FW","6":"PB","7":"CJ","8":"HS","9":"YN"};
    const MCL_REV_ADM = Object.fromEntries(Object.entries(MCL_ADM_MAP).map(([k,v]) => [v,k]));

    const MCL_MIS_MAP = {"0":"AQ","1":"BR","2":"CT","3":"DV","4":"EX","5":"FZ","6":"GK","7":"HM","8":"JP","9":"LS"};
    const MCL_REV_MIS = Object.fromEntries(Object.entries(MCL_MIS_MAP).map(([k,v]) => [v,k]));

    const MCL_PROG_MAP = {"0":"UC","1":"VE","2":"WG","3":"XJ","4":"YL","5":"ZN","6":"AP","7":"BS","8":"DU","9":"EW"};
    const MCL_REV_PROG = Object.fromEntries(Object.entries(MCL_PROG_MAP).map(([k,v]) => [v,k]));

    const MCL_LEN_MAP = {3:"QA", 4:"RB", 5:"SC", 6:"TD", 7:"UE", 8:"VF", 9:"WG", 10:"XH", 11:"YJ", 12:"ZK"};
    const MCL_REV_LEN = Object.fromEntries(Object.entries(MCL_LEN_MAP).map(([k,v]) => [v, Number(k)]));

    function encodeMcl1(admInput, missionInput, progressInput) {
      const adm = String(admInput || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!adm || !MCL_LEN_MAP[adm.length]) return "";

      const misNum = parseInt(missionInput) || 1;
      const misStr = String(misNum).padStart(2, "0");

      const progNum = Math.min(100, Math.max(0, parseInt(progressInput) || 0));
      const progStr = String(progNum).padStart(3, "0");

      const L = MCL_LEN_MAP[adm.length];

      let encAdm = "";
      for (let c of adm) { encAdm += (MCL_ADM_MAP[c] || ""); }

      const n = adm.length;
      const n1 = n % 2 !== 0 ? Math.floor((n + 1) / 2) : n / 2;
      const encHalf1 = encAdm.substring(0, n1 * 2);
      const encHalf2 = encAdm.substring(n1 * 2);

      let encMis = "";
      for (let c of misStr) { encMis += (MCL_MIS_MAP[c] || ""); }

      let encProg = "";
      for (let c of progStr) { encProg += (MCL_PROG_MAP[c] || ""); }

      const raw = encProg + encHalf1 + encMis + encHalf2 + L;
      const groups = raw.match(/.{1,4}/g) || [raw];
      return groups.join("-");
    }

    function decodeMcl1(codeStr) {
      const clean = String(codeStr || "").replace(/[^A-Z]/gi, "").toUpperCase();
      if (clean.length < 12) return { success: false, message: "INVALID PROGRESS CODE" };

      const L_code = clean.slice(-2);
      if (!MCL_REV_LEN[L_code]) return { success: false, message: "INVALID PROGRESS CODE" };

      const n = MCL_REV_LEN[L_code];
      const expectedLen = 6 + (2 * n) + 4 + 2;
      if (clean.length !== expectedLen) return { success: false, message: "INVALID PROGRESS CODE" };

      const n1 = n % 2 !== 0 ? Math.floor((n + 1) / 2) : n / 2;
      const n2 = n - n1;

      const encProg = clean.substring(0, 6);
      const encHalf1 = clean.substring(6, 6 + 2 * n1);
      const encMis = clean.substring(6 + 2 * n1, 6 + 2 * n1 + 4);
      const encHalf2 = clean.substring(6 + 2 * n1 + 4, 6 + 2 * n1 + 4 + 2 * n2);

      let progDigits = "";
      for (let i = 0; i < 6; i += 2) {
        const pair = encProg.substring(i, i + 2);
        if (!MCL_REV_PROG[pair]) return { success: false, message: "INVALID PROGRESS CODE" };
        progDigits += MCL_REV_PROG[pair];
      }
      const progress = parseInt(progDigits, 10);

      let misDigits = "";
      for (let i = 0; i < 4; i += 2) {
        const pair = encMis.substring(i, i + 2);
        if (!MCL_REV_MIS[pair]) return { success: false, message: "INVALID PROGRESS CODE" };
        misDigits += MCL_REV_MIS[pair];
      }
      const mission = parseInt(misDigits, 10);

      const fullEncAdm = encHalf1 + encHalf2;
      let admStr = "";
      for (let i = 0; i < fullEncAdm.length; i += 2) {
        const pair = fullEncAdm.substring(i, i + 2);
        if (!MCL_REV_ADM[pair]) return { success: false, message: "INVALID PROGRESS CODE" };
        admStr += MCL_REV_ADM[pair];
      }

      if (mission < 1 || mission > 33 || progress < 0 || progress > 100) {
        return { success: false, message: "INVALID PROGRESS CODE" };
      }

      return { success: true, admissionNumber: admStr, mission, progress };
    }

    // Decoded Progress Report Modal Component
    function DecodedProgressReportModal({ decodedData, currentUser, currentPct, onConfirmSave, onClose }) {

      const userAdm = (currentUser?.admissionNumber || '').toString().toUpperCase().trim();

              'bg-emerald-100 text-emerald-600 border border-emerald-300'
            }`}>
              {!isMatched ? '⛔' : !isGain ? 'ℹ️' : '🎉'}
            </div>

            <div>
              <h3 className="text-xl font-extrabold text-slate-900">MCL-1 Decoded Progress Report</h3>
              <p className="text-xs text-slate-500 mt-1">Mastered Code Language Verification Result</p>
            </div>

            <div className="bg-slate-900 text-white p-4 rounded-2xl space-y-3 text-left border border-slate-800 text-xs">
              <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                <span className="text-slate-400">Student Admission:</span>
                <span className="font-mono font-extrabold text-amber-400 text-sm">{decodedData.admissionNumber}</span>

              <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                <span className="text-slate-400">Mission Level:</span>
