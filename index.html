    // Helper: Clean Embed URLs for YouTube Fast Buffering & Controls Customization
    function getVideoEmbedUrl(url) {
      if (!url) return '';

      const ytShortMatch = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
      const ytStandardMatch = url.match(/v=([a-zA-Z0-9_-]+)/);
      const ytId = ytShortMatch ? ytShortMatch[1] : (ytStandardMatch ? ytStandardMatch[1] : null);

      if (ytId) {
        // Fast buffer URL hiding extraneous overlays, share link, and channel branding
        return `https://www.youtube.com/embed/${ytId}?autoplay=0&rel=0&modestbranding=1&controls=1&showinfo=0&iv_load_policy=3&fs=0&enablejsapi=1`;
      }

      // Google Drive Fallback
      const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }

      return url;
    }

    function getDriveEmbedUrl(url) {
      if (!url) return '';
      const fileIdMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        return `https://drive.google.com/file/d/${fileIdMatch[1]}/preview`;
      }
      return url;
    }

    // Dynamic Direct Fetch & JSONP Hybrid Call to Google Apps Script REST API
    async function callAppsScript(action, payload = {}) {
      const getUrl = `${LIVE_APPS_SCRIPT_URL}?action=${encodeURIComponent(action)}&payload=${encodeURIComponent(JSON.stringify(payload))}&t=${Date.now()}`;
      
      try {
        const response = await fetch(getUrl, { method: "GET", redirect: "follow" });
        const json = await response.json();
        if (json && json.success !== undefined) return json;
      } catch(err) {
        console.warn("Direct fetch fallback, attempting JSONP/no-cors dispatch...", err);
      }

      return new Promise((resolve) => {
        const callbackName = "appsScriptCb_" + Math.floor(Math.random() * 10000000);
        const script = document.createElement("script");
        
        const timeoutId = setTimeout(() => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          fetch(getUrl, { method: "GET", mode: "no-cors" })
            .then(() => resolve({ success: true, message: "Dispatched via no-cors" }))
            .catch(err => resolve({ success: false, message: err.message }));
        }, 4000);

        window[callbackName] = function(data) {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };

        script.src = `${getUrl}&callback=${callbackName}`;
        script.onerror = function() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          fetch(getUrl, { method: "GET", mode: "no-cors" })
            .then(() => resolve({ success: true, message: "Dispatched via no-cors" }))
            .catch(err => resolve({ success: false, message: err.message }));
        };

        document.head.appendChild(script);
      });
    }

    // Interactive Student Quiz Component
    function StudentQuizView({ moduleNumber, moduleTitle, onClose, onSaveScore }) {
      const quizQuestions = (typeof QUIZ_BANK !== 'undefined' && QUIZ_BANK[moduleNumber]) || [];
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [showReview, setShowReview] = useState(false);

      const totalQs = quizQuestions.length;
      const currentQ = quizQuestions[currentIdx];

      const handleSelectOption = (optIndex) => {
        if (isSubmitted) return;
        setUserAnswers(prev => ({
          ...prev,
          [currentIdx]: optIndex
        }));
      };

      const calculateScore = () => {
        let score = 0;
        quizQuestions.forEach((q, idx) => {
          if (userAnswers[idx] !== undefined && userAnswers[idx] === q.correctIndex) {
            score++;
          }
        });
        const percentage = Math.round((score / totalQs) * 100);
        return { score, total: totalQs, percentage };
      };

      const handleSubmitQuiz = () => {
        if (Object.keys(userAnswers).length < totalQs) {
          if (!confirm(`You have answered ${Object.keys(userAnswers).length} out of ${totalQs} questions. Are you sure you want to submit?`)) {
            return;
          }
        }
        const scoreObj = calculateScore();
        setIsSubmitted(true);
        if (onSaveScore) onSaveScore(moduleNumber, scoreObj);
      };

      if (totalQs === 0) {
        return (
          <div className="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4">
            <h3 className="text-lg font-bold text-slate-800">Quiz Coming Soon!</h3>
            <p className="text-xs text-slate-500">The 30-question quiz for Module {moduleNumber} is being prepared.</p>
            <button onClick={onClose} className="px-5 py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl">← Back</button>
          </div>
        );
      }

      const scoreResult = isSubmitted ? calculateScore() : null;

      return (
        <div className="space-y-4 sm:space-y-6">
          {/* Header */}
          <div className="bg-slate-900 text-white p-5 sm:p-7 rounded-2xl sm:rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-l-4 border-red-600">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-[10px] sm:text-xs font-bold text-red-400 uppercase tracking-widest">📝 Module {moduleNumber} Quiz</span>
                <span className="text-[10px] bg-red-950 text-red-300 border border-red-800/60 px-2 py-0.5 rounded-full font-bold">{totalQs} Questions</span>
              </div>
              <h2 className="text-lg sm:text-xl font-extrabold mt-1">{moduleTitle || `Module ${moduleNumber} Practice Quiz`}</h2>
            </div>
            <button onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl self-start sm:self-auto transition">
              ← Exit Quiz
            </button>
          </div>

          {/* Main Container */}
          {!isSubmitted ? (
            <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              {/* Progress Bar */}
              <div className="space-y-2">
                <div className="flex justify-between items-center text-xs font-bold text-slate-600">
                  <span>Question {currentIdx + 1} of {totalQs}</span>
                  <span className="text-red-600 font-extrabold">{Math.round(((currentIdx + 1) / totalQs) * 100)}% Complete</span>
                </div>
                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-red-600 h-full transition-all duration-300 rounded-full" style={{ width: `${((currentIdx + 1) / totalQs) * 100}%` }}></div>
                </div>
              </div>

              {/* Question Card */}
              <div className="space-y-4 pt-2">
                <div className="bg-slate-50 border border-slate-200/80 p-4 sm:p-6 rounded-2xl space-y-2">
                  <h3 className="text-base sm:text-lg font-extrabold text-slate-900 leading-snug">
                    {currentQ.id || (currentIdx + 1)}. {currentQ.question}
                  </h3>
                  {currentQ.questionMl && (
                    <p className="text-xs sm:text-sm text-slate-600 italic font-medium bg-amber-50/80 border border-amber-200/60 p-2.5 rounded-xl">
                      💡 {currentQ.questionMl}
                    </p>
                  )}
                </div>

                {/* Options List */}
                <div className="grid grid-cols-1 gap-3">
                  {currentQ.options.map((opt, optIdx) => {
                    const isSelected = userAnswers[currentIdx] === optIdx;
                    return (
                      <button
                        key={optIdx}
                        onClick={() => handleSelectOption(optIdx)}
                        className={`w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start space-x-3 text-xs sm:text-sm font-semibold ${
                          isSelected
                            ? 'border-red-600 bg-red-50/80 text-red-950 shadow-md ring-2 ring-red-600/20'
                            : 'border-slate-200 hover:border-slate-300 bg-white text-slate-800 hover:bg-slate-50'
                        }`}
                      >
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                          isSelected ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>
                        <span className="flex-1 leading-relaxed">{opt}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Question Navigation Controls */}
              <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                <button
                  onClick={() => setCurrentIdx(prev => Math.max(0, prev - 1))}
                  disabled={currentIdx === 0}
                  className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                  ← Previous
                </button>

                <span className="text-xs text-slate-400 font-bold hidden sm:inline">
                  Answered {Object.keys(userAnswers).length} / {totalQs}
                </span>

                {currentIdx < totalQs - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => Math.min(totalQs - 1, prev + 1))}
                    className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-md transition"
                  >
                    Next Question →
                  </button>
                ) : (
                  <button
                    onClick={handleSubmitQuiz}
                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition"
                  >
                    Submit Quiz 🚀
                  </button>
                )}
              </div>
            </div>
          ) : (
            /* Quiz Results View */
            <div className="bg-white rounded-2xl sm:rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              <div className="text-center space-y-3 py-4 border-b border-slate-100">
                <div className="w-20 h-20 mx-auto rounded-full bg-red-50 border-4 border-red-600 flex items-center justify-center text-2xl font-black text-red-600 shadow-inner">
                  {scoreResult.percentage}%
                </div>
                <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                  {scoreResult.percentage >= 80 ? '🏆 Outstanding Performance!' : (scoreResult.percentage >= 50 ? '🎉 Good Job! Module Passed!' : '💪 Keep Practicing!')}
                </h3>
                <p className="text-xs sm:text-sm text-slate-600 font-medium">
                  You scored <strong className="text-red-600 font-extrabold">{scoreResult.score}</strong> out of <strong className="text-slate-800">{scoreResult.total}</strong> questions correct.
                </p>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                <button
                  onClick={() => setShowReview(!showReview)}
                  className="w-full sm:w-auto px-5 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-md transition"
                >
                  {showReview ? 'Hide Answer Review' : '🔍 Review All 30 Answers'}
                </button>
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setUserAnswers({});
                    setCurrentIdx(0);
                    setShowReview(false);
                  }}
                  className="w-full sm:w-auto px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl transition"
                >
                  🔄 Retake Quiz
                </button>
                <button
                  onClick={onClose}
                  className="w-full sm:w-auto px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                >
                  ✓ Complete & Return to Portal
                </button>
              </div>

              {/* Answer Review Section */}
              {showReview && (
                <div className="space-y-4 pt-4 border-t border-slate-100">
                  <h4 className="font-extrabold text-sm text-slate-900">Detailed Answer Review</h4>
                  <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    {quizQuestions.map((q, idx) => {
                      const userAns = userAnswers[idx];
                      const isCorrect = userAns === q.correctIndex;
                      return (
                        <div key={idx} className={`p-4 rounded-2xl border text-xs space-y-2 ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}`}>
                          <div className="flex items-start justify-between gap-2">
                            <span className="font-bold text-slate-900">{idx + 1}. {q.question}</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}`}>
                              {isCorrect ? '✓ Correct' : '✕ Incorrect'}
                            </span>
                          </div>
                          {q.questionMl && <p className="text-slate-600 italic">💡 {q.questionMl}</p>}
                          <div className="space-y-1 pt-1">
                            {q.options.map((opt, oIdx) => {
                              const isUserChoice = userAns === oIdx;
                              const isCorrectChoice = q.correctIndex === oIdx;
                              let style = 'bg-white text-slate-700 border-slate-200';
                              if (isCorrectChoice) style = 'bg-emerald-100 border-emerald-400 text-emerald-950 font-bold';
                              else if (isUserChoice && !isCorrectChoice) style = 'bg-rose-100 border-rose-400 text-rose-950 font-bold';

                              return (
                                <div key={oIdx} className={`p-2 rounded-xl border text-[11px] flex items-center justify-between ${style}`}>
                                  <span>{opt}</span>
                                  {isCorrectChoice && <span className="text-emerald-700 font-bold text-[10px]">Correct Answer</span>}
                                  {isUserChoice && !isCorrectChoice && <span className="text-rose-700 font-bold text-[10px]">Your Answer</span>}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // AI Mission Room Component (Hands-Free Mastered AI Voice Coach Call Engine)
    function AIMissionRoom({ moduleNumber, moduleTitle, userProgress, onClose, onSaveMissionScore }) {
      const missionData = AI_MISSIONS_BANK[moduleNumber] || {
        missionNumber: moduleNumber,
        title: `Mission ${moduleNumber}: Spoken English Mastery`,
        objective: "Communicate fluently using target module grammar and vocabulary.",
        situation: "Real-life spoken conversation.",
        grammar: ["Target Tense"],
        topics: ["General Practice"]
      };

      const shortWelcome = `Welcome to Mission ${moduleNumber}! Let's start. Please introduce yourself or tell me about ${missionData.topics[0] || 'your goal'}!`;

      const [callActive, setCallActive] = useState(false);
      const [listening, setListening] = useState(false);
      const [coachSpeaking, setCoachSpeaking] = useState(false);
      const [messages, setMessages] = useState([
        {
          sender: 'coach',
          text: shortWelcome,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);
      const [correctCount, setCorrectCount] = useState(0);
      const [correctionsLog, setCorrectionsLog] = useState([]);
      const [status, setStatus] = useState('IN PROGRESS');
      const [finalReport, setFinalReport] = useState(null);

      const recognitionRef = React.useRef(null);
      const callActiveRef = React.useRef(false);
      const coachSpeakingRef = React.useRef(false);
      const speechTimeoutRef = React.useRef(null);
      const uniqueSentencesRef = React.useRef(new Set());
      const hasSpokenInitialGreetingRef = React.useRef(false);

      const stopAudioAndRecognition = () => {
        callActiveRef.current = false;
        coachSpeakingRef.current = false;
        setCallActive(false);
        setListening(false);
        setCoachSpeaking(false);
        if (speechTimeoutRef.current) clearTimeout(speechTimeoutRef.current);
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        if (recognitionRef.current) {
          try { recognitionRef.current.abort(); } catch(e){}
        }
      };

      const handleCloseRoom = () => {
        stopAudioAndRecognition();
        onClose();
      };

      // Select Best Human Voice for Natural Spoken Experience
      const getBestHumanVoice = () => {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;

        const preferred = voices.find(v => 
          (v.name.includes("Google") && v.lang.startsWith("en")) ||
          (v.name.includes("Natural") && v.lang.startsWith("en")) ||
          v.name.includes("Samantha") ||
          v.name.includes("Daniel") ||
          v.name.includes("Karen") ||
          v.name.includes("Alex")
        );

        if (preferred) return preferred;
        return voices.find(v => v.lang.startsWith("en")) || voices[0];
      };

      // Automatic Continuous Mic Listener Loop (Zero Clicks Needed!)
      const safeRestartRecognition = () => {
        if (!callActiveRef.current || coachSpeakingRef.current) return;
        if (!recognitionRef.current) return;

        try { recognitionRef.current.stop(); } catch(e){}

        setTimeout(() => {
          if (callActiveRef.current && !coachSpeakingRef.current && recognitionRef.current) {
            try {
              recognitionRef.current.start();
              setListening(true);
            } catch(e) {
              setTimeout(() => {
                if (callActiveRef.current && !coachSpeakingRef.current && recognitionRef.current) {
                  try { recognitionRef.current.start(); setListening(true); } catch(err){}
                }
              }, 250);
            }
          }
        }, 120);
      };

      const speakText = (text, onEndCallback) => {
        if (!callActiveRef.current && text !== messages[0].text) return;

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'en-US';
          u.rate = 0.92; // Natural conversational rate
          u.pitch = 1.02; // Warm tone

          const humanVoice = getBestHumanVoice();
          if (humanVoice) u.voice = humanVoice;

          coachSpeakingRef.current = true;
          setCoachSpeaking(true);
          setListening(false);

          u.onend = () => {
            coachSpeakingRef.current = false;
            setCoachSpeaking(false);
            if (onEndCallback) onEndCallback();
            if (callActiveRef.current) {
              safeRestartRecognition();
            }
          };
          u.onerror = () => {
            coachSpeakingRef.current = false;
            setCoachSpeaking(false);
            if (callActiveRef.current) {
              safeRestartRecognition();
            }
          };
          window.speechSynthesis.speak(u);
        }
      };

      const handleStudentSpeech = (rawText) => {
        if (status === 'PASSED' || !callActiveRef.current) return;

        const text = rawText.trim();
        if (!text) return;

        const userMsg = {
          sender: 'student',
          text,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);

        if (speechTimeoutRef.current) clearTimeout(speechTimeoutRef.current);

        speechTimeoutRef.current = setTimeout(() => {
          if (!callActiveRef.current) return;

          let coachReply = "";
          let isQuestionToCoach = false;
          let isDuplicate = false;
          let isTooShort = false;

          const lower = text.toLowerCase();
          const words = lower.split(/\s+/).length;
          const cleanNorm = lower.replace(/[^a-z0-9\s]/g, '').trim();

          // 1. Detect Question to Coach
          const questionStarters = ["what", "why", "how", "where", "who", "when", "can you", "could you", "do you", "would you", "is it", "are you", "what is", "who is", "tell me", "help me"];
          if (questionStarters.some(starter => lower.startsWith(starter)) || lower.endsWith("?") || lower.includes("don't understand") || lower.includes("dont understand")) {
            isQuestionToCoach = true;
            if (lower.includes("who are you") || lower.includes("what is your name")) {
              coachReply = `I am your MASTERED AI Voice Coach! I'm here to practice Mission ${moduleNumber}: ${missionData.title} with you. Tell me about ${missionData.topics[0] || 'yourself'}!`;
            } else if (lower.includes("what should i say") || lower.includes("help") || lower.includes("what do you mean")) {
              coachReply = `In this mission, we are practicing ${missionData.situation}. You can talk about ${missionData.topics[correctCount % missionData.topics.length] || 'your daily routine'}. Go ahead!`;
            } else {
              coachReply = `That's a good question! As your speaking coach, I'd love to hear more about ${missionData.topics[correctCount % missionData.topics.length] || 'this topic'}. Give me a complete sentence!`;
            }
          }
          // 2. Check for Grammar Corrections
          else if (lower.includes("i am go") || lower.includes("he go") || lower.includes("she go") || lower.includes("i am agree")) {
            const fixed = text
              .replace(/i am go/gi, "I went")
              .replace(/he go/gi, "he goes")
              .replace(/she go/gi, "she goes")
              .replace(/i am agree/gi, "I agree");
            coachReply = `Good effort! Say: "${fixed}". Please repeat that sentence now.`;
            setCorrectionsLog(prev => [...prev, { original: text, corrected: fixed }]);
          }
          // 3. Check for Duplicate Sentences
          else if (uniqueSentencesRef.current.has(cleanNorm)) {
            isDuplicate = true;
            coachReply = `You already shared that exact thought! Please tell me something new about ${missionData.topics[(correctCount + 1) % missionData.topics.length] || 'your goal'} so we can count it.`;
          }
          // 4. Check length requirement (must be at least 4 words)
          else if (words < 4) {
            isTooShort = true;
            coachReply = `Nice start! Please expand into a complete sentence with at least 4 to 5 words so I can count it for you.`;
          }
          // 5. Valid New Unique Sentence!
          else {
            uniqueSentencesRef.current.add(cleanNorm);
            const newCount = correctCount + 1;
            setCorrectCount(newCount);

            if (newCount >= requiredSentences) {
              setStatus('PASSED');
              coachReply = `Fantastic work! You have successfully completed all ${requiredSentences} separate, unique spoken sentences for Mission ${moduleNumber}. Mission Passed!`;
              
              const report = {
                studentName: userProgress.studentName || 'Student',
                admissionNumber: userProgress.admissionNumber || '',
                missionNumber: moduleNumber,
                date: new Date().toLocaleDateString(),
                requiredSentences: requiredSentences,
                correctSentences: newCount,
                importantMistakes: correctionsLog.length,
                correctionsPracticed: correctionsLog.map(c => c.corrected).join(', ') || 'None',
                finalStatus: 'PASSED'
              };

              setFinalReport(report);
              onSaveMissionScore(moduleNumber, { score: 100, passed: true, report });
            } else {
              const remaining = requiredSentences - newCount;
              const nextTopic = missionData.topics[newCount % missionData.topics.length] || 'your routine';

              if (newCount === 1) {
                coachReply = `Nice to hear that! That is 1 unique sentence recorded (${remaining} remaining). Now, tell me about ${nextTopic}!`;
              } else if (newCount % 5 === 0) {
                coachReply = `Awesome progress! That is ${newCount} unique sentences completed! (${remaining} left). Next, can you speak about ${nextTopic}?`;
              } else {
                coachReply = `Very clear! Sentence ${newCount} recorded. Tell me more about ${nextTopic}!`;
              }
            }
          }

          const coachMsg = {
            sender: 'coach',
            text: coachReply,
            isNote: isQuestionToCoach || isDuplicate || isTooShort,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages(prev => [...prev, coachMsg]);
          speakText(coachReply);
        }, 800);
      };

      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
          const rec = new SpeechRecognition();
          rec.continuous = true;
          rec.interimResults = false;
          rec.lang = 'en-US';

          rec.onresult = (e) => {
            if (!callActiveRef.current || coachSpeakingRef.current) return;
            const lastIdx = e.results.length - 1;
            const transcript = e.results[lastIdx][0].transcript;
            if (transcript.trim()) {
              handleStudentSpeech(transcript.trim());
            }
          };

          rec.onend = () => {
            setListening(false);
            if (callActiveRef.current && !coachSpeakingRef.current) {
              safeRestartRecognition();
            }
          };

          rec.onerror = () => {
            setListening(false);
            if (callActiveRef.current && !coachSpeakingRef.current) {
              safeRestartRecognition();
            }
          };

          recognitionRef.current = rec;
        }

        return () => {
          stopAudioAndRecognition();
        };
      }, [correctCount, status]);

      const toggleCall = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("⚠️ Voice Call Note: Automatic voice input is supported in Chrome, Edge, Safari, and Android browsers! Please open in Chrome or Edge.");
          return;
        }

        if (callActive) {
          stopAudioAndRecognition();
        } else {
          callActiveRef.current = true;
          coachSpeakingRef.current = false;
          setCallActive(true);
          try {
            recognitionRef.current.start();
            setListening(true);
          } catch(e) {}

          if (!hasSpokenInitialGreetingRef.current) {
            hasSpokenInitialGreetingRef.current = true;
            speakText(messages[0].text);
          }
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/85 backdrop-blur-md overflow-y-auto" onClick={handleCloseRoom}>
          <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-7 max-w-3xl w-full border shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            
            {/* Header */}
            <div className="flex justify-between items-start pb-3 border-b border-slate-200">
              <div>
                <span className="px-2.5 py-0.5 bg-red-100 text-red-700 text-[11px] font-extrabold rounded-full uppercase">
                  🎙️ Level {moduleNumber} Mastered AI Voice Coach
                </span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">{missionData.title}</h3>
                <p className="text-xs text-slate-500 mt-0.5">{missionData.objective}</p>
              </div>
              <button onClick={handleCloseRoom} className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs">✕</button>
            </div>

            {/* Live Progress Bar & Sentence Counter */}
            <div className="p-4 bg-slate-900 text-white rounded-2xl space-y-2 border border-slate-800 shadow-md">
              <div className="flex justify-between items-center text-xs">
                <span className="font-bold text-slate-300">Verified Correct Spoken Sentences</span>
                <span className="font-mono font-extrabold text-emerald-400 text-sm">
                  {correctCount} / {requiredSentences}
                </span>
              </div>

              <div className="w-full bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700">
                <div 
                  className="bg-gradient-to-r from-red-600 via-rose-500 to-emerald-500 h-full rounded-full transition-all duration-500" 
                  style={{ width: `${Math.min(100, Math.round((correctCount / requiredSentences) * 100))}%` }}
                ></div>
              </div>

              <div className="flex justify-between items-center text-[11px] pt-1">
                <span className="text-slate-400">Target Grammar: <strong className="text-red-400">{missionData.grammar.join(', ')}</strong></span>
                <span className={`px-2.5 py-0.5 rounded-full font-extrabold text-[10px] ${
                  status === 'PASSED' ? 'bg-emerald-500 text-white' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                }`}>
                  STATUS: {status}
                </span>
              </div>
            </div>

            {status === 'PASSED' && finalReport ? (
              /* Final Mission Report Card */
              <div className="p-6 bg-emerald-950 text-white rounded-2xl border-2 border-emerald-500 shadow-2xl space-y-4 text-center">
                <div className="w-16 h-16 mx-auto rounded-full bg-emerald-800 border-4 border-emerald-400 flex items-center justify-center text-3xl shadow-lg">
                  🏆
                </div>
                <h4 className="text-xl font-black text-emerald-300">MISSION COMPLETED & PASSED!</h4>
                <p className="text-xs text-emerald-100 max-w-md mx-auto">
                  Congratulations! You have completed all {requiredSentences} required correct spoken sentences for Level {moduleNumber}!
                </p>

    // Final Graduation Video Challenge Component (2-Minute Face Introduction Video)
    function GraduationVideoChallenge({ currentUser, userProgress, onSaveGraduationVideo, onClose }) {
      const [mediaStream, setMediaStream] = useState(null);
      const [mediaRecorder, setMediaRecorder] = useState(null);
      const [recording, setRecording] = useState(false);
      const [recordedBlob, setRecordedBlob] = useState(null);
      const [recordedUrl, setRecordedUrl] = useState('');
      const [timerSec, setTimerSec] = useState(0);
      const [driveUrlInput, setDriveUrlInput] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const videoRef = React.useRef(null);
      const timerRef = React.useRef(null);

      const gradData = (userProgress && userProgress.graduationVideo) || null;

      useEffect(() => {
        return () => {
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
          }
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [mediaStream]);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          setMediaStream(stream);
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          alert("⚠️ Camera Access Note: Could not open webcam automatically. You can also upload a recorded video file or paste a Google Drive video link below!");
        }
      };

      const startRecording = () => {
        if (!mediaStream) return;
        const chunks = [];
        const recorder = new MediaRecorder(mediaStream);
        
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          setRecordedBlob(blob);
          setRecordedUrl(URL.createObjectURL(blob));
        };

        recorder.start();
        setMediaRecorder(recorder);
        setRecording(true);
        setTimerSec(0);

        timerRef.current = setInterval(() => {
          setTimerSec(prev => {
            if (prev >= 120) {
              stopRecording(recorder);
              return 120;
            }
            return prev + 1;
          });
        }, 1000);
      };

      const stopRecording = (recToStop) => {
        const targetRec = recToStop || mediaRecorder;
        if (targetRec && targetRec.state !== 'inactive') {
          targetRec.stop();
        }
        if (timerRef.current) clearInterval(timerRef.current);
        setRecording(false);
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          setMediaStream(null);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setRecordedBlob(file);
          setRecordedUrl(URL.createObjectURL(file));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!recordedBlob && !driveUrlInput.trim()) {
          alert("Please record a video, choose a video file, or enter a Google Drive video link!");
          return;
        }

        setSubmitting(true);

        let base64Video = '';
        if (recordedBlob) {
          base64Video = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(recordedBlob);
          });
        }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [role, setRole] = useState(null);
      const [authScreen, setAuthScreen] = useState('login');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedModuleId, setSelectedModuleId] = useState(null);
      const [activeQuizModNumber, setActiveQuizModNumber] = useState(null);
      const [activeQuizModTitle, setActiveQuizModTitle] = useState('');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedStudentForHistory, setSelectedStudentForHistory] = useState(null);
      const [showGraduationModal, setShowGraduationModal] = useState(false);
      const [activeAIMissionModNumber, setActiveAIMissionModNumber] = useState(null);

      // Data Stores
      const [students, setStudents] = useState([]);
      const [requests, setRequests] = useState([]);
      const [modules, setModules] = useState(EXACT_32_MODULES);

      const [customQuizBank, setCustomQuizBank] = useState(() => {
        const saved = localStorage.getItem('mastered_custom_quiz_bank');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch(e) {}
        }
        return typeof QUIZ_BANK !== 'undefined' ? QUIZ_BANK : {};
      });

      useEffect(() => {
        if (customQuizBank && Object.keys(customQuizBank).length > 0) {
          window.QUIZ_BANK = customQuizBank;
          localStorage.setItem('mastered_custom_quiz_bank', JSON.stringify(customQuizBank));
        }
      }, [customQuizBank]);

      const handleSaveModuleQuiz = async (modNum, questions) => {
        setCustomQuizBank(prev => {
          const updated = { ...prev, [modNum]: questions };
          window.QUIZ_BANK = updated;
          return updated;
        });
        showToast(`✅ Saved ${questions.length} questions for Module ${modNum}!`);
        await callAppsScript('adminSaveQuiz', { moduleNumber: modNum, questions });
      };

      const [userProgress, setUserProgress] = useState(() => {
        let initial = {};
        try {
          const session = localStorage.getItem('mastered_user_session');
          if (session) {
            const parsed = JSON.parse(session);
            const adm = parsed?.user?.admissionNumber || parsed?.user?.studentId;
            if (adm) {
              const studentSaved = localStorage.getItem(`mastered_progress_${adm}`);
              if (studentSaved) initial = JSON.parse(studentSaved);
            }
          }
        } catch(e) {}

        if (Object.keys(initial).length === 0) {
          const globalSaved = localStorage.getItem('mastered_progress');
          if (globalSaved) {
            try { initial = JSON.parse(globalSaved); } catch(e) {}
          }
        }
        return initial;
      });

      // Cross-Device Student Progress Sync (Google Apps Script API)
      const syncStudentProgressToCloud = async (updatedProgress) => {
        if (!currentUser) return;
        const adm = currentUser.admissionNumber || currentUser.studentId || '';
        if (!adm) return;

        localStorage.setItem('mastered_progress', JSON.stringify(updatedProgress));
        localStorage.setItem(`mastered_progress_${adm}`, JSON.stringify(updatedProgress));

        await callAppsScript('saveStudentProgress', {
          admissionNumber: adm,
          email: currentUser.email || '',
          userProgress: updatedProgress
        });
      };

      const fetchStudentProgressFromCloud = async (userObj) => {
        if (!userObj) return;
        const adm = userObj.admissionNumber || userObj.studentId || '';
        if (!adm) return;

        const res = await callAppsScript('getStudentProgress', {
          admissionNumber: adm,
          email: userObj.email || ''
        });

        if (res && res.success && res.userProgress && Object.keys(res.userProgress).length > 0) {
          setUserProgress(prev => {
            const merged = { ...prev, ...res.userProgress };
            localStorage.setItem('mastered_progress', JSON.stringify(merged));
            localStorage.setItem(`mastered_progress_${adm}`, JSON.stringify(merged));
            return merged;
          });
        }
      };

      useEffect(() => {
        if (currentUser && role === 'student') {
          fetchStudentProgressFromCloud(currentUser);
        }
      }, [currentUser, role]);

      const handleSaveQuizScore = (modNum, scoreObj) => {
        const modKey = `MOD-${modNum < 10 ? '0' + modNum : modNum}`;
        setUserProgress(prev => {
          const existing = prev[modKey] || { video1: false, audio: false, pdf: false, percentage: 0 };
          const quizScores = existing.quizScores || {};
          quizScores[modNum] = scoreObj;
          const updatedAll = {
            ...prev,
            [modKey]: {
              ...existing,
              quizScores
            }
          };
          localStorage.setItem('mastered_progress', JSON.stringify(updatedAll));
          syncStudentProgressToCloud(updatedAll);
          return updatedAll;
        });
        showToast(`🎉 Quiz score saved: ${scoreObj.score}/${scoreObj.total} (${scoreObj.percentage}%)!`);
        callAppsScript('submitQuizScore', {
          admissionNumber: currentUser ? currentUser.admissionNumber : '',
          studentName: currentUser ? currentUser.name : '',
          moduleNumber: modNum,
          score: scoreObj.score,
          total: scoreObj.total,
          percentage: scoreObj.percentage
        });
      };

      // Save AI Spoken Mission Score
      const handleSaveMissionScore = (modNum, evalObj) => {
        const modKey = `MOD-${modNum < 10 ? '0' + modNum : modNum}`;
        setUserProgress(prev => {
          const existing = prev[modKey] || { video1: false, audio: false, pdf: false, percentage: 0 };
          const updatedMod = {
            ...existing,
            aiMissionScore: evalObj
          };
          const updatedAll = {
            ...prev,
            [modKey]: updatedMod
          };
          localStorage.setItem('mastered_progress', JSON.stringify(updatedAll));
          syncStudentProgressToCloud(updatedAll);
          return updatedAll;
        });
        showToast(`🎉 Level ${modNum} AI Spoken Mission Passed with ${evalObj.score}%!`);
        callAppsScript('submitAIMissionScore', {
          admissionNumber: currentUser ? currentUser.admissionNumber : '',
          studentName: currentUser ? currentUser.name : '',
          moduleNumber: modNum,
          score: evalObj.score,
          feedback: evalObj.feedback
        });
      };

      // Sequential Level Unlocking Logic (Requires 3 Rules: Lessons Complete + Quiz >= 85% + AI Mission >= 85%)
      const isLevelUnlocked = (modNum) => {
        if (modNum === 1) return true; // Level 1 is always unlocked
        const prevModNum = modNum - 1;
        const prevModKey = `MOD-${prevModNum < 10 ? '0' + prevModNum : prevModNum}`;
        const prevProg = userProgress[prevModKey] || {};
        
        const lessonsDone = Boolean(prevProg.video1 && prevProg.audio && prevProg.pdf);
        const quizObj = prevProg.quizScores && prevProg.quizScores[prevModNum];
        const quizPassed = Boolean(quizObj && quizObj.percentage >= 85);
        const missionObj = prevProg.aiMissionScore;

                      {students.length === 0 ? (
                        <p className="text-xs text-slate-500 text-center py-8">No enrolled students currently. Approve pending applications from the Requests queue to add students!</p>
                      ) : (
                        <div className="overflow-x-auto w-full">
                          <table className="w-full text-left text-xs min-w-[600px]">
                            <thead className="bg-slate-50 border-b text-slate-500 font-bold uppercase text-[10px]">
                              <tr>
                                <th className="p-3">Name</th>
                                <th className="p-3">Admission No</th>
                                <th className="p-3">Email</th>
                                <th className="p-3">Course</th>
                                <th className="p-3">Status</th>
                                <th className="p-3 text-right">Student Record</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y">
                              {students.map(s => (
                                <tr key={s.studentId || s.email} className="hover:bg-slate-50">
                                  <td className="p-3 font-bold text-slate-900">{s.name}</td>
                                  <td className="p-3 font-mono text-slate-600">{s.admissionNumber}</td>
                                  <td className="p-3 text-slate-500">{s.email}</td>
                                  <td className="p-3">{s.course}</td>
                                  <td className="p-3"><span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">{s.status || 'Active'}</span></td>
                                  <td className="p-3 text-right">
                                    <div className="flex justify-end space-x-1.5">
                                      <button
                                        onClick={() => setSelectedStudentForHistory(s)}
                                        className="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-[11px] rounded-xl shadow-sm transition"
                                      >
                                        📊 View History
                                      </button>
                                      <button
                                        onClick={() => handleDismissStudent(s)}
                                        className="px-3 py-1.5 bg-rose-100 hover:bg-rose-200 text-rose-700 font-extrabold text-[11px] rounded-xl transition"
                                      >
                                        🚫 Dismiss
                                      </button>
                                    </div>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>
                  )}

                  {/* Pending Requests Tab */}
                  {activeTab === 'admin-requests' && (
                    <div className="space-y-4 sm:space-y-6">
                      <div className="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 flex flex-col sm:flex-row justify-between sm:items-center gap-2 shadow-sm">
                        <div className="flex items-center space-x-2">
                          <button onClick={refreshLiveData} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl">🔄 Refresh Sync</button>
                          <span className="px-3 py-1 bg-amber-100 text-amber-800 font-bold text-xs rounded-full">
                            {pendingRequestsList.length} Pending
                          </span>
                        </div>
                      </div>

                      {pendingRequestsList.length === 0 ? (
                        <div className="bg-white p-8 sm:p-12 text-center rounded-2xl sm:rounded-3xl border border-slate-200">
                          <p className="text-emerald-600 font-bold text-sm sm:text-base">✅ All Applications Reviewed!</p>
                          <p className="text-xs text-slate-400 mt-1">No pending student requests in queue.</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          {pendingRequestsList.map(req => (
                            <div key={req.requestId} className="bg-white p-5 rounded-2xl sm:rounded-3xl border border-slate-200 space-y-3 shadow-sm">
                              <div className="flex justify-between items-center">
                                <span className="font-mono font-bold text-xs text-red-600">{req.admissionNumber}</span>
                                <span className="text-[10px] text-slate-400">{req.createdDate}</span>
                              </div>
                              <div>
                                <h4 className="font-bold text-base text-slate-900">{req.name}</h4>
                                <p className="text-xs text-slate-500">{req.email} • {req.phone}</p>
                                <p className="text-xs font-semibold text-red-900 mt-1">{req.course}</p>
                              </div>

                              <div className="flex space-x-2 pt-2 border-t border-slate-100">
                                <button
                                  onClick={() => handleApproveRequest(req.requestId)}
                                  className="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md transition"
                                >
                                  ✓ Approve & Enroll Student
                                </button>
                                <button
                                  onClick={() => setRequests(prev => prev.map(r => r.requestId === req.requestId ? { ...r, status: 'Rejected' } : r))}
                                  className="px-4 py-2.5 bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-red-600 font-bold text-xs rounded-xl transition"
                                >
                                  Reject
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Module Manager Tab */}
                  {activeTab === 'admin-modules' && (
                    <div className="space-y-4 sm:space-y-6">
                      <div className="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 flex flex-col sm:flex-row justify-between sm:items-center gap-3 shadow-sm">
                        <div>
                          <h3 className="text-base sm:text-lg font-extrabold text-slate-900">32 Curriculum Modules Manager</h3>
                          <p className="text-xs text-slate-500 mt-0.5">Click <strong>"Edit Module"</strong> to modify titles, Drive links, YouTube links, or descriptions.</p>
                        </div>

                        <button
                          onClick={() => {
                            setModuleForm({
                              moduleId: '',
                              moduleNumber: modules.length + 1,
                              title: '',
                              description: '',
                              thumbnail: 'https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800&auto=format&fit=crop&q=80',
                              video1: '',
                              video2: '',
                              audio: '',
                              pdf: '',
                              published: true,
                              order: modules.length + 1
                            });
                            setShowModuleModal(true);
                          }}
                          className="px-4 sm:px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-md self-start sm:self-auto"
                        >
                          + Add New Module
                        </button>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                        {modules.map(m => (
                          <div key={m.moduleId} className="bg-white rounded-2xl sm:rounded-3xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between">
                            <div>
                              <div className="aspect-video bg-slate-100 relative">
                                <img src={m.thumbnail} alt={m.title} className="w-full h-full object-cover" />
                                <div className="absolute top-2.5 left-2.5 bg-slate-900 text-white px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-bold shadow-md border border-red-600/40">
                                  Module {m.moduleNumber}
                                </div>
                              </div>
                              <div className="p-4 sm:p-5 space-y-1.5">
                                <h4 className="font-bold text-sm sm:text-base text-slate-900">{m.title}</h4>
                                <div className="text-xs text-slate-500 leading-relaxed line-clamp-2 whitespace-pre-line">{m.description}</div>
                              </div>
                            </div>

                            <div className="p-3.5 bg-slate-50 border-t flex justify-end space-x-2">
                              <button
                                onClick={() => {
                                  setModuleForm(m);
                                  setShowModuleModal(true);
                                }}
                                className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-sm"
                              >
                                ✏️ Edit Module
                              </button>
                              <button
                                onClick={() => handleDeleteModule(m.moduleId)}
                                className="px-3 py-2 bg-red-100 hover:bg-red-200 text-red-700 font-bold text-xs rounded-xl"
                              >
                                Delete
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Module Modal Form */}
                      {showModuleModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto">
                          <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-6 max-w-xl w-full border shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                            <h3 className="text-base sm:text-lg font-extrabold text-slate-900">
                              {moduleForm.moduleId ? `Edit Module ${moduleForm.moduleNumber}` : 'Create New Course Module'}
                            </h3>

                            <form onSubmit={handleSaveModule} className="space-y-3 text-xs">
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                <div>
                                  <label className="block font-bold mb-1">Module Number</label>
                                  <input type="number" required value={moduleForm.moduleNumber} onChange={e => setModuleForm({ ...moduleForm, moduleNumber: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                                </div>
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Module Title</label>
                                <input type="text" required value={moduleForm.title} onChange={e => setModuleForm({ ...moduleForm, title: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Description / Objectives</label>
                                <textarea rows={4} value={moduleForm.description} onChange={e => setModuleForm({ ...moduleForm, description: e.target.value })} className="w-full p-2.5 border rounded-xl font-mono text-[11px]"></textarea>
                              </div>

                              <div>
                                <label className="block font-bold mb-1">Thumbnail Cover Image URL</label>
                                <input type="url" value={moduleForm.thumbnail} onChange={e => setModuleForm({ ...moduleForm, thumbnail: e.target.value })} className="w-full p-2.5 border rounded-xl" />
                              </div>

                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t">
                                <div>
                                  <label className="block font-bold mb-1">Video (YouTube / Drive Link)</label>
                                  <input type="url" value={moduleForm.video1} onChange={e => setModuleForm({ ...moduleForm, video1: e.target.value })} placeholder="https://youtu.be/..." className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div>
                                  <label className="block font-bold mb-1">Audio Drive Link</label>
                                  <input type="url" value={moduleForm.audio} onChange={e => setModuleForm({ ...moduleForm, audio: e.target.value })} placeholder="https://drive.google.com/..." className="w-full p-2.5 border rounded-xl" />
                                </div>
                                <div className="sm:col-span-2">
                                  <label className="block font-bold mb-1">PDF Drive Link</label>
                                  <input type="url" value={moduleForm.pdf} onChange={e => setModuleForm({ ...moduleForm, pdf: e.target.value })} placeholder="https://drive.google.com/..." className="w-full p-2.5 border rounded-xl" />
                                </div>
                              </div>

                              <div className="flex justify-end space-x-2 pt-3">
                                <button type="button" onClick={() => setShowModuleModal(false)} className="px-4 py-2 border rounded-xl font-bold">Cancel</button>
                                <button type="submit" className="px-6 py-2 bg-red-600 text-white font-bold rounded-xl shadow-md">Save & Update Module</button>
                              </div>
                            </form>
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  {/* Quiz Manager Tab */}
                  {activeTab === 'admin-quizzes' && (
                    <AdminQuizManager
                      modules={modules}
                      quizBank={customQuizBank}
                      onSaveModuleQuiz={handleSaveModuleQuiz}
                    />
                  )}

                  {/* Graduation Videos Manager Tab */}
                  {activeTab === 'admin-graduation' && (
                    <AdminGraduationManager
                      students={students}
                      userProgress={userProgress}
                      onApproveGraduation={handleApproveGraduation}
                    />
                  )}
                </>
              )}

              {/* Student History & Analytics Modal */}
              {selectedStudentForHistory && (
                <StudentHistoryModal
                  student={selectedStudentForHistory}
                  userProgress={userProgress}
                  modules={modules}
                  isAdmin={role === 'admin'}
                  onDismiss={handleDismissStudent}
                  onClose={() => setSelectedStudentForHistory(null)}
                />
              )}

              {/* 100% Graduation Video Challenge Modal */}
              {showGraduationModal && (
                <GraduationVideoChallenge
                  currentUser={currentUser}
                  userProgress={userProgress}
                  onSaveGraduationVideo={handleSaveGraduationVideo}
                  onClose={() => setShowGraduationModal(false)}
                />
              )}
            </main>
          </div>

          {/* Sticky Touch-Friendly Bottom Bar for Mobile */}
          {currentUser && (
            <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-red-900/40 px-4 py-2 flex items-center justify-around text-slate-400 z-30">
              {role === 'student' ? (
                <>
                  <button onClick={() => { setSelectedModuleId(null); setActiveQuizModNumber(null); setActiveTab('dashboard'); }} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'dashboard' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Dashboard</span>
                  </button>
                  <button onClick={() => { setSelectedModuleId(null); setActiveQuizModNumber(null); setActiveTab('modules'); }} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'modules' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Modules ({modules.length})</span>
                  </button>
                  <button onClick={() => { setSelectedModuleId(null); setActiveQuizModNumber(null); setActiveTab('quizzes'); }} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'quizzes' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Quizzes 📝</span>
                  </button>
                </>
              ) : (
                <>
                  <button onClick={() => setActiveTab('admin-dashboard')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-dashboard' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Metrics</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-students')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-students' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Students ({students.length})</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-requests')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-requests' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Requests ({pendingRequestsList.length})</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-modules')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-modules' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Modules ({modules.length})</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-quizzes')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-quizzes' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Quizzes 📝</span>
                  </button>
                  <button onClick={() => setActiveTab('admin-graduation')} className={`flex flex-col items-center text-[10px] font-bold ${activeTab === 'admin-graduation' ? 'text-red-500' : 'text-slate-400'}`}>
                    <span>Graduation 🎓</span>
                  </button>
                </>
              )}
            </div>
          )}
          {/* Active AI Spoken Mission Room Modal */}
          {activeAIMissionModNumber && (
            <AIMissionRoom
              moduleNumber={activeAIMissionModNumber}
              moduleTitle={modules.find(m => m.moduleNumber === activeAIMissionModNumber)?.title || ''}
              userProgress={userProgress}
              onClose={() => setActiveAIMissionModNumber(null)}
              onSaveMissionScore={handleSaveMissionScore}
            />
          )}
        </div>
      );
    }

    // Error Boundary Component to Permanently Prevent Blank Screen Issues
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("Mastered Portal Application Error:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center space-y-4">
              <div className="w-16 h-16 rounded-full bg-red-600/20 border-2 border-red-500 flex items-center justify-center text-3xl shadow-lg">
                ⚠️
              </div>
              <h2 className="text-xl font-extrabold">Mastered Language Coach Portal Reconnecting...</h2>
              <p className="text-xs text-slate-400 max-w-md leading-relaxed">
                Your portal session is being re-established. Click below to refresh and load your up-to-date dashboard.
              </p>
              <button
                onClick={() => window.location.reload()}
                className="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition"
              >
                🔄 Refresh Portal Session
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
