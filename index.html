  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // Transparent PNG Logo Asset
    const LOGO_SRC = "assets/logo.png";

    const modules = (typeof window !== 'undefined' && window.EXACT_32_MODULES) || (typeof EXACT_32_MODULES !== 'undefined' ? EXACT_32_MODULES : []);

    // Helper: Clean Embed URLs for YouTube Fast Buffering & Controls Customization
    function getVideoEmbedUrl(url) {
      if (!url) return '';

      const ytShortMatch = url.match(/youtu\.be\/([a-zA-Z0-9_-]+)/);
      const ytStandardMatch = url.match(/v=([a-zA-Z0-9_-]+)/);
      const ytId = ytShortMatch ? ytShortMatch[1] : (ytStandardMatch ? ytStandardMatch[1] : null);

      if (ytId) {
        // Fast buffer URL hiding extraneous overlays, share link, and channel branding
        return `https://www.youtube.com/embed/${ytId}?autoplay=0&rel=0&modestbranding=1&controls=1&showinfo=0&iv_load_policy=3&fs=0&enablejsapi=1`;
      }

      // Google Drive Fallback
      const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
      }

      return url;
    }

    function getDriveEmbedUrl(url) {
      if (!url) return '';
      const fileIdMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileIdMatch && fileIdMatch[1]) {
        return `https://drive.google.com/file/d/${fileIdMatch[1]}/preview`;
      }
      return url;
    }

    // Dynamic Direct Fetch & JSONP Hybrid Call to Google Apps Script REST API
    async function callAppsScript(action, payload = {}) {
      const getUrl = `${LIVE_APPS_SCRIPT_URL}?action=${encodeURIComponent(action)}&payload=${encodeURIComponent(JSON.stringify(payload))}&t=${Date.now()}`;
      
      try {
        const response = await fetch(getUrl, { method: "GET", redirect: "follow" });
        const json = await response.json();
        if (json && json.success !== undefined) return json;
      } catch(err) {
        console.warn("Direct fetch fallback, attempting JSONP/no-cors dispatch...", err);
      }

      return new Promise((resolve) => {
        const callbackName = "appsScriptCb_" + Math.floor(Math.random() * 10000000);
        const script = document.createElement("script");
        
        const timeoutId = setTimeout(() => {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          fetch(getUrl, { method: "GET", mode: "no-cors" })
            .then(() => resolve({ success: true, message: "Dispatched via no-cors" }))
            .catch(err => resolve({ success: false, message: err.message }));
        }, 4000);

        window[callbackName] = function(data) {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };

        script.src = `${getUrl}&callback=${callbackName}`;
        script.onerror = function() {
          clearTimeout(timeoutId);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          fetch(getUrl, { method: "GET", mode: "no-cors" })
            .then(() => resolve({ success: true, message: "Dispatched via no-cors" }))
            .catch(err => resolve({ success: false, message: err.message }));
        };

        document.head.appendChild(script);
      });
    }

    // Interactive Student Quiz Component
    function StudentQuizView({ moduleNumber, moduleTitle, onClose, onSaveScore }) {
      const bank = (typeof window !== 'undefined' && window.QUIZ_BANK) || (typeof QUIZ_BANK !== 'undefined' ? QUIZ_BANK : {});
      const quizQuestions = bank[moduleNumber] || [];
      const [currentIdx, setCurrentIdx] = useState(0);
      const [userAnswers, setUserAnswers] = useState({});
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [showReview, setShowReview] = useState(false);

      const totalQs = quizQuestions.length;
      const currentQ = quizQuestions[currentIdx];

      const handleSelectOption = (optIndex) => {
        if (isSubmitted) return;
        setUserAnswers(prev => ({
          ...prev,
          [currentIdx]: optIndex
        }));
      };

      const calculateScore = () => {
        let score = 0;
        quizQuestions.forEach((q, idx) => {
          if (userAnswers[idx] !== undefined && userAnswers[idx] === q.correctIndex) {
            score++;
          }
        });
        const percentage = Math.round((score / totalQs) * 100);
        return { score, total: totalQs, percentage };
      };

      const handleSubmitQuiz = () => {
        if (Object.keys(userAnswers).length < totalQs) {
          if (!confirm(`You have answered ${Object.keys(userAnswers).length} out of ${totalQs} questions. Are you sure you want to submit?`)) {
            return;
          }
        }
        const scoreObj = calculateScore();
        setIsSubmitted(true);
        if (onSaveScore) onSaveScore(moduleNumber, scoreObj);
      };

      if (totalQs === 0) {
        return (
          <div className="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-4">
            <h3 className="text-lg font-bold text-slate-800">Quiz Coming Soon!</h3>
            <p className="text-xs text-slate-500">The 30-question quiz for Module {moduleNumber} is being prepared.</p>
            <button onClick={onClose} className="px-5 py-2.5 bg-slate-900 text-white text-xs font-bold rounded-xl">← Back</button>
          </div>
        );
      }

      const scoreResult = isSubmitted ? calculateScore() : null;

      return (
        <div className="space-y-4 sm:space-y-6">
          {/* Header */}
          <div className="bg-slate-900 text-white p-5 sm:p-7 rounded-2xl sm:rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between sm:items-center gap-3 border-l-4 border-red-600">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-[10px] sm:text-xs font-bold text-red-400 uppercase tracking-widest">📝 Module {moduleNumber} Quiz</span>
                <span className="text-[10px] bg-red-950 text-red-300 border border-red-800/60 px-2 py-0.5 rounded-full font-bold">{totalQs} Questions</span>
              </div>
              <h2 className="text-lg sm:text-xl font-extrabold mt-1">{moduleTitle || `Module ${moduleNumber} Practice Quiz`}</h2>
            </div>
            <button onClick={onClose} className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl self-start sm:self-auto transition">
              ← Exit Quiz
            </button>
          </div>

          {/* Main Container */}
          {!isSubmitted ? (
            <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              {/* Progress Bar */}
              <div className="space-y-2">
                <div className="flex justify-between items-center text-xs font-bold text-slate-600">
                  <span>Question {currentIdx + 1} of {totalQs}</span>
                  <span className="text-red-600 font-extrabold">{Math.round(((currentIdx + 1) / totalQs) * 100)}% Complete</span>
                </div>
                <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                  <div className="bg-red-600 h-full transition-all duration-300 rounded-full" style={{ width: `${((currentIdx + 1) / totalQs) * 100}%` }}></div>
                </div>
              </div>

              {/* Question Card */}
              <div className="space-y-4 pt-2">
                <div className="bg-slate-50 border border-slate-200/80 p-4 sm:p-6 rounded-2xl space-y-2">
                  <h3 className="text-base sm:text-lg font-extrabold text-slate-900 leading-snug">
                    {currentQ.id || (currentIdx + 1)}. {currentQ.question}
                  </h3>
                  {currentQ.questionMl && (
                    <p className="text-xs sm:text-sm text-slate-600 italic font-medium bg-amber-50/80 border border-amber-200/60 p-2.5 rounded-xl">
                      💡 {currentQ.questionMl}
                    </p>
                  )}
                </div>

                {/* Options List */}
                <div className="grid grid-cols-1 gap-3">
                  {currentQ.options.map((opt, optIdx) => {
                    const isSelected = userAnswers[currentIdx] === optIdx;
                    return (
                      <button
                        key={optIdx}
                        onClick={() => handleSelectOption(optIdx)}
                        className={`w-full text-left p-4 rounded-2xl border-2 transition-all flex items-start space-x-3 text-xs sm:text-sm font-semibold ${
                          isSelected
                            ? 'border-red-600 bg-red-50/80 text-red-950 shadow-md ring-2 ring-red-600/20'
                            : 'border-slate-200 hover:border-slate-300 bg-white text-slate-800 hover:bg-slate-50'
                        }`}
                      >
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${
                          isSelected ? 'bg-red-600 text-white' : 'bg-slate-100 text-slate-600'
                        }`}>
                          {String.fromCharCode(65 + optIdx)}
                        </span>
                        <span className="flex-1 leading-relaxed">{opt}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Question Navigation Controls */}
              <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                <button
                  onClick={() => setCurrentIdx(prev => Math.max(0, prev - 1))}
                  disabled={currentIdx === 0}
                  className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed"
                >
                  ← Previous
                </button>

                <span className="text-xs text-slate-400 font-bold hidden sm:inline">
                  Answered {Object.keys(userAnswers).length} / {totalQs}
                </span>

                {currentIdx < totalQs - 1 ? (
                  <button
                    onClick={() => setCurrentIdx(prev => Math.min(totalQs - 1, prev + 1))}
                    className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-xl shadow-md transition"
                  >
                    Next Question →
                  </button>
                ) : (
                  <button
                    onClick={handleSubmitQuiz}
                    className="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition"
                  >
                    Submit Quiz 🚀
                  </button>
                )}
              </div>
            </div>
          ) : (
            /* Quiz Results View */
            <div className="bg-white rounded-2xl sm:rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
              <div className="text-center space-y-3 py-4 border-b border-slate-100">
                <div className="w-20 h-20 mx-auto rounded-full bg-red-50 border-4 border-red-600 flex items-center justify-center text-2xl font-black text-red-600 shadow-inner">
                  {scoreResult.percentage}%
                </div>
                <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900">
                  {scoreResult.percentage >= 80 ? '🏆 Outstanding Performance!' : (scoreResult.percentage >= 50 ? '🎉 Good Job! Module Passed!' : '💪 Keep Practicing!')}
                </h3>
                <p className="text-xs sm:text-sm text-slate-600 font-medium">
                  You scored <strong className="text-red-600 font-extrabold">{scoreResult.score}</strong> out of <strong className="text-slate-800">{scoreResult.total}</strong> questions correct.
                </p>
              </div>

              {/* Action Buttons */}
              <div className="flex flex-col sm:flex-row items-center justify-center gap-3">
                <button
                  onClick={() => setShowReview(!showReview)}
                  className="w-full sm:w-auto px-5 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-md transition"
                >
                  {showReview ? 'Hide Answer Review' : '🔍 Review All 30 Answers'}
                </button>
                <button
                  onClick={() => {
                    setIsSubmitted(false);
                    setUserAnswers({});
                    setCurrentIdx(0);
                    setShowReview(false);
                  }}
                  className="w-full sm:w-auto px-5 py-3 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-xs rounded-xl transition"
                >
                  🔄 Retake Quiz
                </button>
                <button
                  onClick={onClose}
                  className="w-full sm:w-auto px-6 py-3 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                >
                  ✓ Complete & Return to Portal
                </button>
              </div>

              {/* Answer Review Section */}
              {showReview && (
                <div className="space-y-4 pt-4 border-t border-slate-100">
                  <h4 className="font-extrabold text-sm text-slate-900">Detailed Answer Review</h4>
                  <div className="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    {quizQuestions.map((q, idx) => {
                      const userAns = userAnswers[idx];
                      const isCorrect = userAns === q.correctIndex;
                      return (
                        <div key={idx} className={`p-4 rounded-2xl border text-xs space-y-2 ${isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}`}>
                          <div className="flex items-start justify-between gap-2">
                            <span className="font-bold text-slate-900">{idx + 1}. {q.question}</span>
                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold shrink-0 ${isCorrect ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'}`}>
                              {isCorrect ? '✓ Correct' : '✕ Incorrect'}
                            </span>
                          </div>
                          {q.questionMl && <p className="text-slate-600 italic">💡 {q.questionMl}</p>}
                          <div className="space-y-1 pt-1">
                            {q.options.map((opt, oIdx) => {
                              const isUserChoice = userAns === oIdx;
                              const isCorrectChoice = q.correctIndex === oIdx;
                              let style = 'bg-white text-slate-700 border-slate-200';
                              if (isCorrectChoice) style = 'bg-emerald-100 border-emerald-400 text-emerald-950 font-bold';
                              else if (isUserChoice && !isCorrectChoice) style = 'bg-rose-100 border-rose-400 text-rose-950 font-bold';

                              return (
                                <div key={oIdx} className={`p-2 rounded-xl border text-[11px] flex items-center justify-between ${style}`}>
                                  <span>{opt}</span>
                                  {isCorrectChoice && <span className="text-emerald-700 font-bold text-[10px]">Correct Answer</span>}
                                  {isUserChoice && !isCorrectChoice && <span className="text-rose-700 font-bold text-[10px]">Your Answer</span>}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }
    function StudentQuizzesHub({ modules, userProgress, onStartQuiz }) {
      const isLevelUnlocked = (modNum) => {
        if (modNum === 1) return true;
        const prevModNum = modNum - 1;
        const prevModKey = `MOD-${prevModNum < 10 ? '0' + prevModNum : prevModNum}`;
        const prevProg = userProgress[prevModKey] || {};
        
        const lessonsDone = Boolean(prevProg.video1 && prevProg.audio && prevProg.pdf);
        const quizObj = prevProg.quizScores && prevProg.quizScores[prevModNum];
        const quizPassed = Boolean(quizObj && quizObj.percentage >= 85);

        return lessonsDone && quizPassed;
      };

      return (
        <div className="space-y-4 sm:space-y-6">
          <div className="bg-slate-900 text-white p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-xl flex flex-col sm:flex-row justify-between sm:items-center gap-2 border-l-4 border-red-600">
            <div>
              <span className="text-[10px] sm:text-xs font-bold text-red-400 uppercase tracking-wider">Sequential Level System</span>
              <h2 className="text-xl sm:text-2xl font-extrabold mt-0.5">30-Question Module Quizzes</h2>
              <p className="text-xs text-slate-300 mt-1">Unlock each level sequentially by completing module lessons and earning 85%+ on the 30-question Quiz!</p>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            {modules.map(m => {
              const modNum = m.moduleNumber;
              const bank = (typeof window !== 'undefined' && window.QUIZ_BANK) || (typeof QUIZ_BANK !== 'undefined' ? QUIZ_BANK : {});
              const quizQuestions = bank[modNum] || [];
              const scoreData = (userProgress[m.moduleId] && userProgress[m.moduleId].quizScores && userProgress[m.moduleId].quizScores[modNum]) || null;
              const unlocked = isLevelUnlocked(modNum);

              return (
                <div key={m.moduleId} className={`p-5 rounded-2xl sm:rounded-3xl border shadow-sm flex flex-col justify-between space-y-4 transition ${
                  unlocked ? 'bg-white border-slate-200 hover:border-red-500' : 'bg-slate-100/70 border-slate-200 opacity-80'
                }`}>
                  <div className="space-y-2">
                    <div className="flex justify-between items-center">
                      <span className={`px-2.5 py-1 font-bold text-[10px] rounded-full border ${
                        unlocked ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-200 text-slate-600 border-slate-300'
                      }`}>
                        Level {modNum}
                      </span>
                      <span className="text-[10px] font-bold text-slate-500 font-mono flex items-center space-x-1">
                        {unlocked ? (
                          (scoreData && scoreData.percentage >= 85) ? (
                            <span className="text-emerald-700 font-extrabold bg-emerald-100 px-2 py-0.5 rounded-full">✓ Level Mastered</span>
                          ) : (
                            <span className="text-blue-700 font-bold bg-blue-50 px-2 py-0.5 rounded-full">🔓 Level Unlocked</span>
                          )
                        ) : (
                          <span className="text-amber-800 font-bold bg-amber-100 px-2 py-0.5 rounded-full">🔒 Locked Level</span>
                        )}
                      </span>
                    </div>
                    <h4 className="font-extrabold text-slate-900 text-sm sm:text-base leading-snug">{m.title}</h4>
                    
                    {!unlocked ? (
                      <p className="text-xs text-amber-800 font-medium bg-amber-50 p-2.5 rounded-xl border border-amber-200">
                        🔒 Requires Lessons + 85% Quiz on Module {modNum - 1}.
                      </p>
                    ) : (
                      <div className="space-y-1.5">
                        {scoreData ? (
                          <div className="p-2.5 bg-emerald-50 border border-emerald-200 rounded-xl flex justify-between items-center text-xs font-bold text-emerald-900">
                            <span>📝 Quiz Score:</span>
                            <span>{scoreData.score}/30 ({scoreData.percentage}%)</span>
                          </div>
                        ) : (
                          <p className="text-[11px] text-slate-500 italic">Quiz Pending (85%+ required)</p>
                        )}
                      </div>
                    )}
                  </div>

                  <div>
                    {unlocked ? (
                      <div className="flex space-x-2 pt-2 border-t border-slate-100">
                        <button
                          onClick={() => onStartQuiz(modNum, m.title)}
                          className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs rounded-xl shadow-sm transition"
                        >
                          📝 Take 30-Question Quiz
                        </button>
                      </div>
                    ) : (
                      <button
                        onClick={() => alert(`🔒 Level ${modNum} is Locked!\n\nYou must complete Lessons and earn 85%+ on Quiz for Module ${modNum - 1} to unlock Level ${modNum}.`)}
                        className="w-full py-2.5 bg-slate-200 text-slate-500 font-bold text-xs rounded-xl cursor-not-allowed"
                      >
                        🔒 Level Locked
                      </button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // Admin Quiz Manager Component
    function AdminQuizManager({ modules, quizBank, onSaveModuleQuiz }) {
      const [selectedModNum, setSelectedModNum] = useState(1);
      const [searchQuery, setSearchQuery] = useState('');
      const [editingQuestion, setEditingQuestion] = useState(null);
      const [editingIdx, setEditingIdx] = useState(-1);

      const currentQuestions = (quizBank && quizBank[selectedModNum]) || [];

      const filteredQuestions = currentQuestions.filter(q => {
        if (!searchQuery.trim()) return true;
        const query = searchQuery.toLowerCase();
        return (
          q.question.toLowerCase().includes(query) ||
          (q.questionMl && q.questionMl.toLowerCase().includes(query)) ||
          q.options.some(opt => opt.toLowerCase().includes(query))
        );
      });

      const handleOpenEdit = (q, idx) => {
        setEditingIdx(idx);
        setEditingQuestion({
          id: q ? q.id : currentQuestions.length + 1,
          question: q ? q.question : '',
          questionMl: q ? q.questionMl : '',
          options: q ? [...q.options] : ['', '', '', ''],
          correctIndex: q ? q.correctIndex : 0
        });

          onSaveModuleQuiz(selectedModNum, updated);

      };

        e.preventDefault();
        const updated = [...currentQuestions];

            ...editingQuestion,

          {/* Module Selector & Filter Bar */}
          <div className="bg-white p-4 sm:p-6 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">

              <label className="block text-xs font-bold text-slate-700 mb-1">Select Module to Edit</label>
              <select

                  const qCount = (quizBank && quizBank[num]) ? quizBank[num].length : 0;
                  return (
                    <option key={num} value={num}>

                    </option>

            </div>

            <div className="flex-1 max-w-sm">
              <label className="block text-xs font-bold text-slate-700 mb-1">Search Questions</label>
              <input
                type="text"
                placeholder="Search question text or Malayalam..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="w-full p-3 rounded-xl border border-slate-300 text-xs text-slate-900 focus:border-red-500 outline-none"
              />

          </div>

          {/* Questions List */}
          <div className="space-y-4">
            <div className="flex justify-between items-center px-1">
              <h3 className="text-sm sm:text-base font-extrabold text-slate-900">
                Module {selectedModNum} Questions ({filteredQuestions.length} of {currentQuestions.length})

            </div>

            {filteredQuestions.length === 0 ? (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 text-center space-y-2">
                <p className="text-sm font-bold text-slate-600">No questions found matching your search.</p>
                <button onClick={() => setSearchQuery('')} className="text-xs text-red-600 font-bold hover:underline">Clear Search Filter</button>
              </div>
            ) : (
              <div className="space-y-4">
                {filteredQuestions.map((q, idx) => {
                  const actualIdx = currentQuestions.findIndex(origQ => origQ === q);
                  return (
                    <div key={idx} className="bg-white p-5 rounded-2xl sm:rounded-3xl border border-slate-200 shadow-sm space-y-3">
                      <div className="flex items-start justify-between gap-3">
                        <div className="space-y-1">
                          <span className="px-2 py-0.5 bg-slate-100 text-slate-700 text-[10px] font-bold rounded-md font-mono">Q{q.id || (actualIdx + 1)}</span>

                        <div className="flex space-x-2 shrink-0">

                            ✏️ Edit

                          <button

                      {/* Options Grid */}

          {/* Question Edit / Create Modal */}

    // Final Graduation Video Challenge Component (2-Minute Face Introduction Video)
    function GraduationVideoChallenge({ currentUser, userProgress, onSaveGraduationVideo, onClose }) {
      const [mediaStream, setMediaStream] = useState(null);
      const [mediaRecorder, setMediaRecorder] = useState(null);
      const [recording, setRecording] = useState(false);
      const [recordedBlob, setRecordedBlob] = useState(null);
      const [recordedUrl, setRecordedUrl] = useState('');
      const [timerSec, setTimerSec] = useState(0);
      const [driveUrlInput, setDriveUrlInput] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const videoRef = React.useRef(null);
      const timerRef = React.useRef(null);

      const gradData = (userProgress && userProgress.graduationVideo) || null;

      useEffect(() => {
        return () => {
          if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
          }
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [mediaStream]);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          setMediaStream(stream);
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          alert("⚠️ Camera Access Note: Could not open webcam automatically. You can also upload a recorded video file or paste a Google Drive video link below!");
        }
      };

      const startRecording = () => {
        if (!mediaStream) return;
        const chunks = [];
        const recorder = new MediaRecorder(mediaStream);
        
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          setRecordedBlob(blob);
          setRecordedUrl(URL.createObjectURL(blob));
        };

        recorder.start();
        setMediaRecorder(recorder);
        setRecording(true);
        setTimerSec(0);

        timerRef.current = setInterval(() => {
          setTimerSec(prev => {
            if (prev >= 120) {
              stopRecording(recorder);
              return 120;
            }
            return prev + 1;
          });
        }, 1000);
      };

      const stopRecording = (recToStop) => {
        const targetRec = recToStop || mediaRecorder;
        if (targetRec && targetRec.state !== 'inactive') {
          targetRec.stop();
        }
        if (timerRef.current) clearInterval(timerRef.current);
        setRecording(false);
        if (mediaStream) {
          mediaStream.getTracks().forEach(track => track.stop());
          setMediaStream(null);
        }
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          setRecordedBlob(file);
          setRecordedUrl(URL.createObjectURL(file));
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!recordedBlob && !driveUrlInput.trim()) {
          alert("Please record a video, choose a video file, or enter a Google Drive video link!");
          return;
        }

        setSubmitting(true);

        let base64Video = '';
        if (recordedBlob) {
          base64Video = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.readAsDataURL(recordedBlob);
          });
        }

        const payload = {
          studentName: currentUser.name,
          admissionNumber: currentUser.admissionNumber,
          videoUrl: driveUrlInput.trim() || recordedUrl,
          videoBase64: base64Video ? base64Video.substring(0, 100000) : '',
          submittedDate: new Date().toLocaleDateString(),
          status: 'Submitted for Coach Approval'
        };

        await onSaveGraduationVideo(payload);
        setSubmitting(false);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto" onClick={onClose}>
          <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-7 max-w-2xl w-full border shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-start pb-3 border-b border-slate-200">
              <div>
                <span className="px-2.5 py-0.5 bg-amber-100 text-amber-900 text-[11px] font-extrabold rounded-full uppercase">
                  🎓 100% Graduation Final Task
                </span>
                <h3 className="text-xl font-extrabold text-slate-900 mt-1">2-Minute Face Introduction Video</h3>
                <p className="text-xs text-slate-500 mt-0.5">
                  Record a 2-minute video with a clear face introducing yourself in English to complete your Mastered Spoken English Certification!
                </p>
              </div>
              <button onClick={onClose} className="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs">✕</button>
            </div>

            {gradData ? (
              <div className="p-6 bg-emerald-50 border border-emerald-300 rounded-2xl space-y-3 text-center">
                <span className="text-4xl">🎓</span>
                <h4 className="text-lg font-extrabold text-emerald-900">Graduation Video Submitted Successfully!</h4>
                <p className="text-xs text-emerald-800 leading-relaxed">
                  Your 2-minute self-introduction video has been recorded and submitted to Mastered Language Coach. Your coach will review your video and issue your official Certificate shortly!
                </p>
                <div className="pt-2">
                  <span className="px-3 py-1.5 bg-emerald-600 text-white font-extrabold text-xs rounded-full shadow-sm">
                    Status: {gradData.status || 'Under Coach Review'}
                  </span>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSubmit} className="space-y-4">
                {/* Recording Viewport Box */}
                <div className="bg-slate-900 rounded-2xl overflow-hidden aspect-video relative flex items-center justify-center text-white shadow-inner">
                  {recordedUrl ? (
                    <video src={recordedUrl} controls className="w-full h-full object-cover" />
                  ) : mediaStream ? (
                    <video ref={videoRef} autoPlay playsInline muted className="w-full h-full object-cover" />
                  ) : (
                    <div className="text-center p-6 space-y-3">
                      <p className="text-xs text-slate-400 font-semibold">Webcam Not Started</p>
                      <button
                        type="button"
                        onClick={startCamera}
                        className="px-5 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                      >
                        📷 Turn On Camera to Record
                      </button>
                    </div>
                  )}

                  {/* Live Recording Timer */}
                  {recording && (
                    <div className="absolute top-3 left-3 bg-red-600 text-white px-3 py-1 rounded-full text-xs font-mono font-bold animate-pulse shadow-md">
                      ● Recording: {Math.floor(timerSec / 60)}:{(timerSec % 60).toString().padStart(2, '0')} / 02:00
                    </div>
                  )}
                </div>

                {/* Recorder Control Strip */}
                <div className="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                  {mediaStream && !recording && (
                    <button
                      type="button"
                      onClick={startRecording}
                      className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                    >
                      ⏺ Start 2-Min Recording
                    </button>
                  )}

                  {recording && (
                    <button
                      type="button"
                      onClick={() => stopRecording()}
                      className="px-4 py-2 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md transition"
                    >
                      ⏹ Stop Recording
                    </button>
                  )}

                  {recordedUrl && (
                    <button
                      type="button"
                      onClick={() => { setRecordedUrl(''); setRecordedBlob(null); startCamera(); }}
                      className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs rounded-xl transition"
                    >
                      🔄 Re-record Video
                    </button>
                  )}

                  {/* Video File Input Fallback */}
                  <div className="text-xs text-slate-600">
                    <label className="font-bold block mb-0.5 text-[11px]">Or Select Recorded Video File:</label>
                    <input type="file" accept="video/*" onChange={handleFileUpload} className="text-[10px]" />
                  </div>
                </div>

                {/* Drive Link Fallback Input */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Or Provide Google Drive Video Link (Optional):</label>
                  <input
                    type="url"
                    value={driveUrlInput}
                    onChange={e => setDriveUrlInput(e.target.value)}
                    placeholder="https://drive.google.com/file/d/..."
                    className="w-full p-3 border rounded-xl text-xs text-slate-900 outline-none focus:border-red-500"
                  />
                </div>

                <div className="flex justify-end space-x-2 pt-3 border-t">
                  <button type="button" onClick={onClose} className="px-4 py-2.5 border rounded-xl font-bold text-xs text-slate-700">Cancel</button>
                  <button
                    type="submit"
                    disabled={submitting}
                    className="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-md disabled:opacity-50 transition"
                  >
                    {submitting ? 'Submitting Video...' : '🎓 Submit Graduation Video'}
                  </button>
                </div>
              </form>
            )}
          </div>
        </div>
      );
    }

    // Comprehensive Student History & Analytics Modal Component
    function StudentHistoryModal({ student, userProgress, modules, isAdmin, onDismiss, onClose }) {
      if (!student) return null;

      // Extract progress data ONLY for this specific student (no fallback to other students)
      const studentAdm = (student.admissionNumber || '').toString().trim().toUpperCase();
      const studentEmail = (student.email || '').toString().trim().toLowerCase();
      
      let progData = {};
      if (userProgress && typeof userProgress === 'object') {
        if (studentAdm && userProgress[studentAdm]) {
          progData = userProgress[studentAdm];
        } else if (studentEmail && userProgress[studentEmail]) {
          progData = userProgress[studentEmail];
        }
      }

      let totalVideo = 0;
      let totalAudio = 0;
      let totalPdf = 0;
      let totalQuizzesTaken = 0;
      let totalQuizScoreSum = 0;
      let totalQuizzesPassed = 0;

      modules.forEach(m => {
        const modKey = `MOD-${m.moduleNumber < 10 ? '0' + m.moduleNumber : m.moduleNumber}`;
        const mData = progData[modKey] || {};
        if (mData.video1) totalVideo++;
        if (mData.audio) totalAudio++;
        if (mData.pdf) totalPdf++;

        const qScores = mData.quizScores || {};
        const qObj = qScores[m.moduleNumber];
        if (qObj) {
          totalQuizzesTaken++;
          totalQuizScoreSum += (qObj.percentage || 0);
          if (qObj.percentage >= 70) totalQuizzesPassed++;
        }
      });

      const overallLessonsComp = totalVideo + totalAudio + totalPdf;
      const overallLessonsTotal = modules.length * 3;
      const overallPercentage = Math.round((overallLessonsComp / overallLessonsTotal) * 100);
      const avgQuizScore = totalQuizzesTaken > 0 ? Math.round(totalQuizScoreSum / totalQuizzesTaken) : 0;

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto" onClick={onClose}>
          <div className="bg-white rounded-2xl sm:rounded-3xl p-5 sm:p-7 max-w-3xl w-full border shadow-2xl space-y-6 max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
            
            {/* Modal Header */}
            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 pb-4 border-b border-slate-200">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="px-2.5 py-0.5 bg-red-100 text-red-700 text-xs font-bold font-mono rounded-full uppercase">
                    {student.admissionNumber || 'STUDENT'}
                  </span>
                  <span className="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-0.5 rounded-full">
                    ● Enrolled Student
                  </span>
                </div>
                <h3 className="text-xl sm:text-2xl font-extrabold text-slate-900 mt-1">{student.name}</h3>
                <p className="text-xs text-slate-500 mt-0.5">{student.email} • {student.phone || 'No Phone Registered'} • {student.course || 'Spoken English Course'}</p>
              </div>
              <div className="flex items-center space-x-2 self-end sm:self-auto">
                {isAdmin && (
                  <button
                    onClick={() => onDismiss(student)}
                    className="px-3.5 py-2 bg-rose-100 hover:bg-rose-200 text-rose-700 font-extrabold rounded-xl text-xs transition flex items-center space-x-1"
                  >
                    <span>🚫 Dismiss Student</span>
                  </button>
                )}
                <button
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition"
                >
                  ✕ Close
                </button>
              </div>
            </div>

            {/* Analytics Score Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div className="bg-slate-900 text-white p-4 rounded-2xl space-y-1">
                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Overall Progress</span>
                <h4 className="text-2xl font-extrabold text-red-500">{overallPercentage}%</h4>
                <p className="text-[10px] text-slate-300">{overallLessonsComp} of {overallLessonsTotal} items</p>
              </div>

              <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-1">
                <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Quizzes Passed</span>
                <h4 className="text-2xl font-extrabold text-emerald-600">{totalQuizzesPassed} <span className="text-xs font-semibold text-slate-400">/ {modules.length}</span></h4>
                <p className="text-[10px] text-slate-500">Score &gt;= 70% threshold</p>
              </div>

              <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-1">
                <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Avg Quiz Score</span>
                <h4 className="text-2xl font-extrabold text-amber-600">{avgQuizScore}%</h4>
                <p className="text-[10px] text-slate-500">{totalQuizzesTaken} modules completed</p>
              </div>

              <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl space-y-1">
                <span className="text-[10px] text-slate-500 font-bold uppercase tracking-wider">Completed Content</span>
                <h4 className="text-2xl font-extrabold text-slate-900">{totalVideo + totalAudio + totalPdf}</h4>
                <p className="text-[10px] text-slate-500">🎬 {totalVideo}v | 🎧 {totalAudio}a | 📄 {totalPdf}p</p>
              </div>
            </div>

            {/* Complete 32 Modules Progress Breakdown */}
            <div className="space-y-3">
              <h4 className="font-extrabold text-sm sm:text-base text-slate-900 flex items-center justify-between">
                <span>All 32 Curriculum Modules History & Quiz Log</span>
                <span className="text-xs text-slate-500 font-normal">Real-Time Database Records</span>
              </h4>

              <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                <div className="max-h-80 overflow-y-auto divide-y divide-slate-100 text-xs">
                  {modules.map(m => {
                    const modKey = `MOD-${m.moduleNumber < 10 ? '0' + m.moduleNumber : m.moduleNumber}`;
                    const mData = progData[modKey] || {};
                    const qScores = mData.quizScores || {};
                    const qObj = qScores[m.moduleNumber];

                    return (
                      <div key={m.moduleNumber} className="p-3 bg-white hover:bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                        <div className="space-y-0.5">
                          <div className="flex items-center space-x-2">
                            <span className="px-2 py-0.5 bg-slate-100 text-slate-700 font-mono font-bold text-[10px] rounded">
                              Mod {m.moduleNumber}
                            </span>
                            <h5 className="font-bold text-slate-900">{m.title.replace(/^Module \d+:\s*/, '')}</h5>
                          </div>
                          <div className="flex items-center space-x-3 text-[11px] text-slate-500">
                            <span>Video: {mData.video1 ? '✅ Watched' : '⚪ Pending'}</span>
                            <span>Audio: {mData.audio ? '✅ Listened' : '⚪ Pending'}</span>
                            <span>PDF: {mData.pdf ? '✅ Studied' : '⚪ Pending'}</span>
                          </div>
                        </div>

                        <div className="flex items-center space-x-2 shrink-0">
                          {qObj ? (
                            <div className="text-right">
                              <span className={`px-2.5 py-1 rounded-xl text-xs font-extrabold ${
                                qObj.percentage >= 85 ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' :
                                qObj.percentage >= 70 ? 'bg-blue-100 text-blue-800 border border-blue-300' : 'bg-amber-100 text-amber-800 border border-amber-300'
                              }`}>
                                📝 Quiz: {qObj.score}/30 ({qObj.percentage}%)
                              </span>
                            </div>
                          ) : (
                            <span className="px-2.5 py-1 bg-slate-100 text-slate-400 text-xs font-semibold rounded-xl">
                              Quiz Pending
                            </span>
                          )}

                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [role, setRole] = useState(null);
      const [authScreen, setAuthScreen] = useState('login');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedModuleId, setSelectedModuleId] = useState(null);
      const [activeQuizModNumber, setActiveQuizModNumber] = useState(null);
      const [activeQuizModTitle, setActiveQuizModTitle] = useState('');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedStudentForHistory, setSelectedStudentForHistory] = useState(null);
      const [showGraduationModal, setShowGraduationModal] = useState(false);
      // Data Stores
      const [students, setStudents] = useState([]);
      const [requests, setRequests] = useState([]);
      const [modules, setModules] = useState(() => (typeof window !== 'undefined' && window.EXACT_32_MODULES) || (typeof EXACT_32_MODULES !== 'undefined' ? EXACT_32_MODULES : []));

      const [customQuizBank, setCustomQuizBank] = useState(() => {
        const saved = localStorage.getItem('mastered_custom_quiz_bank');
        if (saved) {
          try {
            return JSON.parse(saved);
          } catch(e) {}
        }
        return (typeof window !== 'undefined' && window.QUIZ_BANK) || (typeof QUIZ_BANK !== 'undefined' ? QUIZ_BANK : {});
      });

      useEffect(() => {
        if (customQuizBank && Object.keys(customQuizBank).length > 0) {
          window.QUIZ_BANK = customQuizBank;
          localStorage.setItem('mastered_custom_quiz_bank', JSON.stringify(customQuizBank));
        }
      }, [customQuizBank]);

      const handleSaveModuleQuiz = async (modNum, questions) => {
        setCustomQuizBank(prev => {
          const updated = { ...prev, [modNum]: questions };
          window.QUIZ_BANK = updated;
          return updated;
        });
        showToast(`✅ Saved ${questions.length} questions for Module ${modNum}!`);
        await callAppsScript('adminSaveQuiz', { moduleNumber: modNum, questions });
      };


      const [userProgress, setUserProgress] = useState(() => {
        let initial = {};
        try {
          const session = localStorage.getItem('mastered_user_session');
          if (session) {
            const parsed = JSON.parse(session);
            const adm = (parsed && parsed.user) ? (parsed.user.admissionNumber || parsed.user.studentId) : null;
            if (adm) {
              const studentSaved = localStorage.getItem(`mastered_progress_${adm}`);
              if (studentSaved) {
                const p = JSON.parse(studentSaved);
                if (p && typeof p === 'object') initial = p;
              }
            }
          }
        } catch(e) {}

        if (!initial || typeof initial !== 'object' || Object.keys(initial).length === 0) {
          const globalSaved = localStorage.getItem('mastered_progress');
          if (globalSaved) {
            try {
              const g = JSON.parse(globalSaved);
              if (g && typeof g === 'object') initial = g;
            } catch(e) {}
          }
        }
        return (initial && typeof initial === 'object') ? initial : {};
      });

      // Cross-Device Student Progress Sync (Google Apps Script API & Permanent Cloud Database)
      const syncStudentProgressToCloud = async (updatedStudentProgress) => {
        if (!currentUser) return;
        const adm = (currentUser.admissionNumber || currentUser.studentId || '').toString().trim().toUpperCase();
        if (!adm) return;

        setUserProgress(prev => {
          const currentStudentMap = prev[adm] || {};
          const mergedStudentProg = { ...currentStudentMap, ...updatedStudentProgress };
          const allStudentsProg = { ...prev, [adm]: mergedStudentProg };
          localStorage.setItem('mastered_all_students_progress', JSON.stringify(allStudentsProg));
          localStorage.setItem(`mastered_progress_${adm}`, JSON.stringify(mergedStudentProg));
          return allStudentsProg;
        });

        await callAppsScript('saveStudentProgress', {
          admissionNumber: adm,
          email: currentUser.email || '',
          userProgress: updatedStudentProgress
        });
      };

      const fetchStudentProgressFromCloud = async (userObj) => {
        if (!userObj) return;
        const adm = (userObj.admissionNumber || userObj.studentId || '').toString().trim().toUpperCase();
        if (!adm) return;

        try {
          const res = await callAppsScript('getStudentProgress', {
            admissionNumber: adm,
            email: userObj.email || ''
          });

          if (res && res.success && res.userProgress && Object.keys(res.userProgress).length > 0) {
            setUserProgress(prev => {
              const currentStudentMap = prev[adm] || {};
              const mergedStudentProg = { ...currentStudentMap, ...res.userProgress };
              const allStudentsProg = { ...prev, [adm]: mergedStudentProg };
              localStorage.setItem('mastered_all_students_progress', JSON.stringify(allStudentsProg));
              localStorage.setItem(`mastered_progress_${adm}`, JSON.stringify(mergedStudentProg));
              return allStudentsProg;
            });
          }
        } catch(e) {}
      };

      useEffect(() => {
        if (currentUser && role === 'student') {
          fetchStudentProgressFromCloud(currentUser);
        }
      }, [currentUser, role]);

      // Helper to get active student progress map
      const getCurrentStudentProgressMap = () => {
        if (!currentUser) return userProgress || {};
        const adm = (currentUser.admissionNumber || currentUser.studentId || '').toString().trim().toUpperCase();
        return (userProgress && userProgress[adm]) ? userProgress[adm] : userProgress;
      };

      const currentStudentProg = getCurrentStudentProgressMap();

      const handleSaveQuizScore = (modNum, scoreObj) => {
        const modKey = `MOD-${modNum < 10 ? '0' + modNum : modNum}`;
        const activeProg = getCurrentStudentProgressMap();
        const existing = activeProg[modKey] || { video1: false, audio: false, pdf: false, percentage: 0 };
        const quizScores = existing.quizScores || {};
        quizScores[modNum] = scoreObj;
        
        const updatedStudentProg = {
          ...activeProg,
          [modKey]: {
            ...existing,
            quizScores
          }
        };

        syncStudentProgressToCloud(updatedStudentProg);
        showToast(`🎉 Quiz score saved: ${scoreObj.score}/${scoreObj.total} (${scoreObj.percentage}%)!`);
        callAppsScript('submitQuizScore', {
          admissionNumber: currentUser ? currentUser.admissionNumber : '',
          studentName: currentUser ? currentUser.name : '',
          moduleNumber: modNum,
          score: scoreObj.score,
          total: scoreObj.total,
          percentage: scoreObj.percentage
        });
      };

      // Sequential Level Unlocking Logic (Requires 2 Rules: Lessons Complete + Quiz >= 85%)
      const isLevelUnlocked = (modNum) => {
        if (modNum === 1) return true;
        const prevModNum = modNum - 1;
        const prevModKey = `MOD-${prevModNum < 10 ? '0' + prevModNum : prevModNum}`;
        const activeProg = getCurrentStudentProgressMap();
        const prevProg = activeProg[prevModKey] || {};
        
        const lessonsDone = Boolean(prevProg.video1 && prevProg.audio && prevProg.pdf);
        const quizObj = prevProg.quizScores && prevProg.quizScores[prevModNum];
        const quizPassed = Boolean(quizObj && quizObj.percentage >= 85);

        return lessonsDone && quizPassed;
      };

      // Mark Lesson Complete
      const handleMarkItemComplete = (modId, itemKey) => {
        const activeProg = getCurrentStudentProgressMap();
        const existing = activeProg[modId] || { video1: false, audio: false, pdf: false, percentage: 0 };
        const updated = { ...existing, [itemKey]: true };
        
        let count = 0;
        if (updated.video1) count++;
        if (updated.audio) count++;
        if (updated.pdf) count++;
        updated.percentage = Math.round((count / 3) * 100);

        const updatedStudentProg = { ...activeProg, [modId]: updated };
        syncStudentProgressToCloud(updatedStudentProg);
        showToast("✨ Progress updated!");
      };

      // Handle opening student history modal with live cloud sync
      const handleOpenStudentHistory = (student) => {
        setSelectedStudentForHistory(student);
        fetchStudentProgressFromCloud(student);
      };

      // 100% Course Graduation Video Status
      const is100PercentGraduated = (() => {
        const activeProg = getCurrentStudentProgressMap();
        if (!activeProg || typeof activeProg !== 'object') return false;
        const mod32Quiz = activeProg['MOD-32'] && activeProg['MOD-32'].quizScores && activeProg['MOD-32'].quizScores[32];
        return Boolean(mod32Quiz && mod32Quiz.percentage >= 85);
      })();

      // Save 2-Minute Graduation Video
      const handleSaveGraduationVideo = async (payload) => {
        setUserProgress(prev => {
          const updated = {
            ...prev,
            graduationVideo: payload
          };
          localStorage.setItem('mastered_progress', JSON.stringify(updated));
          return updated;
        });
        showToast("🎓 2-Minute Graduation Video Submitted Successfully!");
        setShowGraduationModal(false);
        await callAppsScript('submitGraduationVideo', payload);
        refreshLiveData();
      };

      // Approve Student Graduation (Admin)
      const handleApproveGraduation = async (studentToApprove) => {
        const adm = studentToApprove.admissionNumber;
        setUserProgress(prev => {
          const studentProg = prev[adm] || {};
          const updatedStudentProg = {
            ...studentProg,
            graduationVideo: {
              ...(studentProg.graduationVideo || {}),
              status: '🎓 Approved & Certified'
            }
          };
          const updatedAll = { ...prev, [adm]: updatedStudentProg };
          localStorage.setItem('mastered_progress', JSON.stringify(updatedAll));
          return updatedAll;
        });
        showToast(`🎓 Approved Graduation Certificate for ${studentToApprove.name}!`);
        await callAppsScript('approveGraduation', { admissionNumber: adm });
        refreshLiveData();
      };

      // Session restore on page refresh (F5)
      useEffect(() => {
        const savedSession = localStorage.getItem('mastered_user_session');
        if (savedSession) {
          try {
            const parsed = JSON.parse(savedSession);
            if (parsed && parsed.user && parsed.role) {
              setCurrentUser(parsed.user);
              setRole(parsed.role);
              setActiveTab(parsed.tab || (parsed.role === 'admin' ? 'admin-dashboard' : 'dashboard'));
            }
          } catch(e) {}
        }
      }, []);

      // Live Google Sheets Request & Student Sync (Every 3 seconds across devices)
      const refreshLiveData = async () => {
        try {
          const reqRes = await callAppsScript('getRequests');
          if (reqRes && reqRes.success && Array.isArray(reqRes.data)) {
            setRequests(reqRes.data);
          }

          const stdRes = await callAppsScript('getStudents');
          if (stdRes && stdRes.success && Array.isArray(stdRes.data)) {
            setStudents(stdRes.data);
          }
        } catch(e) {}
      };

      useEffect(() => {
        refreshLiveData();
        const timer = setInterval(refreshLiveData, 3000);
        return () => clearInterval(timer);
      }, []);

      // Save user progress safely
      useEffect(() => {
        if (userProgress && Object.keys(userProgress).length > 0) {
          localStorage.setItem('mastered_progress', JSON.stringify(userProgress));
          if (currentUser && (currentUser.admissionNumber || currentUser.studentId)) {
            const adm = currentUser.admissionNumber || currentUser.studentId;
            localStorage.setItem(`mastered_progress_${adm}`, JSON.stringify(userProgress));
          }
        }
      }, [userProgress, currentUser]);

      // Anti-Screen Recording & Anti-Screenshot Security Shortcuts Listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (
            e.key === 'PrintScreen' ||
            e.key === 'F12' ||
            (e.ctrlKey && (e.key === 'p' || e.key === 'P' || e.key === 's' || e.key === 'S' || e.key === 'u' || e.key === 'U')) ||
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'C' || e.key === 'c'))
          ) {
            e.preventDefault();
            showToast("⚠️ Security Active: Screenshot & Recording Shortcuts Disabled");
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Lesson Sub-Tab inside Student Module View
      const [lessonTab, setLessonTab] = useState('video1');

      // Admin Module Modal Form State
      const [showModuleModal, setShowModuleModal] = useState(false);
      const [moduleForm, setModuleForm] = useState({
        moduleId: '',
        moduleNumber: 1,
        title: '',
        description: '',
        thumbnail: 'https://images.unsplash.com/photo-1557804506-669a67965ba0?w=800&auto=format&fit=crop&q=80',
        video1: '',
        video2: '',
        audio: '',
        pdf: '',
        published: true,
        order: 1
      });

      // Toast Notification
      const [toast, setToast] = useState(null);
      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3500);
      };

      // Student Login
      const handleStudentLogin = async (email, adm) => {
        const live = await callAppsScript('loginStudent', { email, admissionNumber: adm });
        if (live && live.success && live.student) {
          setCurrentUser(live.student);
          setRole('student');
          setActiveTab('dashboard');
          localStorage.setItem('mastered_user_session', JSON.stringify({ user: live.student, role: 'student', tab: 'dashboard' }));
          return { success: true };
        }

        const found = students.find(s => s.email.toLowerCase() === email.trim().toLowerCase() && s.admissionNumber.toUpperCase() === adm.trim().toUpperCase());
        if (found && found.approved) {
          setCurrentUser(found);
          setRole('student');
          setActiveTab('dashboard');
          localStorage.setItem('mastered_user_session', JSON.stringify({ user: found, role: 'student', tab: 'dashboard' }));
          return { success: true };
        }
        return { success: false, message: (live && live.message) || "Invalid credentials or account pending approval." };
      };

      // Admin Login
      const handleAdminLogin = async (email, pass) => {
        const cleanEmail = email.trim().toLowerCase();
        const cleanPass = pass.trim();

        if (cleanEmail === "masteredlanguagecoach@gmail.com" && cleanPass === "4languagecoach") {
          const adminObj = { adminId: "ADM-002", name: "Mastered Language Coach", email: "masteredlanguagecoach@gmail.com", role: "Super Admin" };
          setCurrentUser(adminObj);
          setRole('admin');
          setActiveTab('admin-dashboard');
          localStorage.setItem('mastered_user_session', JSON.stringify({ user: adminObj, role: 'admin', tab: 'admin-dashboard' }));
          return { success: true };
        }

        const live = await callAppsScript('loginAdmin', { email: cleanEmail, password: cleanPass });
        if (live && live.success && live.admin) {
          setCurrentUser(live.admin);
          setRole('admin');
          setActiveTab('admin-dashboard');
          localStorage.setItem('mastered_user_session', JSON.stringify({ user: live.admin, role: 'admin', tab: 'admin-dashboard' }));
          return { success: true };
        }

        return { success: false, message: "Invalid admin email or password." };
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setRole(null);
        setAuthScreen('login');
        setSelectedModuleId(null);
        setMobileMenuOpen(false);
        localStorage.removeItem('mastered_user_session');
      };

      const [isSubmittingRequest, setIsSubmittingRequest] = useState(false);

      // Submit Access Request (Strict 3-Layer Anti-Duplicate Engine)
      const handleSubmitAccessRequest = async (e) => {
        e.preventDefault();
        if (isSubmittingRequest) return;

        const form = e.target;
        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const phone = form.phone.value.trim();
        const admissionNumber = form.admissionNumber.value.trim().toUpperCase();
        const course = form.course.value;

        // 1. Check if admission number or email exists in Requests (ANY status: Pending, Approved, Rejected)
        const existsInRequests = (requests || []).some(r => 
          r && typeof r === 'object' && (
            (r.admissionNumber && r.admissionNumber.toString().trim().toUpperCase() === admissionNumber) ||
            (r.email && r.email.toString().trim().toLowerCase() === email.toLowerCase())
          )
        );

        // 2. Check if student is already enrolled in Student Directory
        const existsInStudents = (students || []).some(s => 
          s && typeof s === 'object' && (
            (s.admissionNumber && s.admissionNumber.toString().trim().toUpperCase() === admissionNumber) ||
            (s.email && s.email.toString().trim().toLowerCase() === email.toLowerCase())
          )
        );

        // 3. Check local submission memory lock
        const localSubmittedAdm = localStorage.getItem(`mastered_req_adm_${admissionNumber}`);
        const localSubmittedEmail = localStorage.getItem(`mastered_req_email_${email.toLowerCase()}`);

        if (existsInRequests || existsInStudents || localSubmittedAdm || localSubmittedEmail) {
          alert(`⛔ Access Application Already Exists!\nAdmission Number "${admissionNumber}" or Email "${email}" has ALREADY submitted an application or is enrolled in Mastered Language Coach.\n\nDuplicate entries are strictly blocked. Please proceed to login or wait for coach approval!`);
          setAuthScreen('login');
          return;
        }

        setIsSubmittingRequest(true);

        const newReq = {
          requestId: `REQ-${Math.floor(1000 + Math.random() * 9000)}`,
          name,
          email,
          phone,
          admissionNumber,
          course,
          status: 'Pending',
          preventDuplicate: true,
          createdDate: new Date().toISOString().split('T')[0]
        };

        // Set local submission lock
        localStorage.setItem(`mastered_req_adm_${admissionNumber}`, 'true');
        localStorage.setItem(`mastered_req_email_${email.toLowerCase()}`, 'true');

        setRequests(prev => [newReq, ...(prev || [])]);
        showToast("⏳ Submitting request to Mastered Language Coach system...");

        try {
          const res = await callAppsScript('submitRequest', newReq);
          if (res && res.duplicate) {
            alert(`⛔ Access Application Already Exists!\nGoogle Sheets recorded an existing request for "${admissionNumber}". Duplicate entry was blocked.`);
          } else {
            alert("🎉 Access Application Submitted Successfully!\nYour request is recorded live in the Mastered Language Coach database. The coach will review and approve your access shortly!");
          }
        } catch(err) {
          alert("🎉 Application Submitted Successfully!\nYour details have been sent to the Mastered Language Coach team.");
        } finally {

      // Approve Student Access Request (Guaranteed Unique Student Enrollment)

        if (!req) return;
        const targetAdm = (req.admissionNumber || '').toString().trim().toUpperCase();
        const targetEmail = (req.email || '').toString().trim().toLowerCase();

        // 1. Mark all duplicate request entries for this student as Approved
        setRequests(prev => (prev || []).map(r => {
          if (!r || typeof r !== 'object') return r;
          const rAdm = (r.admissionNumber || '').toString().trim().toUpperCase();
          const rEmail = (r.email || '').toString().trim().toLowerCase();
          if ((targetAdm && rAdm === targetAdm) || (targetEmail && rEmail === targetEmail)) {
            return { ...r, status: 'Approved' };
          }
          return r;
        }));

        // 2. Check if student is ALREADY enrolled in Student Directory
        const alreadyEnrolled = (students || []).some(s => {
          if (!s || typeof s !== 'object') return false;
          const sAdm = (s.admissionNumber || '').toString().trim().toUpperCase();
          const sEmail = (s.email || '').toString().trim().toLowerCase();
          return (targetAdm && sAdm === targetAdm) || (targetEmail && sEmail === targetEmail);

        if (alreadyEnrolled) {
          showToast(`ℹ️ ${req.name} is already enrolled in the Student Directory.`);
          await callAppsScript('approveRequest', { requestId: req.requestId, admissionNumber: req.admissionNumber, email: req.email });
          refreshLiveData();
          return;

        const newStudent = {
          studentId: `STD-${Math.floor(1000 + Math.random() * 9000)}`,
          admissionNumber: req.admissionNumber,
          name: req.name,
          email: req.email,
          phone: req.phone,
          course: req.course,
          profileImage: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&auto=format&fit=crop&q=80",

          status: "Active",
          createdDate: new Date().toISOString().split('T')[0]
        };

        showToast(`✅ Approved request for ${req.name}! Enrolled in Student Directory.`);

        const targetEmail = (req.email || '').toString().trim().toLowerCase();

        setRequests(prev => (prev || []).map(r => {
          if (!r || typeof r !== 'object') return r;
          const rAdm = (r.admissionNumber || '').toString().trim().toUpperCase();
          const rEmail = (r.email || '').toString().trim().toLowerCase();
          if ((targetAdm && rAdm === targetAdm) || (targetEmail && rEmail === targetEmail)) {
            return { ...r, status: 'Rejected' };
          }
          return r;

        showToast(`🚫 Request rejected for ${req.name}.`);
        await callAppsScript('rejectRequest', { requestId: req.requestId, admissionNumber: req.admissionNumber, email: req.email });
        refreshLiveData();

      const uniquePendingRequests = React.useMemo(() => {
        const map = new Map();
        if (!Array.isArray(requests)) return [];
        requests.forEach(r => {
          if (r && typeof r === 'object' && r.status === 'Pending') {
            const admKey = (r.admissionNumber || '').toString().trim().toUpperCase();
            const emailKey = (r.email || '').toString().trim().toLowerCase();
            const key = admKey || emailKey || r.requestId || Math.random();
            if (!map.has(key)) {
              map.set(key, r);
            }
          }
        });
        return Array.from(map.values());
      }, [requests]);

      // Automatic Student Deduplication: Guarantee exactly 1 unique student record per admission number
      const uniqueStudentsList = React.useMemo(() => {
        const map = new Map();
        if (!Array.isArray(students)) return [];
        students.forEach(s => {
          if (s && typeof s === 'object') {
            const admKey = (s.admissionNumber || '').toString().trim().toUpperCase();
            const emailKey = (s.email || '').toString().trim().toLowerCase();
            const key = admKey || emailKey || s.studentId || Math.random();
            if (!map.has(key)) {

        return Array.from(map.values());
