    // Helper to generate downloadable high-resolution HTML5 Canvas Result Card (NO raw MLC codes)
    function generateResultCardDataUrl(summary) {
      if (typeof document === 'undefined') return null;
      var canvas = document.createElement('canvas');
      canvas.width = 1200;
      canvas.height = 760;
      var ctx = canvas.getContext('2d');
      if (!ctx) return null;

      var grad = ctx.createLinearGradient(0, 0, 1200, 760);
      grad.addColorStop(0, '#0F172A');
      grad.addColorStop(0.5, '#1E1B4B');
      grad.addColorStop(1, '#0F172A');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1200, 760);

      ctx.strokeStyle = '#6366F1';
      ctx.lineWidth = 4;
      ctx.strokeRect(30, 30, 1140, 700);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.fillRect(50, 50, 1100, 660);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 36px sans-serif';
      ctx.fillText('MASTERED LANGUAGE COACH', 80, 120);

      ctx.fillStyle = '#A5B4FC';
      ctx.font = '600 18px sans-serif';
      ctx.fillText('OFFICIAL AI SPEAKING PRACTICE MISSION RESULT', 80, 155);

      var isPassed = summary && (summary.missionStatus === 'PASSED' || summary.missionStatus === 'COMPLETED' || summary.progressPct >= 100);
      ctx.fillStyle = isPassed ? '#10B981' : '#F59E0B';
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(870, 85, 240, 50, 12);
        ctx.fill();
      } else {
        ctx.fillRect(870, 85, 240, 50);
      }

      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isPassed ? 'MISSION PASSED' : 'IN PROGRESS', 990, 117);
      ctx.textAlign = 'left';

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(80, 190);
      ctx.lineTo(1120, 190);
      ctx.stroke();

      ctx.fillStyle = '#94A3B8';
      ctx.font = '600 15px sans-serif';
      ctx.fillText('STUDENT NAME', 80, 235);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText((summary && summary.name) || 'Student', 80, 270);

      ctx.fillStyle = '#94A3B8';
      ctx.font = '600 15px sans-serif';
      ctx.fillText('ADMISSION NUMBER', 430, 235);
      ctx.fillStyle = '#38BDF8';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText((summary && summary.admissionNumber) || 'N/A', 430, 270);

      ctx.fillStyle = '#94A3B8';
      ctx.font = '600 15px sans-serif';
      ctx.fillText('MISSION TITLE', 780, 235);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 22px sans-serif';
      ctx.fillText('Mission ' + ((summary && summary.currentMission) || 1) + ': ' + ((summary && summary.missionTitle) || ''), 780, 270);

      ctx.fillStyle = 'rgba(99, 102, 241, 0.15)';
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(80, 315, 1040, 130, 16);
        ctx.fill();
      } else {
        ctx.fillRect(80, 315, 1040, 130);
      }
      ctx.strokeStyle = '#4F46E5';
      ctx.stroke();

      ctx.fillStyle = '#C7D2FE';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('VERIFIED SPOKEN SENTENCES', 120, 355);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = 'bold 44px sans-serif';
      ctx.fillText(((summary && summary.verifiedSentences) || 0) + ' / ' + ((summary && summary.missionTarget) || 30), 120, 410);

      ctx.fillStyle = '#C7D2FE';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('OFFICIAL PROGRESS', 760, 355);
      ctx.fillStyle = '#10B981';
      ctx.font = 'bold 44px sans-serif';
      ctx.fillText(((summary && summary.progressPct) || 0) + '%', 760, 410);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
      if (typeof ctx.roundRect === 'function') {
        ctx.beginPath();
        ctx.roundRect(80, 470, 1040, 100, 14);
        ctx.fill();
      } else {
        ctx.fillRect(80, 470, 1040, 100);
      }

      ctx.fillStyle = '#FBBF24';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('NEXT PRACTICE STEP:', 110, 508);
      ctx.fillStyle = '#E2E8F0';
      ctx.font = '500 17px sans-serif';
      var mNum = (summary && summary.currentMission) || 1;
      var remaining = Math.max(0, ((summary && summary.missionTarget) || 30) - ((summary && summary.verifiedSentences) || 0));
      var nextStep = isPassed
        ? (mNum >= 32 ? 'Curriculum Complete! Continue with advanced Free Talk.' : ('Advance to Mission ' + (mNum + 1) + '. Continue your live speaking journey.'))
        : ('Complete the remaining ' + remaining + ' verified spoken sentence' + (remaining === 1 ? '' : 's') + ' for Mission ' + mNum + '.');
      ctx.fillText(nextStep, 110, 542);

      ctx.fillStyle = '#64748B';
      ctx.font = '13px monospace';
      var dateStr = (summary && summary.sessionEndedAt) ? new Date(summary.sessionEndedAt).toLocaleString() : new Date().toLocaleString();
      ctx.fillText('VERIFIED COACH RESULT • ' + dateStr + ' • ADMISSION: ' + ((summary && summary.admissionNumber) || 'N/A'), 80, 630);
      ctx.fillText('DETERMINISTIC EVALUATION ENGINE • ZERO CANNED ROTATION • VOICE VERIFIED', 80, 655);

      // Embed Machine-Readable Snapshot Data in the bottom pixel row
      try {
        var snapshot = {
          signature: 'MLC_RESULT_CARD_V1',
          admissionNumber: (summary && summary.admissionNumber) || 'STUDENT',
          name: (summary && summary.name) || 'Student',
          currentMission: (summary && summary.currentMission) || 1,
          missionTitle: (summary && summary.missionTitle) || '',
          verifiedSentences: (summary && summary.verifiedSentences) || 0,
          missionTarget: (summary && summary.missionTarget) || 30,
          progressPct: (summary && summary.progressPct) || 0,
          missionStatus: isPassed ? 'PASSED' : 'IN_PROGRESS',
          sessionEndedAt: (summary && summary.sessionEndedAt) || new Date().toISOString()
        };

        var payloadStr = 'MLC_CARD:' + JSON.stringify(snapshot);
        var imgData = ctx.getImageData(0, 759, 1200, 1);
        var data = imgData.data;
        for (var p = 0; p < payloadStr.length && p * 4 < data.length; p++) {
          var charCode = payloadStr.charCodeAt(p);
          data[p * 4] = charCode & 0xff;
          data[p * 4 + 1] = (charCode >> 8) & 0xff;
          data[p * 4 + 2] = 42;
          data[p * 4 + 3] = 255;
        }
        if (payloadStr.length * 4 < data.length) {
          data[payloadStr.length * 4] = 0;
          data[payloadStr.length * 4 + 1] = 0;
          data[payloadStr.length * 4 + 2] = 0;
          data[payloadStr.length * 4 + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 759);
      } catch (e) {
        console.warn("Canvas pixel metadata embed error:", e);
      }

      return canvas.toDataURL('image/png');
    }

    // Helper to decode machine-readable result card snapshot from an uploaded image
    function decodeResultCardImage(file, callback) {
      if (!file) return callback(new Error("NO_FILE"));
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          try {
            var cvs = document.createElement('canvas');
            cvs.width = img.naturalWidth || img.width;
            cvs.height = img.naturalHeight || img.height;
            var ctx = cvs.getContext('2d');
            if (!ctx) return callback(new Error("CANVAS_CTX_ERROR"));
            ctx.drawImage(img, 0, 0);

            var foundData = null;
            for (var rowIdx = cvs.height - 1; rowIdx >= Math.max(0, cvs.height - 5); rowIdx--) {
              var row = ctx.getImageData(0, rowIdx, cvs.width, 1).data;
              var str = '';
              for (var i = 0; i < row.length; i += 4) {
                var code = row[i] | (row[i + 1] << 8);
                if (code === 0) break;
                str += String.fromCharCode(code);
              }
              if (str.indexOf('MLC_CARD:') === 0) {
                var jsonStr = str.substring('MLC_CARD:'.length);
                foundData = JSON.parse(jsonStr);
                break;
              }
            }

            if (foundData && foundData.signature === 'MLC_RESULT_CARD_V1') {
              return callback(null, foundData);
            }
            return callback(new Error("UNREADABLE_OR_NOT_RESULT_CARD"));
          } catch (err) {
            return callback(err);
          }
        };
        img.onerror = function () {
          callback(new Error("FAILED_TO_LOAD_IMAGE"));
        };
        img.src = e.target.result;
      };
      reader.onerror = function () {
        callback(new Error("FAILED_TO_READ_FILE"));
      };
      reader.readAsDataURL(file);
    }

    // AI Mission Prompts & Guided Practice Modal Component
    function AiMissionPromptModal({ onClose, showToast, currentUser, userProgress, activeModule, onVerifyMclCode }) {
      const [copiedPrompt, setCopiedPrompt] = useState(null);
      const [inputMclCode, setInputMclCode] = useState('');
      const [isVerifyingCode, setIsVerifyingCode] = useState(false);
      const [decodedReport, setDecodedReport] = useState(null);

      const [activeCoachTab, setActiveCoachTab] = useState('voice');
      const [voiceSubMode, setVoiceSubMode] = useState('VOICE'); // 'VOICE' (Live) | 'TEXT' (Fallback)
      const [voiceTranscript, setVoiceTranscript] = useState('');
      const [voiceFeedback, setVoiceFeedback] = useState('');
      const [voiceState, setVoiceState] = useState('IDLE');
      const [voiceAudioLevel, setVoiceAudioLevel] = useState(0);
      const [voiceSpeechSpeed, setVoiceSpeechSpeed] = useState(1.0);
      const [voiceTextInput, setVoiceTextInput] = useState('');
      const [voiceVerifiedCount, setVoiceVerifiedCount] = useState(0);
      const [voiceSessionEnded, setVoiceSessionEnded] = useState(false);
      const [voiceSessionSummary, setVoiceSessionSummary] = useState(null);
      const [coachMode, setCoachMode] = useState('STRUCTURED');
      const [activePromptText, setActivePromptText] = useState('');
      const [conversationTurns, setConversationTurns] = useState([]);
      const [resultCardImage, setResultCardImage] = useState(null);
      const [showRegistrationModal, setShowRegistrationModal] = useState(false);
      const voiceSessionRef = useRef(null);
      const voicePipelineRef = useRef(null);
      const activePromptRef = useRef('');
      const handleStudentVoiceTurnRef = useRef(null);
      const [callDuration, setCallDuration] = useState(0);

      useEffect(() => {
        let timer = null;
        if (voiceState !== 'IDLE' && voiceState !== 'ENDING' && voiceState !== 'ERROR') {
          timer = setInterval(() => {
            setCallDuration(prev => prev + 1);
          }, 1000);
        } else {
          setCallDuration(0);
        }
        return () => {
          if (timer) clearInterval(timer);
        };
      }, [voiceState]);

      const formattedDuration = `${Math.floor(callDuration / 60).toString().padStart(2, '0')}:${(callDuration % 60).toString().padStart(2, '0')}`;

      const updateActivePrompt = (newPrompt) => {
        activePromptRef.current = newPrompt;
        setActivePromptText(newPrompt);
      };

      const admNum = currentUser?.admissionNumber || 'MTR777';
      const cleanAdm = admNum.replace(/[^A-Z0-9]/g, '');
      const studentEmail = (currentUser?.email || '').toLowerCase().trim();

      // Retrieve student's current authoritative module progress map
      const currentStudentProg = (typeof getCurrentStudentProgressMap === 'function') 
        ? getCurrentStudentProgressMap() 
        : (userProgress?.[cleanAdm] || userProgress?.[admNum] || userProgress?.[studentEmail] || {});

      // Calculate initial active mission: first module with < 100% progress
      let derivedMission = activeModule?.moduleNumber || 1;
      let derivedVerified = 0;
      for (let m = 1; m <= 32; m++) {
        const k = `MOD-${m < 10 ? '0' + m : m}`;
        const mObj = currentStudentProg[k] || currentStudentProg[`MOD-${m}`];
        if (mObj) {
          const pct = Number(mObj.percentage) || 0;
          if (pct >= 100) {
            derivedMission = Math.min(32, m + 1);
          } else if (pct > 0) {
            derivedMission = m;
            const t = (window.MasteredCurriculum && window.MasteredCurriculum.getTargetForMission) ? window.MasteredCurriculum.getTargetForMission(m) : (m <= 8 ? 30 : (m <= 23 ? 40 : 50));
            derivedVerified = (typeof mObj.verifiedSentences === 'number') ? mObj.verifiedSentences : Math.round((pct / 100) * t);
            break;
          }
        }
      }

      const activeMissionNumber = derivedMission;
      const modKey = `MOD-${activeMissionNumber < 10 ? '0' + activeMissionNumber : activeMissionNumber}`;
      const modProgObj = currentStudentProg[modKey] || {};
      const currentPct = Number(modProgObj.percentage) || 0;

      const mclCode = encodeMcl1(admNum, activeMissionNumber, currentPct);

      const missionInfo = (window.MasteredCurriculum && window.MasteredCurriculum.getMission) 
        ? window.MasteredCurriculum.getMission(activeMissionNumber)
        : { title: `Module ${activeMissionNumber}`, targetSentences: (activeMissionNumber <= 8 ? 30 : (activeMissionNumber <= 23 ? 40 : 50)), grammarFocus: 'English Fluency', situation: 'Speaking Practice', starterPrompts: ['Please speak your answer aloud in full sentences.'] };

      // Synchronize verified spoken practice directly into Google Sheets StudentProgress database
      const syncVoiceProgressToDatabase = (prof) => {
        if (!prof) return;
        const mNum = prof.currentMission;
        const target = prof.missionTarget || 30;
        const verified = prof.verifiedSentences || 0;
        const pct = Math.min(100, Math.round((verified / target) * 100));

        const mKey = `MOD-${mNum < 10 ? '0' + mNum : mNum}`;
        const activeProg = (typeof getCurrentStudentProgressMap === 'function') ? getCurrentStudentProgressMap() : {};

        const updatedModObj = {
          ...(activeProg[mKey] || {}),
          percentage: pct,
          verifiedSentences: verified,
          aiMissionCompleted: pct > 0,
          status: pct === 100 ? 'COMPLETED' : ((activeProg[mKey] && activeProg[mKey].status) || 'IN_PROGRESS'),
          lastUpdated: new Date().toISOString()
        };

        const updatedMap = { ...activeProg, [mKey]: updatedModObj };

        // Synthesize completed prior missions as 100%
        for (let lvl = 1; lvl < mNum; lvl++) {
          const pKey = `MOD-${lvl < 10 ? '0' + lvl : lvl}`;
          if (!updatedMap[pKey] || !updatedMap[pKey].percentage || Number(updatedMap[pKey].percentage) < 100) {
            updatedMap[pKey] = {
              ...(updatedMap[pKey] || {}),
              percentage: 100,
              aiMissionCompleted: true,
              status: 'COMPLETED'
            };
          }
        }

        // 1. Update React state immediately across all aliases
        setUserProgress(prev => {
          const newState = {
            ...prev,
            [cleanAdm]: updatedMap,
            [admNum]: updatedMap,
            ...(studentEmail ? { [studentEmail]: updatedMap } : {})
          };
          safeStorage.setItem('mastered_all_students_progress', JSON.stringify(newState));
          if (cleanAdm) safeStorage.setItem(`mastered_progress_${cleanAdm}`, JSON.stringify(updatedMap));
          return newState;
        });

        // 2. Persist to Google Sheets database asynchronously (cross-device & admin dashboard!)
        callAppsScript('saveStudentProgress', {
          admissionNumber: cleanAdm || admNum,
          email: studentEmail,
          userProgress: updatedMap
        }).catch(() => {});

        // 3. Mirror authoritative MCL code in database
        const code = encodeMcl1(cleanAdm || admNum, mNum, pct);
        callAppsScript('verifyMclCode', {
          code: code,
          admissionNumber: cleanAdm || admNum,
          email: studentEmail
        }).catch(() => {});
      };

      useEffect(() => {
        // Prevent tearing down active call pipeline if user is already talking in a live session
        if (voicePipelineRef.current && voicePipelineRef.current.isSessionActive) {
          return;
        }

        if (window.MasteredAiCoachEngine && window.MasteredCurriculum) {
          const initP = window.MasteredAiCoachEngine.createProfile({
            admissionNumber: admNum,
            name: currentUser?.name || 'Student',
            currentMission: activeMissionNumber,
            verifiedSentences: derivedVerified,
            userProgress: currentStudentProg
          });

          const session = new window.MasteredAiCoachEngine.AiCoachSession(initP, {
            onSentenceVerified: (p) => {
              syncVoiceProgressToDatabase(p);
            },
            onSaveProgress: (p) => {
              syncVoiceProgressToDatabase(p);
            }
          });
          voiceSessionRef.current = session;
          setVoiceVerifiedCount(session.getProfile().verifiedSentences);

          const curM = session.getMissionDetails();
          const initialPrompt = (curM.starterPrompts && curM.starterPrompts[0]) || "Please introduce yourself aloud in full sentences.";
          updateActivePrompt(initialPrompt);

          if (window.MasteredSpeech && window.MasteredSpeech.LiveVoicePipeline) {
            const pipeline = new window.MasteredSpeech.LiveVoicePipeline({
              speechRate: 0.95,
              onStateChange: (st) => setVoiceState(st),
              onAudioLevel: (lvl) => setVoiceAudioLevel(lvl),
              onTranscriptUpdate: (fullText) => setVoiceTranscript(fullText),
              onStudentTurnComplete: (turnData) => {
                if (handleStudentVoiceTurnRef.current) {
                  handleStudentVoiceTurnRef.current(turnData);
                } else {
                  handleStudentVoiceTurn(turnData);
                }
              },
              onIntentDetected: (intent, text) => {
                if (intent === 'END_SESSION') {
                  handleVoiceCommand('END SESSION');
                } else if (intent === 'PAUSE') {
                  if (voicePipelineRef.current) {
                    voicePipelineRef.current.pauseListening();
                  }
                } else if (intent === 'RESUME') {
                  if (voicePipelineRef.current) {
                    voicePipelineRef.current.resumeListening();
                  }
                } else if (intent === 'SPEAK_SLOW') {
                  setVoiceSpeechSpeed(0.8);
                } else if (intent === 'SPEAK_NORMAL') {
                  setVoiceSpeechSpeed(0.95);
                } else if (intent === 'REPEAT') {
                  if (voicePipelineRef.current) {
                    const promptToRepeat = activePromptRef.current || activePromptText;
                    voicePipelineRef.current.speakCoachResponse(`I'll repeat the task: ${promptToRepeat}`);
                  }
                } else if (intent === 'DONT_UNDERSTAND') {
                  const currentP = activePromptRef.current || activePromptText;
                  const hint = `Here is a tip: Focus on ${missionInfo.grammarFocus}. For instance, try starting with: ${missionInfo.starterPrompts?.[0] || currentP}`;
                  if (voicePipelineRef.current) {
                    voicePipelineRef.current.speakCoachResponse(hint);
                  }
                }
              },
              onError: (err) => {
                if (err && err.code === 'INVALID_TRANSITION') {
                  console.warn("[VoicePipeline Notice]", err.message);
                  return;
                }
                setVoiceFeedback('Notice: ' + (err.message || 'Please check microphone.'));
              }
            });
            voicePipelineRef.current = pipeline;
          }
        }
        return () => {
          if (voicePipelineRef.current && !voicePipelineRef.current.isSessionActive) {
            voicePipelineRef.current.endLiveSession();
          }
        };
      }, [admNum, activeMissionNumber]);

      const handleStudentVoiceTurn = (turnData) => {
        if (!voiceSessionRef.current) return;

        const attempt = voiceSessionRef.current.recordAttempt({
          source: 'speech',
          text: turnData.text,
          confidence: turnData.confidence,
          turnId: turnData.turnId,
          nonce: 'voice_' + activeMissionNumber + '_' + turnData.turnId + '_' + turnData.text.replace(/[^a-zA-Z0-9]/g, '').slice(0, 24)
        });

        const prof = voiceSessionRef.current.getProfile();

        // 1. Retrieve the next speaking question for the student immediately
        const nextQ = voiceSessionRef.current.getNextQuestion 
          ? voiceSessionRef.current.getNextQuestion() 
          : "Please keep speaking your thoughts aloud.";
        
        let coachSpokenMessage = '';
        if (attempt.passed) {
          coachSpokenMessage = `Outstanding job! You completed all ${prof.missionTarget} target sentences for Mission ${prof.currentMission}! Say Next Mission or tap Advance to continue.`;
          updateActivePrompt(coachSpokenMessage);
        } else if (attempt.isIntent) {
          coachSpokenMessage = attempt.feedback;
        } else if (!attempt.eligible) {
          coachSpokenMessage = attempt.feedback;
        } else {
          updateActivePrompt(nextQ);

          const bridges = [
            "Now tell me,",
            "I would also love to know,",
            "Moving forward to our next question,",
            "On that note,",
            "Tell me,",
            "Here is your next speaking question:"
          ];
          const bridge = bridges[prof.verifiedSentences % bridges.length];
          coachSpokenMessage = `${attempt.feedback} ${bridge} ${nextQ}`;
        }

        setVoiceFeedback(coachSpokenMessage);

        setConversationTurns(prev => [
          ...prev,
          { role: 'student', text: turnData.text, eligible: attempt.eligible, increment: attempt.verifiedIncrement, timestamp: Date.now() },
          { role: 'coach', text: coachSpokenMessage, timestamp: Date.now() + 10 }
        ]);

        // 2. DISPATCH COACH SARAH SPEECH INSTANTANEOUSLY (Sub-400ms human turnaround!)
        if (voicePipelineRef.current) {
          voicePipelineRef.current.speakCoachResponse(coachSpokenMessage);
        }

        // 3. Defer verified count state and database sync by 25ms so audio starts speaking without UI thread freeze
        setTimeout(() => {
          setVoiceVerifiedCount(prof.verifiedSentences);
          if (attempt.eligible && attempt.verifiedIncrement > 0) {
            syncVoiceProgressToDatabase(prof);
          }
        }, 25);
      };
      handleStudentVoiceTurnRef.current = handleStudentVoiceTurn;

      const handleStartLivePractice = async () => {
        if (!voicePipelineRef.current) {
          alert("Web Speech API is not supported in this browser. Please use Google Chrome, Microsoft Edge, or Safari.");
          return;
        }
        setVoiceFeedback('');
        setVoiceTranscript('');

        // Prime mobile audio on direct user tap
        if (voicePipelineRef.current.unlockMobileAudio) {
          voicePipelineRef.current.unlockMobileAudio();
        }

        const started = await voicePipelineRef.current.startLiveSession();
        if (started) {
          const initialP = activePromptRef.current || activePromptText;
          const greeting = `Hello ${currentUser?.name || 'Student'}! This is Coach Sarah. Welcome to your live English practice call for Mission ${activeMissionNumber}: ${missionInfo.title}. Let's get started! ${initialP}`;
          setVoiceFeedback(greeting);
          setConversationTurns([{ role: 'coach', text: greeting, timestamp: Date.now() }]);
          voicePipelineRef.current.speakCoachResponse(greeting);
        }
      };

      const handlePauseResumeVoice = () => {
        if (!voicePipelineRef.current) return;
        if (voiceState === 'PAUSED') {
          voicePipelineRef.current.resumeListening();
        } else {
          voicePipelineRef.current.pauseListening();
        }
      };

      const handleInterruptVoice = () => {
        if (!voicePipelineRef.current) return;
        voicePipelineRef.current.handleBargeInInterruption('Student interrupted coach');
      };

      const handleRepeatInstructionVoice = () => {
        if (!voicePipelineRef.current) return;
        const promptToRepeat = activePromptRef.current || activePromptText;
        voicePipelineRef.current.speakCoachResponse(`I'll repeat the task: ${promptToRepeat}`);
      };

      const handleSpeedToggleVoice = () => {
        if (!voicePipelineRef.current) return;
        const newSpeed = voiceSpeechSpeed === 1.0 ? 0.8 : (voiceSpeechSpeed === 0.8 ? 1.15 : 1.0);
        setVoiceSpeechSpeed(newSpeed);
        voicePipelineRef.current.speechRate = newSpeed;
        if (showToast) showToast(`Speech speed set to ${newSpeed}x`);
      };

      const handleTextPracticeSubmit = (e) => {
        if (e) e.preventDefault();
        if (!voiceTextInput.trim() || !voiceSessionRef.current) return;

        const attempt = voiceSessionRef.current.recordAttempt({
          source: 'text', // Strictly rejected from spoken count
          text: voiceTextInput.trim(),
          confidence: 1.0,
          nonce: 'text_' + activeMissionNumber + '_' + voiceTextInput.trim().replace(/[^a-zA-Z0-9]/g, '').slice(0, 24)
        });

        setVoiceFeedback(attempt.feedback);
        setVoiceTextInput('');
        const nextQ = voiceSessionRef.current.getNextQuestion ? voiceSessionRef.current.getNextQuestion() : "Please continue your written practice.";
        setActivePromptText(nextQ);
      };

      const handleVoiceCommand = (cmdStr) => {
        if (!voiceSessionRef.current) return;
        const res = voiceSessionRef.current.dispatchCommand(cmdStr);
        if (!res) return;

        if (res.command === 'FREE TALK') {
          setCoachMode('FREE_TALK');
          setActivePromptText(res.systemMessage);
          setVoiceFeedback("Free Talk mode active. Official mission state is strictly preserved.");
          if (voicePipelineRef.current && voiceState === 'SPEAKING') {
            voicePipelineRef.current.speakCoachResponse(res.systemMessage);
          }
        } else if (res.command === 'START' || res.command === 'CONTINUE') {
          setCoachMode('STRUCTURED');
          setActivePromptText(res.prompt);
          setVoiceFeedback('');
        } else if (res.command === 'HOMEWORK') {
          setVoiceFeedback("Homework: " + res.homework.join(' '));
        } else if (res.command === 'VOCABULARY') {
          setVoiceFeedback("Vocabulary focus: " + res.grammarFocus);
        } else if (res.command === 'NEW STUDENT') {
          setShowRegistrationModal(true);
        } else if (res.command === 'END SESSION') {
          if (voicePipelineRef.current) {
            voicePipelineRef.current.endLiveSession();
          }
          setVoiceSessionSummary(res.summary);
          setVoiceSessionEnded(true);
          try {
            const cardUrl = generateResultCardDataUrl(res.summary);
            setResultCardImage(cardUrl);
          } catch (e) {
            console.warn("Result card creation error:", e);
          }
        }
      };

      const getVoiceStateBadge = (st) => {
        switch (st) {
          case 'LISTENING':
            return { label: 'Listening... Speak naturally', color: 'bg-emerald-500 text-white', pulse: true };
          case 'SPEAKING':
            return { label: 'Coach Speaking... (Speak to interrupt)', color: 'bg-indigo-600 text-white', pulse: true };
          case 'PROCESSING_SPEECH':
            return { label: 'Processing speech...', color: 'bg-blue-600 text-white', pulse: false };
          case 'GENERATING_RESPONSE':
            return { label: 'Thinking...', color: 'bg-purple-600 text-white', pulse: false };
          case 'INTERRUPTED':
            return { label: 'Interrupted! Listening to you...', color: 'bg-amber-500 text-slate-950', pulse: true };
          case 'PAUSED':
            return { label: 'Paused', color: 'bg-slate-500 text-white', pulse: false };
          case 'REQUESTING_MICROPHONE':
            return { label: 'Requesting Mic Access...', color: 'bg-yellow-500 text-slate-950', pulse: false };
          case 'INITIALIZING':

          case 'RECOVERING':

            textArea.value = text;
            document.body.appendChild(textArea);

            document.execCommand("copy");

                        >
                          <span>📥</span>
                          <span>Download Official Result Card (PNG)</span>
                        </button>
                      </div>

                    {/* Image-based Session Continuation / Resume */}
                    <div className="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2 text-xs text-slate-700">
                      <span className="font-bold block text-slate-900">📷 Continue From Saved Result Image:</span>

                          if (!file) return;

                          decodeResultCardImage(file, (err, snapshot) => {
                            if (err || !snapshot) {
                              alert("⚠️ Unreadable or Non-Result Image: Could not verify an official Mastered Language Coach result card from this image. Please upload a valid result card PNG.");
                              return;
                            }

                            const currentAdm = (admNum || '').trim().toUpperCase();
                            const uploadedAdm = (snapshot.admissionNumber || '').trim().toUpperCase();

                            if (currentAdm && uploadedAdm && currentAdm !== 'STUDENT' && currentAdm !== uploadedAdm) {

                              return;

                              voiceSessionRef.current.profile.currentMission = snapshot.currentMission;

                        className="text-xs text-slate-600 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"

        try {
          let res = await callAppsScript('getStudentProgress', {
            admissionNumber: rawAdm || cleanAdm,
            email: email

          // Resilient Fallback: If getStudentProgress fails or errors, call saveStudentProgress with current local progress
          // As verified live, saveStudentProgress performs monotonic merge in Google Sheets and returns the latest cloud progress!

            const currentLocalProg = getCurrentStudentProgressMap();
            res = await callAppsScript('saveStudentProgress', {

          if (res && res.success) {
            const rawData = res.userProgress || res.data || res.progress || res.studentProgress;
            let parsedProgMap = {};

            if (Array.isArray(rawData)) {
              rawData.forEach(item => {
                if (item && item.moduleId) {
                  parsedProgMap[item.moduleId] = item;
                } else if (item && item.moduleNumber) {
                  const modKey = `MOD-${item.moduleNumber < 10 ? '0' + item.moduleNumber : item.moduleNumber}`;
                  parsedProgMap[modKey] = item;
                }
              });
            } else if (rawData && typeof rawData === 'object') {
              parsedProgMap = { ...rawData };
            }

            // Synthesize level & progress from latestLevel if returned
            if (res.latestLevel && Number(res.latestLevel) > 0) {
              const latestLvl = Math.min(32, Math.max(1, Number(res.latestLevel)));
              const latestProg = Number(res.latestProgress) || 100;
              for (let lvl = 1; lvl <= latestLvl; lvl++) {
                const modKey = `MOD-${lvl < 10 ? '0' + lvl : lvl}`;
                if (!parsedProgMap[modKey]) parsedProgMap[modKey] = {};
                const targetPct = (lvl === latestLvl) ? latestProg : 100;
                if (!parsedProgMap[modKey].percentage || Number(parsedProgMap[modKey].percentage) < targetPct) {
                  parsedProgMap[modKey].percentage = targetPct;
                  parsedProgMap[modKey].aiMissionCompleted = true;

            // Normalize and mirror across key aliases (MOD-01, MOD-1, HIND-MOD-01)

              const shortKey = `MOD-${lvl}`;
              const hindKey = `HIND-MOD-${lvl < 10 ? '0' + lvl : lvl}`;
              const foundObj = parsedProgMap[padKey] || parsedProgMap[shortKey] || parsedProgMap[hindKey];
              if (foundObj) {
                parsedProgMap[padKey] = mergeProgressMaps(parsedProgMap[padKey] || {}, foundObj);
                parsedProgMap[shortKey] = mergeProgressMaps(parsedProgMap[shortKey] || {}, foundObj);
                parsedProgMap[hindKey] = mergeProgressMaps(parsedProgMap[hindKey] || {}, foundObj);
              }
            }

            if (Object.keys(parsedProgMap).length > 0) {
              let localHasHigher = false;
              setUserProgress(prev => {
                const currentStudentMap = (cleanAdm && prev[cleanAdm]) || (rawAdm && prev[rawAdm]) || (email && prev[email]) || {};
                const mergedStudentProg = mergeProgressMaps(currentStudentMap, parsedProgMap);
                
                if (JSON.stringify(mergedStudentProg) !== JSON.stringify(parsedProgMap)) {
                  localHasHigher = true;
                }

                const allStudentsProg = {
                  ...prev,
                  ...(cleanAdm ? { [cleanAdm]: mergedStudentProg } : {}),
                  ...(rawAdm ? { [rawAdm]: mergedStudentProg } : {}),
                  ...(email ? { [email]: mergedStudentProg } : {})
                };
                safeStorage.setItem('mastered_all_students_progress', JSON.stringify(allStudentsProg));
                if (cleanAdm) safeStorage.setItem(`mastered_progress_${cleanAdm}`, JSON.stringify(mergedStudentProg));
                if (rawAdm && rawAdm !== cleanAdm) safeStorage.setItem(`mastered_progress_${rawAdm}`, JSON.stringify(mergedStudentProg));
                return allStudentsProg;

              // Also keep currentUser state and session storage synced with latest cloud data

      // Verify & Sync MCL-1 Code
      const handleVerifyMclCode = async (codeStr) => {
        if (!codeStr || !codeStr.trim()) return;

        // 1. Client-Side Instant Pre-Validation
        const decoded = decodeMcl1(codeStr);
        if (!decoded.success) {
          alert("⛔ " + decoded.message);
          return;
        }

        // Check student match on client side with cleaned alphanumeric check
        const currentAdm = (currentUser?.admissionNumber || '').toString().trim().toUpperCase();
        const cleanCurrentAdm = currentAdm.replace(/[^A-Z0-9]/g, '');
        const cleanDecodedAdm = (decoded.admissionNumber || '').toString().trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

        if (cleanCurrentAdm && cleanDecodedAdm && cleanCurrentAdm !== cleanDecodedAdm && cleanCurrentAdm.indexOf(cleanDecodedAdm) < 0 && cleanDecodedAdm.indexOf(cleanCurrentAdm) < 0) {
          alert("⛔ THIS CODE DOES NOT BELONG TO YOUR ACCOUNT\n\nThis progress code was generated for student admission number \"" + decoded.admissionNumber + "\", but your account is \"" + currentAdm + "\". You cannot use another student's progress code.");
          return;
        }

        const activeProg = getCurrentStudentProgressMap();
        const modKey = `MOD-${decoded.mission < 10 ? '0' + decoded.mission : decoded.mission}`;
        const currentModObj = activeProg[modKey] || {};
        const currentPct = Number(currentModObj.percentage) || 0;

        if (decoded.progress <= currentPct) {
          alert("ℹ️ NO NEW PROGRESS\n\nYour current recorded progress for Level " + decoded.mission + " is ALREADY " + currentPct + "%. Progress cannot be reduced.");
          return;
        }

        // Optimistically update local React state and safeStorage
        const updatedModObj = {
          ...currentModObj,
          percentage: decoded.progress,
          status: decoded.progress === 100 ? 'COMPLETED' : (currentModObj.status || 'IN_PROGRESS'),
          aiMissionCompleted: decoded.progress > 0 ? true : currentModObj.aiMissionCompleted,
          lastUpdated: new Date().toISOString()
        };

        const updatedStudentMap = { ...activeProg, [modKey]: updatedModObj };

        // Synthesize previous level 1 to (mission - 1) as completed
        for (let lvl = 1; lvl < decoded.mission; lvl++) {
          const pKey = `MOD-${lvl < 10 ? '0' + lvl : lvl}`;
          if (!updatedStudentMap[pKey]) updatedStudentMap[pKey] = {};
          if (!updatedStudentMap[pKey].percentage || Number(updatedStudentMap[pKey].percentage) < 100) {
            updatedStudentMap[pKey] = {
              ...updatedStudentMap[pKey],
              percentage: 100,
              aiMissionCompleted: true,
              status: 'COMPLETED'
            };
          }
        }

        const key = (currentUser?.admissionNumber || currentUser?.studentId || currentUser?.email || decoded.admissionNumber || '').toString().trim().toUpperCase();

        setUserProgress(prev => {
          const newState = {
            ...prev,
            [key]: updatedStudentMap,
            [cleanCurrentAdm]: updatedStudentMap,
            [cleanDecodedAdm]: updatedStudentMap,
            ...updatedStudentMap
          };
          safeStorage.setItem('mastered_all_students_progress', JSON.stringify(newState));
          if (key) safeStorage.setItem(`mastered_progress_${key}`, JSON.stringify(updatedStudentMap));
          if (cleanCurrentAdm) safeStorage.setItem(`mastered_progress_${cleanCurrentAdm}`, JSON.stringify(updatedStudentMap));
          return newState;

        showToast(`🎉 Level ${decoded.mission} progress updated to ${decoded.progress}%!`);

        try {

            admissionNumber: currentUser?.admissionNumber || decoded.admissionNumber,

                safeStorage.setItem('mastered_all_students_progress', JSON.stringify(newState));
                if (key) safeStorage.setItem(`mastered_progress_${key}`, JSON.stringify(mergedMap));
                return newState;

          if ((targetAdm && rAdm === targetAdm) || (targetEmail && rEmail === targetEmail)) {
            return { ...r, status: 'Approved' };
          }
          return r;
        }));

        // 2. Check if student is ALREADY enrolled in Student Directory
        const alreadyEnrolled = (students || []).some(s => {
          if (!s || typeof s !== 'object') return false;
          const sAdm = (s.admissionNumber || '').toString().trim().toUpperCase();
          const sEmail = (s.email || '').toString().trim().toLowerCase();
          return (targetAdm && sAdm === targetAdm) || (targetEmail && sEmail === targetEmail);

        };

    // Error Boundary Component to Permanently Prevent Blank Screen & Silent Crashes
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("Mastered Portal Application Error:", error, errorInfo);
      }

      handleResetCache = () => {
        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch(e) {}
        window.location.reload();
      };

      render() {
        if (this.state.hasError) {
          const errText = (this.state.error && this.state.error.message) ? this.state.error.message : 'Unknown Session Error';
          return (
            <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-6 text-center space-y-5">
              <div className="w-16 h-16 rounded-full bg-red-600/20 border-2 border-red-500 flex items-center justify-center text-3xl shadow-lg">
                ⚠️
              </div>
              <h2 className="text-xl font-extrabold">Mastered Language Coach Portal Session Restored</h2>
              <p className="text-xs text-slate-300 max-w-md leading-relaxed bg-slate-800/80 p-3 rounded-xl border border-slate-700 font-mono">
                {errText}
              </p>
              <div className="flex flex-col sm:flex-row gap-3 pt-2">
                <button
                  onClick={() => window.location.reload()}
                  className="px-6 py-2.5 bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs rounded-xl shadow-lg transition"
                >
                  🔄 Refresh Session
                </button>
                <button
                  onClick={this.handleResetCache}
                  className="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-extrabold text-xs rounded-xl border border-slate-700 transition"
                >
                  🧹 Clear Local Cache & Launch Clean Portal
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    function initMasteredPortal() {
      const rootEl = document.getElementById('root');
      if (!rootEl) return;
      try {
        ReactDOM.createRoot(rootEl).render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      } catch(err) {
        console.error("Root Mount Exception Caught:", err);
        const msg = err && err.message ? err.message : 'Session Error';
        rootEl.innerHTML = '<div style="min-height:100vh;background:#0f172a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;"><h2>Mastered Language Coach Portal</h2><p style="font-size:13px;color:#94a3b8;">' + msg + '</p></div>';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initMasteredPortal);
    } else {
      initMasteredPortal();
    }
  </script>
